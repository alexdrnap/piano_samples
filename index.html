<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator</title>
<style>
body { font-family: sans-serif; padding: 10px; }
table { border-collapse: collapse; margin-top: 10px; width: 100%; }
td, th { border: 1px solid #888; padding: 5px 10px; text-align: center; }
button.colorBtn { margin: 3px; padding: 10px; min-width: 100px; display: flex; flex-direction: column; align-items: center; }
button .chordName { font-size: 0.7em; color: #333; }
.selectableText { user-select: text; cursor: text; }
.colorSelect { margin-top: 3px; vertical-align:middle; width:100%; }
#playSource { margin: 10px; padding: 15px; font-size: 1.2em; display: flex; flex-direction: column; align-items: center; }
#sourceTriadLabel { font-size: 0.65em; margin-top: 4px; opacity: 0.8; }
.blackRow td { color: white; }
.blackBtn { color: white; }
.blackBtn .chordName { color: white; }
.triadControl { display: inline-flex; flex-direction: column; align-items: center; margin:3px; }
.triadControl .navButtons { margin-top: 3px; display:flex; justify-content:center; width:100%; }
.triadControl .navButtons button { margin:0 2px; }
.triadControl button.playBtn { margin-top:5px; width:100px; height:50px; font-size:1em; }
</style>
</head>

<body>
<h2>Chord Familiarity Generator</h2>

<label>Select reference scale:</label>
<select id="scaleSelect" onchange="generateTable()">
  <option value="major">Major</option>
  <option value="naturalMinor">Natural Minor</option>
  <option value="harmonicMinor">Harmonic Minor</option>
  <option value="melodicMinor">Melodic Minor</option>
</select>

<button id="playSource" onclick="playSourceTriad()">
  Play Source Triad
  <div id="sourceTriadLabel"></div>
</button>

<label>Select sound:</label>
<select onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>

<div id="buttons"></div>
<div id="output"></div>

<script src="https://unpkg.com/tone@latest"></script>
<script>
/* =======================
   CORE PITCH SYSTEM
======================= */

const NOTE_ORDER = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const ENHARMONIC = {
  Db:'C#', Eb:'D#', Gb:'F#', Ab:'G#', Bb:'A#'
};

function normalize(n){ return ENHARMONIC[n] || n; }
function pc(n){ return NOTE_ORDER.indexOf(normalize(n)); }
function note(pc){ return NOTE_ORDER[(pc+12)%12]; }

/* =======================
   SCALES & TRIADS (PC)
======================= */

const SCALES = {
  major:[0,2,4,5,7,9,11],
  naturalMinor:[0,2,3,5,7,8,10],
  harmonicMinor:[0,2,3,5,7,8,11],
  melodicMinor:[0,2,3,5,7,9,11]
};

const BASE_TRIADS = {
  major:[0,4,7],
  naturalMinor:[0,3,7],
  harmonicMinor:[0,3,7],
  melodicMinor:[0,3,7]
};

const DIM_TRIAD=[0,3,6];
const AUG_TRIAD=[0,4,8];

/* =======================
   COLOR SYSTEM
======================= */

const colorMap={
  RED:'#FF4C4C', ORANGE:'#FF9900', GOLD:'#FFD700', YELLOW:'#FFFF66',
  BLUE:'#6699FF', WHITE:'#FFFFFF',
  "LIGHT GREY":'#CCCCCC', "DARK GREY":'#888888', BLACK:'#000000'
};

const colorOrder=Object.keys(colorMap);

/* =======================
   CLASSIFICATION
======================= */

function classify(triad,base,scale){
  let same=triad.filter(n=>base.includes(n)).length;
  let inScale=triad.filter(n=>!base.includes(n)&&scale.includes(n)).length;
  let out=3-same-inScale;

  if(same==2&&inScale==1)return['RED','high'];
  if(same==2&&out==1)return['ORANGE','strong'];
  if(same==1&&inScale==2)return['GOLD','medium'];
  if(same==1&&inScale==1&&out==1)return['YELLOW','medium-low'];
  if(same==1&&out==2)return['BLUE','low'];
  if(same==0&&inScale==3)return['WHITE','very low'];
  if(same==0&&inScale==2)return['LIGHT GREY','rare'];
  if(same==0&&inScale==1)return['DARK GREY','very rare'];
  return['BLACK','alien'];
}

/* =======================
   NAMING
======================= */

function nameTriad(triad){
  const patterns=[
    {i:[0,4,7],l:'major'},
    {i:[0,3,7],l:'minor'},
    {i:[0,3,6],l:'dim'},
    {i:[0,4,8],l:'aug'},
    {i:[0,2,7],l:'sus2'},
    {i:[0,5,7],l:'sus4'}
  ];

  for(let r=0;r<3;r++){
    let rot=[triad[r],triad[(r+1)%3],triad[(r+2)%3]];
    let ints=rot.map(n=>(n-rot[0]+12)%12).sort((a,b)=>a-b);
    for(let p of patterns){
      if(JSON.stringify(ints)===JSON.stringify(p.i))
        return note(rot[0])+' '+p.l;
    }
  }
  return '';
}

/* =======================
   TRIAD GENERATION
======================= */

function generateTriads(base){
  let set=new Set();
  for(let a=-2;a<=2;a++)
    for(let b=-2;b<=2;b++)
      for(let c=-2;c<=2;c++){
        let t=[base[0]+a,base[1]+b,base[2]+c].map(n=>(n+12)%12);
        set.add(t.sort((x,y)=>x-y).join(','));
      }
  return [...set].map(s=>s.split(',').map(Number));
}

/* =======================
   AUDIO
======================= */

let pianoSampler=null, currentSound='piano', currentSynth=null;
const sampleChoiceMap={
  0:["C5","C6"],1:["C#5"],2:["D5"],3:["D#5"],4:["E5"],5:["F5"],
  6:["F#5"],7:["G5"],8:["G#4","G#5"],9:["A4","A5"],10:["A#4","A#5"],11:["B4","B5"]
};

async function changeSound(s){
  currentSound=s;
  if(s==='piano'&&!pianoSampler){
    pianoSampler=new Tone.Sampler({
      urls:{
        "A4":"A4.wav","A5":"A5.wav","A#4":"ASharp4.wav","A#5":"ASharp5.wav",
        "B4":"B4.wav","B5":"B5.wav","C5":"C5.wav","C6":"C6.wav",
        "C#5":"CSharp5.wav","D5":"D5.wav","D#5":"DSharp5.wav",
        "E5":"E5.wav","F5":"F5.wav","F#5":"FSharp5.wav",
        "G5":"G5.wav","G#4":"GSharp4.wav","G#5":"GSharp5.wav"
      },
      baseUrl:"https://raw.githubusercontent.com/alexdrnap/piano_samples/main/"
    }).toDestination();
    await pianoSampler.loaded;
  }
}

async function playChord(triad){
  await Tone.start();
  if(currentSynth){currentSynth.dispose();currentSynth=null;}

  let sorted=[...triad].sort((a,b)=>a-b);
  let notes=sorted.map((p,i)=>sampleChoiceMap[p][i?1:0]);

  if(currentSound==='piano') notes.forEach(n=>pianoSampler.triggerAttackRelease(n,'1n'));
  else{
    currentSynth=new Tone.PolySynth(Tone.AMSynth).toDestination();
    currentSynth.triggerAttackRelease(notes,'1n');
  }
}

/* =======================
   UI
======================= */

let currentTriads=[], activeSource=[];

function playSourceTriad(){ if(activeSource.length) playChord(activeSource); }

function generateTable(){
  const key=scaleSelect.value;
  const scale=SCALES[key];
  const base=BASE_TRIADS[key];
  activeSource=base;
  sourceTriadLabel.textContent=base.map(note).join('-');

  let triads=[];
  generateTriads(base).forEach(t=>{
    const [c,w]=classify(t,base,scale);
    const name=nameTriad(t);
    if(name) triads.push({triad:t,name,computedColor:c,userColor:c,weight:w});
  });

  currentTriads=triads.sort((a,b)=>colorOrder.indexOf(a.computedColor)-colorOrder.indexOf(b.computedColor));

  output.innerHTML='<table><tr><th>Triad</th><th>Name</th><th>Category</th><th>Weight</th></tr>'+
    currentTriads.map(o=>
      `<tr style="background:${colorMap[o.computedColor]};${o.computedColor==='BLACK'?'color:white':''}">
      <td>${o.triad.map(note).join('-')}</td><td>${o.name}</td>
      <td>${o.computedColor}</td><td>${o.weight}</td></tr>`
    ).join('')+'</table>';
}

generateTable();
</script>
</body>
</html>
