<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Play Packages</title>
<script src="https://unpkg.com/tone@14.8.39/build/Tone.js"></script>

<style>
body {
  background:#111;
  color:white;
  font-family:Arial, sans-serif;
  margin:0;
  padding:10px;
}

button, select {
  background:black;
  color:white;
  border:1px solid #555;
  padding:6px;
  margin:3px;
}

.playPackage {
  position:absolute;
  background:#222;
  border:1px solid #555;
  padding:8px;
  border-radius:6px;
  width:210px;
  touch-action:none;
}

.triadBtn, .playBtn {
  width:100%;
  height:42px;
  font-weight:bold;
}

.playBtn {
  font-size:18px;
}

.deleteBtn {
  position:absolute;
  top:4px;
  right:6px;
  cursor:pointer;
  color:#f66;
}

#topBar {
  position:fixed;
  top:5px;
  left:5px;
  background:#000;
  padding:6px;
  z-index:999;
}
</style>
</head>

<body>

<div id="topBar">
  <select id="soundSelect">
    <option value="piano">Piano</option>
    <option value="amsynth">AMSynth</option>
  </select>
  <button id="insertBtn">INSERT PLAY PACKAGE</button>
</div>

<script>
/* ---------------- DATA ---------------- */

const NOTES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const COLORS = [
  {name:'BASE', color:'#00aa55'},
  {name:'RED', color:'#cc3333'},
  {name:'ORANGE', color:'#cc7733'},
  {name:'YELLOW', color:'#cccc33'},
  {name:'BLUE', color:'#3366cc'},
  {name:'INDIGO', color:'#4444aa'},
  {name:'VIOLET', color:'#7733aa'},
  {name:'PINK', color:'#cc3399'},
  {name:'GRAY', color:'#777'}
];

const allTriads = {
  major:      [[0,4,7]],
  naturalMinor:[[0,3,7]],
  melodicMinor:[[0,3,7]],
  harmonicMinor:[[0,3,7]],

  sus2_maj:[[0,2,7]], sus2_min:[[0,2,7]],
  sus4_maj:[[0,5,7]], sus4_min:[[0,5,7]],
  dim_maj:[[0,3,6]],  dim_min:[[0,3,6]],
  aug_maj:[[0,4,8]],  aug_min:[[0,4,8]],

  '7_3Tm_maj':[[0,2,6]],
  '7_3Tm_min':[[0,2,6]],
  '1/2dim_3TM_maj':[[0,4,6]],
  '1/2dim_3TM_min':[[0,4,6]],
  '1/2dim_4m_maj':[[0,2,5]],
  '1/2dim_4m_min':[[0,2,5]],
  '7_4M_maj':[[0,3,5]],
  '7_4M_min':[[0,3,5]]
};

/* ---------------- SOUND ---------------- */

let synth = new Tone.PolySynth(Tone.Synth).toDestination();

document.getElementById('soundSelect').onchange = e => {
  synth.dispose();
  synth = e.target.value === 'amsynth'
    ? new Tone.PolySynth(Tone.AMSynth).toDestination()
    : new Tone.PolySynth(Tone.Synth).toDestination();
};

/* ---------------- STATE ---------------- */

let lastPackageInfo = { key:'C', scale:'major' };
let pkgCount = 0;

/* ---------------- HELPERS ---------------- */

function noteAt(root, semis){
  return NOTES[(NOTES.indexOf(root)+semis+12)%12];
}

function inferFromTriad(t){
  if(!t || !t.name){
    return { key:'C', scale:'major' };
  }

  const root = t.name.trim().split(' ')[0] || 'C';

  const families = [
    'sus2','sus4','dim','aug',
    '7_3Tm','7_4M','1/2dim_3TM','1/2dim_4m'
  ];

  let family = null;
  for(const f of families){
    if(t.name.includes(f)){
      family = f;
      break;
    }
  }

  let quality = 'maj';
  if(t.source && t.source.includes('min')) quality = 'min';

  let scale;
  if(family){
    scale = `${family}_${quality}`;
  } else {
    scale = (quality === 'min') ? 'naturalMinor' : 'major';
  }

  if(!allTriads[scale]) scale = 'major';

  return { key:root, scale };
}

/* ---------------- PACKAGE ---------------- */

function createPackage(x=50,y=80){
  const pkg = document.createElement('div');
  pkg.className='playPackage';
  pkg.style.left=x+'px';
  pkg.style.top=y+'px';

  const del=document.createElement('div');
  del.className='deleteBtn';
  del.textContent='✕';
  del.onclick=()=>pkg.remove();
  pkg.appendChild(del);

  const scaleSel=document.createElement('select');
  Object.keys(allTriads).forEach(s=>{
    const o=document.createElement('option');
    o.value=o.textContent=s;
    scaleSel.appendChild(o);
  });
  scaleSel.value=lastPackageInfo.scale;
  pkg.appendChild(scaleSel);

  const keySel=document.createElement('select');
  NOTES.forEach(n=>{
    const o=document.createElement('option');
    o.value=o.textContent=n;
    keySel.appendChild(o);
  });
  keySel.value=lastPackageInfo.key;
  pkg.appendChild(keySel);

  const colorSel=document.createElement('select');
  COLORS.forEach(c=>{
    const o=document.createElement('option');
    o.value=c.name;
    o.textContent=c.name;
    colorSel.appendChild(o);
  });
  pkg.appendChild(colorSel);

  const triadBtn=document.createElement('button');
  triadBtn.className='triadBtn';
  pkg.appendChild(triadBtn);

  const playBtn=document.createElement('button');
  playBtn.className='playBtn';
  playBtn.textContent='▶';
  pkg.appendChild(playBtn);

  let idx=0;

  function updateTriad(){
    const tri=allTriads[scaleSel.value][0];
    const root=keySel.value;
    const notes=tri.map(s=>noteAt(root,s));
    const name=root+' '+scaleSel.value.replace(/_.*/,'');
    const source=scaleSel.value;

    const col=COLORS.find(c=>c.name===colorSel.value);
    triadBtn.style.background=col.color;
    playBtn.style.background=col.color;

    triadBtn.textContent=name+' ('+source+')';

    const t={name,source,notes};
    lastPackageInfo=inferFromTriad(t);

    playBtn.onclick=async()=>{
      await Tone.start();
      synth.triggerAttackRelease(notes,'1n');
    };
  }

  scaleSel.onchange=updateTriad;
  keySel.onchange=updateTriad;
  colorSel.onchange=updateTriad;

  updateTriad();

  /* ---- drag (mouse + touch) ---- */
  let ox,oy,drag=false;

  const start=e=>{
    drag=true;
    const p=e.touches?e.touches[0]:e;
    ox=p.clientX-pkg.offsetLeft;
    oy=p.clientY-pkg.offsetTop;
  };
  const move=e=>{
    if(!drag)return;
    const p=e.touches?e.touches[0]:e;
    pkg.style.left=p.clientX-ox+'px';
    pkg.style.top=p.clientY-oy+'px';
  };
  const end=()=>drag=false;

  pkg.addEventListener('mousedown',start);
  document.addEventListener('mousemove',move);
  document.addEventListener('mouseup',end);

  pkg.addEventListener('touchstart',start,{passive:false});
  document.addEventListener('touchmove',move,{passive:false});
  document.addEventListener('touchend',end);

  document.body.appendChild(pkg);
}

/* ---------------- INSERT ---------------- */

document.getElementById('insertBtn').onclick=()=>{
  createPackage(60+pkgCount*20,120+pkgCount*20);
  pkgCount++;
};
</script>

</body>
</html>
