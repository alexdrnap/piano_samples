<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>
<style>
/* ---------- GENERAL STYLES ---------- */
body {
    font-family: 'Segoe UI', sans-serif;
    padding: 10px;
    margin: 0;
    background-color: #1e1e1e;
    color: #eee;
}
h2 {
    text-align: center;
    color: #fff;
}

/* ---------- PACKAGE GRID ---------- */
#packagesContainer {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-items: flex-start;
}

/* ---------- PLAY PACKAGE CELL ---------- */
.playPackage {
    position: relative; 
    border: 1px solid #555;
    padding: 12px;
    background: #2c2c2c;
    width: 260px;
    aspect-ratio: 1 / 1; /* maintain square ratio */
    box-sizing: border-box;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    margin: 10px;
    display: inline-block;
    vertical-align: top;
    transform-origin: top left;
}

/* ---------- PACKAGE HEADER ---------- */
.packageHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #3a3a3a;
    padding: 8px 10px;
    border-radius: 8px;
    user-select: none;
}
.packageHeader span {
    font-weight: bold;
    color: #fff;
}

/* ---------- CLOSE BUTTON ---------- */
.deletePackage {
    background: #e74c3c;
    color: #fff;
    font-size: 1.2em;
    padding: 4px 8px;
    border-radius: 6px;
    touch-action: manipulation;
}

/* ---------- TRIAD & PLAY BUTTON ---------- */
.triadBtn, .playBtn {
    width: 100%;
    height: 70px;
    font-size: 0.95em;
    padding: 5px;
    text-align: center;
    border-radius: 8px;
    transition: transform 0.1s;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    word-break: break-word;
}
.triadBtn:active, .playBtn:active {
    transform: scale(0.97);
}
.triadBtn.blackBtn, .playBtn.blackBtn {
    color: #fff;
}

/* ---------- NAV BUTTONS ---------- */
.navButtons {
    display: flex;
    justify-content: center;
    margin: 6px 0;
}
.navButtons button {
    flex: 1;
    margin: 0 3px;
    background-color: #444;
    color: #fff;
    border-radius: 6px;
}
.navButtons button:hover {
    background-color: #555;
}

/* ---------- SELECTS ---------- */
button, select {
    cursor: pointer;
    font-size: 0.95em;
    border: none;
    border-radius: 6px;
    outline: none;
}
select {
    padding: 6px 10px;
    margin: 0 5px 10px 0;
    background-color: #333;
    color: #eee;
}
.colorSelect {
    width: 100%;
    padding: 6px 10px;
    margin: 0 0 10px 0;
    background-color: #333;
    color: #eee;
    border-radius: 6px;
    box-sizing: border-box;
}
button {
    padding: 10px;
    background-color: #444;
    color: #fff;
    transition: background 0.2s;
}
button:hover {
    background-color: #555;
}
.selectableText, .chordName {
    display: block;
    font-weight: 500;
}
</style>
</head>
<body>
<h2>Chord Familiarity Generator - Play Packages</h2>

<label for="soundSelectGlobal">Select Sound:</label>
<select id="soundSelectGlobal" onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>
<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>
<button id="size_toggle">Toggle Size</button>

<div id="packagesContainer"></div>

<script src="https://unpkg.com/tone@latest"></script>
<script>
// ---------------- DATA ----------------
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const scaleIntervals = { major:[0,2,4,5,7,9,11], naturalMinor:[0,2,3,5,7,8,10], harmonicMinor:[0,2,3,5,7,8,11], melodicMinor:[0,2,3,5,7,9,11] };
const baseTriadIntervals = { major:[0,4,7], naturalMinor:[0,3,7], harmonicMinor:[0,3,7], melodicMinor:[0,3,7] };
const keyAbbr = { major:'maj', naturalMinor:'min', harmonicMinor:'harmMin', melodicMinor:'melMin' };
const extraTriadRefs = {
  'sus2_maj':[0,2,7], 'sus2_min':[0,2,7], 'sus4_maj':[0,5,7], 'sus4_min':[0,5,7],
  'aug_maj':[0,4,8], 'aug_min':[0,4,8], 'dim_maj':[0,3,6], 'dim_min':[0,3,6],
  '7_3Tm_maj':[0,2,6], '7_3Tm_min':[0,2,6], '1/2dim_3TM_maj':[0,4,6], '1/2dim_3TM_min':[0,4,6],
  '1/2dim_4m_maj':[0,2,5], '1/2dim_4m_min':[0,2,5], '7_4M_maj':[0,3,5], '7_4M_min':[0,3,5]
};
const colorMap={BASE:'#00AA00',RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',YELLOW:'#FFFF66',BLUE:'#6699FF',WHITE:'#FFFFFF',"LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'};
const colorOrder = ['BASE','RED','ORANGE','GOLD','YELLOW','BLUE','WHITE','LIGHT GREY','DARK GREY','BLACK'];
const sampleChoiceMap = {
  "C":["C5","C6"], "C#":["C#5"], "D":["D5"], "D#":["D#5"], "E":["E5"], "F":["F5"], "F#":["F#5"],
  "G":["G5"], "G#":["G#4","G#5"], "A":["A4","A5"], "A#":["A#4","A#5"], "B":["B4","B5"]
};
const pianoSamplerUrls = {
  "A4":"A4.wav","A5":"A5.wav","A#4":"ASharp4.wav","A#5":"ASharp5.wav",
  "B4":"B4.wav","B5":"B5.wav","C5":"C5.wav","C6":"C6.wav",
  "C#5":"CSharp5.wav","D5":"D5.wav","D#5":"DSharp5.wav",
  "E5":"E5.wav","F5":"F5.wav","F#5":"FSharp5.wav",
  "G5":"G5.wav","G#4":"GSharp4.wav","G#5":"GSharp5.wav"
};

// ---------------- TRIAD FUNCTIONS ----------------
function noteIndex(note){return noteOrder.indexOf(note);}
function transpose(note,semitones){return noteOrder[(noteIndex(note)+12+semitones)%12];}
function normalizeEnharmonics(triad){ return triad.map(n=>{ switch(n){ case 'Db': return 'C#'; case 'Eb': return 'D#'; case 'Gb': return 'F#'; case 'Ab': return 'G#'; case 'Bb': return 'A#'; default: return n; } }); }
function classify(triad,refBase,scale){
  if(triad.slice().sort().join(',') === refBase.slice().sort().join(',')) return ['BASE','1/1'];
  let same=triad.filter(n=>refBase.includes(n)).length;
  let inScale=triad.filter(n=>!refBase.includes(n)&&scale.includes(n)).length;
  let outScale=triad.length-same-inScale;
  if(same==2&&inScale==1)return['RED','3/4'];
  if(same==2&&outScale==1)return['ORANGE','3/5'];
  if(same==1&&inScale==2)return['GOLD','1/2'];
  if(same==1&&inScale==1&&outScale==1)return['YELLOW','2/5'];
  if(same==1&&outScale==2)return['BLUE','1/3'];
  if(same==0&&inScale==3)return['WHITE','1/6'];
  if(same==0&&inScale==2&&outScale==1)return['LIGHT GREY','1/10'];
  if(same==0&&inScale==1&&outScale==2)return['DARK GREY','1/20'];
  if(same==0&&outScale==3)return['BLACK','0'];
  return['UNKNOWN','-'];
}
function nameTriad(triad){
  if(new Set(triad).size<3) return '';
  triad=normalizeEnharmonics(triad);
  const semitone=note=>noteOrder.indexOf(note);
  const mod12=n=> (n+12)%12;
  let tri=triad.map(n=>semitone(n));
  function intervalsFrom(rot){ let ints=rot.map(n=>mod12(n-rot[0])); ints.sort((a,b)=>a-b); return ints; }
  const triads=[{i:[0,4,7],l:'major'},{i:[0,3,7],l:'minor'},{i:[0,3,6],l:'dim'},{i:[0,4,8],l:'aug'},{i:[0,2,7],l:'sus2'},{i:[0,5,7],l:'sus4'}];
  for(let s=0;s<3;s++){ let rot=[tri[s],tri[(s+1)%3],tri[(s+2)%3]]; let ints=intervalsFrom(rot);
    for(let t of triads) if(JSON.stringify(ints)===JSON.stringify(t.i)) return noteOrder[rot[0]]+' '+t.l; }
  for(let s=0;s<3;s++){ let rot=[tri[s],tri[(s+1)%3],tri[(s+2)%3]]; let i1=mod12(rot[1]-rot[0]); let i2=mod12(rot[2]-rot[1]);
    if(i1===2 && i2===3) return noteOrder[rot[0]]+'1/2dim_4m';
    if(i1===3 && i2===2) return noteOrder[rot[2]]+'7_4M';
    if(i1===4 && i2===2) return noteOrder[rot[2]]+'1/2dim_3TM';
    if(i1===2 && i2===4) return noteOrder[rot[1]]+'7_3Tm'; }
  return ''; 
}
function generateTriads(base){
  const semis=[-2,-1,0,1,2]; let results=new Set();
  for(let i=0;i<3;i++) for(let s of semis){ let tri=[...base]; tri[i]=transpose(tri[i],s); results.add(tri.join(',')); }
  for(let i=0;i<2;i++) for(let j=i+1;j<3;j++) for(let s1 of semis) for(let s2 of semis){ let tri=[...base]; tri[i]=transpose(tri[i],s1); tri[j]=transpose(tri[j],s2); results.add(tri.join(',')); }
  for(let s1 of semis) for(let s2 of semis) for(let s3 of semis){ let tri=[transpose(base[0],s1),transpose(base[1],s2),transpose(base[2],s3)]; results.add(tri.join(',')); }
  return Array.from(results).map(r=>r.split(',')); 
}

// ---------------- PLAYBACK ----------------
let currentSound='piano', pianoSampler, currentSynth=null;
async function changeSound(sound){ currentSound=sound;
  if(sound==='piano' && !pianoSampler){ 
    pianoSampler = new Tone.Sampler({ urls:pianoSamplerUrls, baseUrl:"https://raw.githubusercontent.com/alexdrnap/piano_samples/main/" }).toDestination();
    await pianoSampler.loaded; 
  } 
}
function getTriadSamples(triad){
  const normalized=triad.map(n=>{ switch(n){ case 'Db': return 'C#'; case 'Eb': return 'D#'; case 'Gb': return 'F#'; case 'Ab': return 'G#'; case 'Bb': return 'A#'; default: return n; } });
  let notes=normalized.map((note,i)=>{ const options=sampleChoiceMap[note]; if(!options) return null; return (i===0?options[0]:options[1]||options[0]); });
  return notes.filter(Boolean);
}
async function playChord(triad){
  await Tone.start(); if(currentSynth){currentSynth.dispose();currentSynth=null;}
  const notes=getTriadSamples(triad);
  if(currentSound==='piano' && pianoSampler) notes.forEach(n=>pianoSampler.triggerAttackRelease(n,'1n'));
  else if(currentSound==='AMSynth'){ currentSynth=new Tone.PolySynth(Tone.AMSynth).toDestination(); currentSynth.triggerAttackRelease(notes,'1n'); }
}

// ---------------- PRECOMPUTE TRIADS ----------------
const allTriads={};
function computeRefTriads(baseTriad, scaleName, key, scaleNotes, label){
  const triads=generateTriads(baseTriad).map(t=>{
    const [color,degree]=classify(t,baseTriad,scaleNotes);
    const name=nameTriad(t);
    if(!name) return null;
    let nextRef='';
    const rootMatch = name.match(/^([A-G]#?)/);
    let chordOnly = name.replace(/^([A-G]#?)/,'').trim();
    const sourceSuffix = (key+label).endsWith('maj') ? 'maj' : 'min';
    if(['major','minor','dim','aug','sus2','sus4'].includes(chordOnly)){
        if(chordOnly==='major') nextRef='major';
        else if(chordOnly==='minor') nextRef='naturalMinor';
        else nextRef = chordOnly + '_' + sourceSuffix;
    } else { nextRef = chordOnly + '_' + sourceSuffix; }
    return {triad:t,color,degree,name,source:key+label,nextRef};
  }).filter(Boolean);
  return triads;
}
for(let scaleName in scaleIntervals){
  allTriads[scaleName]={};
  for(let root of noteOrder){
    const scaleNotes=scaleIntervals[scaleName].map(i=>noteOrder[(noteIndex(root)+i)%12]);
    const baseTriad=baseTriadIntervals[scaleName].map(i=>noteOrder[(noteIndex(root)+i)%12]);
    allTriads[scaleName][root]=computeRefTriads(baseTriad, scaleName, root, scaleNotes, keyAbbr[scaleName]);
  }
}
for(let refName in extraTriadRefs){
  const baseTriadOffsets = extraTriadRefs[refName];
  const scaleRel = refName.includes('_maj')?'major':'naturalMinor';
  allTriads[refName]={};
  for(let root of noteOrder){
    const scaleNotes=scaleIntervals[scaleRel].map(i=>noteOrder[(noteIndex(root)+i)%12]);
    const baseTriad=baseTriadOffsets.map(i=>noteOrder[(noteIndex(root)+i)%12]);
    allTriads[refName][root]=computeRefTriads(baseTriad, scaleRel, root, scaleNotes, refName);
  }
}

// ---------------- PLAY PACKAGE CREATION ----------------
let allPackages = [];
let nextPackageNumber = 1;
let currentScaleSize = 1;
const sizeOptions = [0.5, 0.75, 1];
let currentSizeIndex = 2; // start at 100%

function createPlayPackage(){
  // Function rewritten above with grid layout
  const container = document.createElement('div'); 
  container.className = 'playPackage'; 
  container.style.transform = `scale(${currentScaleSize})`;
  container.style.transformOrigin = 'top left';
  container.dataset.pkgNumber = nextPackageNumber++;

  container.innerHTML = `
    <div class="packageHeader"><span>Play Package ${container.dataset.pkgNumber}</span><button class="deletePackage">X</button></div>
    <select class="scaleSelect">${Object.keys(allTriads).map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
    <select class="keySelect">${noteOrder.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
    <select class="colorSelect">${colorOrder.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
    <button class="triadBtn"><span class="selectableText"></span><span class="chordName"></span></button>
    <div class="navButtons"><button class="prevBtn">◀</button><button class="nextBtn">▶</button></div>
    <button class="playBtn">Play</button>
  `;

  const containerParent = document.getElementById('packagesContainer');
  containerParent.appendChild(container);
  allPackages.push(container);

  // --- Events, updateTriadForPackage, updateChainFrom, delete, play buttons ---
  // (reuse same logic as previously rewritten function)
  const scaleSelect = container.querySelector('.scaleSelect');
  const keySelect = container.querySelector('.keySelect');
  const colorSelect = container.querySelector('.colorSelect');
  const triadBtn = container.querySelector('.triadBtn');
  let currentIndex = 0;

  function updateTriadForPackage(prevScale, prevKey, prevColor){
    const scale = prevScale || scaleSelect.value;
    const key = prevKey || keySelect.value;
    const color = prevColor || colorSelect.value;
    const list = allTriads[scale][key].filter(t=>t.color===color);
    if(list.length===0) return;
    currentIndex = (currentIndex + list.length) % list.length;
    const t = list[currentIndex];
    triadBtn.querySelector('.selectableText').textContent = t.triad.join('-');
    triadBtn.querySelector('.chordName').innerHTML = t.name+'<br>(Source: '+t.source+')';
    triadBtn.dataset.nextRef = t.nextRef;
    triadBtn.dataset.currentIndex = currentIndex;

    triadBtn.style.background = colorMap[color];
    triadBtn.className = 'triadBtn' + (color==='BLACK'?' blackBtn':'');
    const playBtn = container.querySelector('.playBtn');
    playBtn.style.background = colorMap[color];
    playBtn.className = 'playBtn' + (color==='BLACK'?' blackBtn':'');
    if(color==='BLACK'){
      triadBtn.querySelector('.chordName').style.color='white';
      triadBtn.querySelector('.selectableText').style.color='white';
      playBtn.style.color='white';
    } else {
      triadBtn.querySelector('.chordName').style.color='#333';
      triadBtn.querySelector('.selectableText').style.color='#000';
      playBtn.style.color='#000';
    }
  }

  function updateChainFrom(index){
    for(let i=index+1;i<allPackages.length;i++){
      const prevPkg = allPackages[i-1];
      const pkg = allPackages[i];
      const prevPkgNumber = parseInt(prevPkg.dataset.pkgNumber);
      const currPkgNumber = parseInt(pkg.dataset.pkgNumber);
      if(currPkgNumber - 1 !== prevPkgNumber) continue;
      const prevTriadBtn = prevPkg.querySelector('.triadBtn');
      const prevNextRef = prevTriadBtn.dataset.nextRef || prevPkg.querySelector('.scaleSelect').value;
      const prevKeyMatch = prevTriadBtn.querySelector('.chordName').textContent.match(/^([A-G]#?)/);
      const prevKey = prevKeyMatch ? prevKeyMatch[1] : prevPkg.querySelector('.keySelect').value;
      const prevColor = prevPkg.querySelector('.colorSelect').value;
      pkg.querySelector('.scaleSelect').value = prevNextRef;
      pkg.querySelector('.keySelect').value = prevKey;
      pkg.querySelector('.colorSelect').value = prevColor;
      pkg.dataset.currentIndex = 0;
      pkg.querySelector('.triadBtn').dataset.currentIndex = 0;
      pkg.querySelector('.triadBtn').dataset.nextRef = '';
      const scaleSelect2 = pkg.querySelector('.scaleSelect');
      const keySelect2 = pkg.querySelector('.keySelect');
      const colorSelect2 = pkg.querySelector('.colorSelect');
      const triadBtn2 = pkg.querySelector('.triadBtn');
      const list2 = allTriads[scaleSelect2.value][keySelect2.value].filter(t=>t.color===colorSelect2.value);
      if(list2.length>0){
        const t2=list2[0];
        triadBtn2.querySelector('.selectableText').textContent=t2.triad.join('-');
        triadBtn2.querySelector('.chordName').innerHTML=t2.name+'<br>(Source: '+t2.source+')';
        triadBtn2.dataset.nextRef=t2.nextRef;
        triadBtn2.dataset.currentIndex=0;
        triadBtn2.style.background=colorMap[colorSelect2.value];
        triadBtn2.className='triadBtn'+(colorSelect2.value==='BLACK'?' blackBtn':'');
        const playBtn2=pkg.querySelector('.playBtn');
        playBtn2.style.background=colorMap[colorSelect2.value];
        playBtn2.className='playBtn'+(colorSelect2.value==='BLACK'?' blackBtn':'');
        if(colorSelect2.value==='BLACK'){
          triadBtn2.querySelector('.chordName').style.color='white';
          triadBtn2.querySelector('.selectableText').style.color='white';
          playBtn2.style.color='white';
        } else {
          triadBtn2.querySelector('.chordName').style.color='#333';
          triadBtn2.querySelector('.selectableText').style.color='#000';
          playBtn2.style.color='#000';
        }
      }
    }
  }

  scaleSelect.onchange = keySelect.onchange = colorSelect.onchange = () => {
    updateTriadForPackage();
    updateChainFrom(allPackages.indexOf(container));
  };
  container.querySelector('.prevBtn').onclick = () => { currentIndex--; updateTriadForPackage(); updateChainFrom(allPackages.indexOf(container)); };
  container.querySelector('.nextBtn').onclick = () => { currentIndex++; updateTriadForPackage(); updateChainFrom(allPackages.indexOf(container)); };
  container.querySelector('.playBtn').onclick = () => { 
    const txt = triadBtn.querySelector('.selectableText').textContent;
    if(txt){ const tri=txt.split('-'); playChord(tri); } 
  };
  const deleteBtn = container.querySelector('.deletePackage');
  function handleDelete(){ container.remove(); allPackages = allPackages.filter(p=>p!==container); }
  deleteBtn.addEventListener('click',handleDelete);
  deleteBtn.addEventListener('touchend',e=>{ e.preventDefault(); handleDelete(); });

  if(allPackages.length>1){
    const prevPkg = allPackages[allPackages.length-2];
    const prevPkgNumber = parseInt(prevPkg.dataset.pkgNumber);
    if(parseInt(container.dataset.pkgNumber) - 1 === prevPkgNumber){
      const prevTriadBtn = prevPkg.querySelector('.triadBtn');
      scaleSelect.value = prevTriadBtn.dataset.nextRef || scaleSelect.value;
      keySelect.value = prevPkg.querySelector('.keySelect').value;
      colorSelect.value = prevPkg.querySelector('.colorSelect').value;
    }
  }

  updateTriadForPackage();
}

// ---------------- INSERT BUTTON ----------------
document.getElementById('insertPackageBtn').onclick=()=>{
  createPlayPackage();
};

// ---------------- SIZE TOGGLE ----------------
document.getElementById('size_toggle').onclick = () => {
    currentSizeIndex = (currentSizeIndex + 1) % sizeOptions.length;
    currentScaleSize = sizeOptions[currentSizeIndex];
    allPackages.forEach(pkg => {
        pkg.style.transform = `scale(${currentScaleSize})`;
        pkg.style.transformOrigin = 'top left';
    });
};
</script>
</body>
</html>
