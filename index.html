<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>
<style>
/* ---------------- Global ---------------- */
body {
  font-family: 'Segoe UI', sans-serif;
  padding: 10px;
  background-color: #1e1e1e;
  color: #eee;
  margin: 0;
}

h2 {
  color: #fff;
  text-align: center;
}

button, select {
  cursor: pointer;
  border: none;
  outline: none;
  font-family: inherit;
}

/* ---------------- Play Package ---------------- */
.playPackage {
  position: absolute;
  border: none;
  padding: 0;
  background: #2b2b2b;
  width: 260px;
  z-index: 1000;
  box-sizing: border-box;
  border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.5);
  overflow: hidden;
}

.packageHeader {
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: move;
  background: #3a3a3a;
  padding: 10px 12px;
  border-bottom: 1px solid #444;
  font-weight: bold;
  color: #fff;
}

.deletePackage {
  background: #ff4c4c;
  color: #fff;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 1em;
  cursor: pointer;
  transition: background 0.2s;
}

.deletePackage:hover {
  background: #ff0000;
}

/* ---------------- Selects ---------------- */
.scaleSelect, .keySelect, .colorSelect {
  width: 80%;
  margin: 8px 10%;
  padding: 6px 8px;
  border-radius: 6px;
  background: #3a3a3a;
  color: #fff;
  border: 1px solid #555;
}

/* ---------------- Triad & Play Buttons ---------------- */
.triadBtn, .playBtn {
  width: 90%;
  margin: 8px 5%;
  height: 50px;
  font-size: 0.95em;
  padding: 5px;
  text-align: center;
  border-radius: 10px;
  font-weight: bold;
  box-shadow: 0 3px 6px rgba(0,0,0,0.4);
  transition: transform 0.1s;
}

.triadBtn:active, .playBtn:active {
  transform: scale(0.98);
}

.triadBtn.blackBtn, .playBtn.blackBtn {
  color: #fff;
}

/* Chord Name inside button */
.triadBtn .chordName {
  display: block;
  font-size: 0.8em;
  margin-top: 4px;
  color: #ccc;
}

/* ---------------- Navigation Buttons ---------------- */
.navButtons {
  display: flex;
  justify-content: space-between;
  margin: 5px 10%;
}

.navButtons button {
  width: 45%;
  padding: 6px 0;
  border-radius: 8px;
  background: #555;
  color: #fff;
  transition: background 0.2s;
}

.navButtons button:hover {
  background: #777;
}

/* ---------------- Global Controls ---------------- */
#insertPackageBtn, #soundSelectGlobal {
  margin: 8px;
  padding: 8px 12px;
  border-radius: 8px;
  background: #3a3a3a;
  color: #fff;
  border: 1px solid #555;
  font-size: 1em;
  transition: background 0.2s;
}

#insertPackageBtn:hover, #soundSelectGlobal:hover {
  background: #505050;
}

select:focus, button:focus {
  outline: 2px solid #666;
}
</style>
</head>
<body>
<h2>Chord Familiarity Generator - Play Packages</h2>

<label for="soundSelectGlobal">Select Sound:</label>
<select id="soundSelectGlobal" onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>
<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>

<script src="https://unpkg.com/tone@latest"></script>
<script>
// ---------------- Data & functionality (UNCHANGED) ----------------
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const scaleIntervals = { major:[0,2,4,5,7,9,11], naturalMinor:[0,2,3,5,7,8,10], harmonicMinor:[0,2,3,5,7,8,11], melodicMinor:[0,2,3,5,7,9,11] };
const baseTriadIntervals = { major:[0,4,7], naturalMinor:[0,3,7], harmonicMinor:[0,3,7], melodicMinor:[0,3,7] };
const keyAbbr = { major:'maj', naturalMinor:'min', harmonicMinor:'harmMin', melodicMinor:'melMin' };
const extraTriadRefs = {
  'sus2_maj':[0,2,7], 'sus2_min':[0,2,7], 'sus4_maj':[0,5,7], 'sus4_min':[0,5,7],
  'aug_maj':[0,4,8], 'aug_min':[0,4,8], 'dim_maj':[0,3,6], 'dim_min':[0,3,6],
  '7_3Tm_maj':[0,2,6], '7_3Tm_min':[0,2,6], '1/2dim_3TM_maj':[0,4,6], '1/2dim_3TM_min':[0,4,6],
  '1/2dim_4m_maj':[0,2,5], '1/2dim_4m_min':[0,2,5], '7_4M_maj':[0,3,5], '7_4M_min':[0,3,5]
};
const colorMap={BASE:'#00AA00',RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',YELLOW:'#FFFF66',BLUE:'#6699FF',WHITE:'#FFFFFF',"LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'};
const colorOrder = ['BASE','RED','ORANGE','GOLD','YELLOW','BLUE','WHITE','LIGHT GREY','DARK GREY','BLACK'];
const sampleChoiceMap = {
  "C":["C5","C6"], "C#":["C#5"], "D":["D5"], "D#":["D#5"], "E":["E5"], "F":["F5"], "F#":["F#5"],
  "G":["G5"], "G#":["G#4","G#5"], "A":["A4","A5"], "A#":["A#4","A#5"], "B":["B4","B5"]
};
const pianoSamplerUrls = {
  "A4":"A4.wav","A5":"A5.wav","A#4":"ASharp4.wav","A#5":"ASharp5.wav",
  "B4":"B4.wav","B5":"B5.wav","C5":"C5.wav","C6":"C6.wav",
  "C#5":"CSharp5.wav","D5":"D5.wav","D#5":"DSharp5.wav",
  "E5":"E5.wav","F5":"F5.wav","F#5":"FSharp5.wav",
  "G5":"G5.wav","G#4":"GSharp4.wav","G#5":"GSharp5.wav"
};

// ---------------- Triad & playback functions (UNCHANGED) ----------------
// ... All functions from your original script go here unchanged ...

// ---------------- LAST TRIAD DOM REFERENCE ----------------
let lastTriadBtn = null;

// ---------------- Create Play Package ----------------
function createPlayPackage(x=50,y=50){
  const container=document.createElement('div'); container.className='playPackage'; container.style.left=x+'px'; container.style.top=y+'px';
  container.innerHTML=`
    <div class="packageHeader"><span>Play Package</span><button class="deletePackage">X</button></div>
    <select class="scaleSelect">${Object.keys(allTriads).map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
    <select class="keySelect">${noteOrder.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
    <select class="colorSelect">${colorOrder.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
    <button class="triadBtn"><span class="selectableText"></span><span class="chordName"></span></button>
    <div class="navButtons"><button class="prevBtn">◀</button><button class="nextBtn">▶</button></div>
    <button class="playBtn">Play</button>
  `;
  document.body.appendChild(container);

  const scaleSelect=container.querySelector('.scaleSelect');
  const keySelect=container.querySelector('.keySelect');
  const colorSelect=container.querySelector('.colorSelect');
  const triadBtn=container.querySelector('.triadBtn');

  if(lastTriadBtn){
    const prevChordName = lastTriadBtn.querySelector('.chordName').textContent.split('\n')[0] || '';
    const prevIndex = lastTriadBtn.dataset.currentIndex || 0;
    if(prevChordName){
      const rootMatch = prevChordName.match(/^([A-G]#?)/);
      if(rootMatch) keySelect.value = rootMatch[1];
      const nextRef = lastTriadBtn.dataset.nextRef;
      if(nextRef && allTriads[nextRef]) scaleSelect.value = nextRef;
    }
  }

  let currentIndex=0;
  function updateTriad(){
    const scale=scaleSelect.value;
    const key=keySelect.value;
    const color=colorSelect.value;
    const list=allTriads[scale][key].filter(t=>t.color===color);
    if(list.length===0){
      triadBtn.querySelector('.selectableText').textContent='';
      triadBtn.querySelector('.chordName').textContent='';
      triadBtn.dataset.nextRef='';
      return;
    }
    currentIndex=(currentIndex+list.length)%list.length;
    const t=list[currentIndex];
    triadBtn.querySelector('.selectableText').textContent=t.triad.join('-');
    triadBtn.querySelector('.chordName').innerHTML=t.name+'<br>(Source: '+t.source+')';
    triadBtn.dataset.nextRef = t.nextRef;
    triadBtn.dataset.currentIndex = currentIndex;

    triadBtn.style.background=colorMap[color];
    triadBtn.className='triadBtn'+(color==='BLACK'?' blackBtn':'');

    const playBtn=container.querySelector('.playBtn');
    playBtn.style.background=colorMap[color];
    playBtn.className='playBtn'+(color==='BLACK'?' blackBtn':'');

    if(color==='BLACK'){
      triadBtn.querySelector('.chordName').style.color='white';
      triadBtn.querySelector('.selectableText').style.color='white';
      playBtn.style.color='white';
    } else {
      triadBtn.querySelector('.chordName').style.color='#ccc';
      triadBtn.querySelector('.selectableText').style.color='#fff';
      playBtn.style.color='#fff';
    }

    lastTriadBtn = triadBtn;
  }

  scaleSelect.onchange=()=>{currentIndex=0; updateTriad();};
  keySelect.onchange=()=>{currentIndex=0; updateTriad();};
  colorSelect.onchange=()=>{currentIndex=0; updateTriad();};
  container.querySelector('.prevBtn').onclick=()=>{currentIndex--; updateTriad();};
  container.querySelector('.nextBtn').onclick=()=>{currentIndex++; updateTriad();};
  container.querySelector('.playBtn').onclick=()=>{ 
    const txt=triadBtn.querySelector('.selectableText').textContent;
    if(txt){ const tri=txt.split('-'); playChord(tri); } 
  };
  container.querySelector('.deletePackage').onclick=()=>container.remove();

  const header=container.querySelector('.packageHeader');
  let offsetX=0, offsetY=0, dragging=false;
  function startDrag(e){dragging=true; const ev = e.touches?e.touches[0]:e; offsetX=ev.clientX-container.offsetLeft; offsetY=ev.clientY-container.offsetTop; e.preventDefault();}
  function drag(e){ if(!dragging) return; const ev = e.touches?e.touches[0]:e; container.style.left=(ev.clientX-offsetX)+'px'; container.style.top=(ev.clientY-offsetY)+'px'; }
  function stopDrag(){dragging=false;}
  header.addEventListener('mousedown',startDrag); header.addEventListener('touchstart',startDrag);
  window.addEventListener('mousemove',drag); window.addEventListener('touchmove',drag);
  window.addEventListener('mouseup',stopDrag); window.addEventListener('touchend',stopDrag);

  updateTriad();
}

document.getElementById('insertPackageBtn').onclick=()=>{createPlayPackage(50+20*Math.random(),50+20*Math.random());};
</script>
</body>
</html>
