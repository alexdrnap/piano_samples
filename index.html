<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>
<style>
/* ---------- GENERAL ---------- */
body {
    font-family: 'Segoe UI', sans-serif;
    padding: 10px;
    margin: 0;
    background-color: #1e1e1e;
    color: #eee;
}

h2 {
    text-align: center;
    color: #fff;
}

/* ---------- SELECTS & BUTTONS ---------- */
button, select {
    cursor: pointer;
    font-size: 0.95em;
    border: none;
    border-radius: 6px;
    outline: none;
}

select {
    padding: 6px 10px;
    margin: 0 0 10px 0;
    background-color: #333;
    color: #eee;
}

button {
    padding: 10px;
    background-color: #444;
    color: #fff;
    transition: background 0.2s, transform 0.1s;
}

button:hover {
    background-color: #555;
}

/* ---------- PLAY PACKAGE ---------- */
.playPackage {
    position: absolute;
    border: 1px solid #555;
    padding: 14px;
    background: #2c2c2c;
    width: 280px;
    z-index: 1000;
    box-sizing: border-box;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.6);
}

/* ---------- PACKAGE HEADER ---------- */
.packageHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: move;
    background: #3a3a3a;
    padding: 8px 10px;
    border-radius: 8px;
    user-select: none;
}

.packageHeader span {
    font-weight: bold;
    color: #fff;
}

/* ---------- CLOSE BUTTON ---------- */
.deletePackage {
    background: #e74c3c;
    color: #fff;
    font-size: 1.3em;
    padding: 6px 10px;
    border-radius: 6px;
}

/* ---------- TRIAD BUTTON ---------- */
.triadBtn, .playBtn {
    width: 100%;
    margin: 6px 0;
    height: 60px;
    font-size: 0.95em;
    padding: 0 5px;
    text-align: center;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    transition: transform 0.1s, box-shadow 0.2s;
    background: linear-gradient(145deg, #444, #333);
    color: #fff;
    font-weight: 500;
    box-shadow: inset 0 -2px 3px rgba(0,0,0,0.5);
}

.triadBtn:hover, .playBtn:hover {
    box-shadow: inset 0 -3px 6px rgba(0,0,0,0.6), 0 3px 10px rgba(0,0,0,0.5);
}

.triadBtn.blackBtn, .playBtn.blackBtn {
    color: #fff;
}

/* ---------- NAV BUTTONS ---------- */
.navButtons {
    display: flex;
    justify-content: center;
    margin: 6px 0;
}

.navButtons button {
    flex: 1;
    margin: 0 3px;
    background-color: #444;
    color: #fff;
    border-radius: 6px;
}

.navButtons button:hover {
    background-color: #555;
}

/* ---------- COLOR SELECT ---------- */
.colorSelect {
    width: 100%;
    padding: 6px 10px;
    margin: 6px 0;
    background-color: #333;
    color: #fff;
    border-radius: 8px;
}

/* ---------- TRIAD TEXT ---------- */
.selectableText, .chordName {
    display: block;
    font-weight: 500;
    text-align: center;
}
</style>
</head>
<body>
<h2>Chord Familiarity Generator - Play Packages</h2>

</html>
