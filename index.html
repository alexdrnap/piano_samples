<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Real Piano</title>
<style>
body { font-family: sans-serif; padding: 10px; }
table { border-collapse: collapse; margin-top: 10px; width: 100%; }
td, th { border: 1px solid #888; padding: 5px 10px; text-align: center; }
button.colorBtn { margin: 3px; padding: 10px; min-width: 100px; display: flex; flex-direction: column; align-items: center; }
button .chordName { font-size: 0.7em; color: #333; }
.colorSelect { margin-left:5px; vertical-align:middle; }
button#playSource { margin: 10px; padding: 15px; font-size: 1.2em; background-color:#66CC66; color:#000; }
</style>
</head>
<body>
<h2>Chord Familiarity Generator - Real Piano</h2>

<label for="scaleSelect">Select reference scale:</label>
<select id="scaleSelect" onchange="generateTable()">
  <option value="major">Major</option>
  <option value="naturalMinor">Natural Minor</option>
  <option value="harmonicMinor">Harmonic Minor</option>
  <option value="melodicMinor">Melodic Minor</option>
</select>

<br><br>
<button id="playSource" onclick="playSourceTriad()">Play Source Triad</button>

<br><br>
<label for="soundSelect">Select sound:</label>
<select id="soundSelect" onchange="changeSound(this.value)">
  <option value="piano">Real Piano</option>
  <option value="PolySynth">PolySynth</option>
</select>

<br><br>
<div id="buttons"></div>
<div id="output"></div>

<script src="https://unpkg.com/tone@latest"></script>
<script>
// ------------------- Note & scale utils -------------------
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function noteIndex(note){return noteOrder.indexOf(note);}
function transpose(note,semitones){return noteOrder[(noteIndex(note)+12+semitones)%12];}

const scales={
  major:['C','D','E','F','G','A','B'],
  naturalMinor:['C','D','Eb','F','G','Ab','Bb'],
  harmonicMinor:['C','D','Eb','F','G','Ab','B'],
  melodicMinor:['C','D','Eb','F','G','A','B']
};
const baseTriads={
  major:['C','E','G'],
  naturalMinor:['C','Eb','G'],
  harmonicMinor:['C','Eb','G'],
  melodicMinor:['C','Eb','G']
};
const dimTriad=['C','Eb','Gb'];
const augTriad=['C','E','G#'];

let currentTriads=[];
let currentSound='piano';
let pianoSampler=null;
let activeSourceTriad=[];
let currentSynth=null;

const colorMap={RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',YELLOW:'#FFFF66',BLUE:'#6699FF',WHITE:'#FFFFFF',"LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'};

// ------------------- Triad classification -------------------
function classify(triad,refBase,scale){
  let same=triad.filter(n=>refBase.includes(n)).length;
  let inScale=triad.filter(n=>!refBase.includes(n)&&scale.includes(n)).length;
  let outScale=triad.length-same-inScale;
  if(same==2&&inScale==1)return['RED','3/4'];
  if(same==2&&outScale==1)return['ORANGE','3/5'];
  if(same==1&&inScale==2)return['GOLD','1/2'];
  if(same==1&&inScale==1&&outScale==1)return['YELLOW','2/5'];
  if(same==1&&outScale==2)return['BLUE','1/3'];
  if(same==0&&inScale==3)return['WHITE','1/6'];
  if(same==0&&inScale==2&&outScale==1)return['LIGHT GREY','1/10'];
  if(same==0&&inScale==1&&outScale==2)return['DARK GREY','1/20'];
  if(same==0&&outScale==3)return['BLACK','0'];
  return['UNKNOWN','-'];
}

function normalizeEnharmonics(triad){
  return triad.map(n=>{
    switch(n){case 'Db': return 'C#'; case 'Eb': return 'D#'; case 'Gb': return 'F#'; case 'Ab': return 'G#'; case 'Bb': return 'A#'; default: return n;}
  });
}

function nameTriad(triad){
  if(new Set(triad).size<3) return '';
  triad=normalizeEnharmonics(triad);
  const semitone=note=>noteOrder.indexOf(note);
  const mod12=n=> (n+12)%12;
  let tri=triad.map(n=>semitone(n));

  function intervalsFrom(rot){
    let ints=rot.map(n=>mod12(n-rot[0]));
    ints.sort((a,b)=>a-b);
    return ints;
  }

  const triads=[
    {i:[0,4,7],l:'major'},
    {i:[0,3,7],l:'minor'},
    {i:[0,3,6],l:'dim'},
    {i:[0,4,8],l:'aug'},
    {i:[0,2,7],l:'sus2'},
    {i:[0,5,7],l:'sus4'}
  ];

  for(let s=0;s<3;s++){
    let rot=[tri[s],tri[(s+1)%3],tri[(s+2)%3]];
    let ints=intervalsFrom(rot);
    for(let t of triads){
      if(JSON.stringify(ints)===JSON.stringify(t.i)){
        return noteOrder[rot[0]]+' '+t.l;
      }
    }
  }
  return '';
}

// ------------------- Triad generation -------------------
function generateTriads(base){
  const semis=[-2,-1,0,1,2];
  let results=new Set();
  for(let i=0;i<3;i++) for(let s of semis){ let tri=[...base]; tri[i]=transpose(tri[i],s); results.add(tri.join(',')); }
  for(let i=0;i<2;i++) for(let j=i+1;j<3;j++) for(let s1 of semis) for(let s2 of semis){
    let tri=[...base]; tri[i]=transpose(tri[i],s1); tri[j]=transpose(tri[j],s2); results.add(tri.join(','));
  }
  for(let s1 of semis) for(let s2 of semis) for(let s3 of semis){
    results.add([transpose(base[0],s1),transpose(base[1],s2),transpose(base[2],s3)].join(','));
  }
  return Array.from(results).map(r=>r.split(','));
}

// ------------------- Real piano samples mapping from GitHub -------------------
const githubBase = "https://raw.githubusercontent.com/alexdrnap/piano_samples/main/";
const pianoSampleMap = {
  "G#4":"G4#.wav","A4":"A4.wav","A#4":"A#4.wav","B4":"B4.wav",
  "C5":"C5.wav","C#5":"C#5.wav","D5":"D5.wav","D#5":"D#5.wav","E5":"E5.wav","F5":"F5.wav","F#5":"F#5.wav",
  "G5":"G5.wav","G#5":"G#5.wav","A5":"A5.wav","A#5":"A#5.wav","B5":"B5.wav","C6":"C6.wav"
};

// ------------------- Sound selection -------------------
async function changeSound(sound){
  currentSound = sound;

  if(sound === 'piano'){
    if(!pianoSampler){
      pianoSampler = new Tone.Sampler({
        urls: pianoSampleMap,
        baseUrl: githubBase
      }).toDestination();
      pianoSampler.loaded.then(()=>console.log("Piano sampler loaded"));
    }
  }
}

// ------------------- Play chord -------------------
async function playChord(notes){
  await Tone.start();

  if(currentSound === 'piano'){
    if(!pianoSampler) return;
    if(!pianoSampler.loaded){
      console.log("Waiting for sampler to load...");
      await pianoSampler.loaded;
    }

    for(let note of notes){
      let n = normalizeEnharmonics([note])[0];
      let base = n.replace(/[0-9]/g,'');
      let octave = parseInt(n.replace(/[^\d]/g,''),10);
      // Clamp to available samples
      if(octave < 4) octave = 4;
      if(octave > 6) octave = 6;
      let finalNote = base + octave;
      if(!pianoSampleMap[finalNote]){
        console.warn("No sample for note:", finalNote);
        continue;
      }
      pianoSampler.triggerAttackRelease(finalNote,"1n");
      await new Promise(r=>setTimeout(r,100)); // small gap between notes
    }
  } else {
    if(currentSynth){ currentSynth.dispose(); currentSynth=null; }
    currentSynth = new Tone.PolySynth(Tone.Synth).toDestination();
    currentSynth.triggerAttackRelease(notes.map(n=>n+'5'),"1n");
  }
}

function playChordFromButton(btn){
  const chordText = btn.querySelector('.chordText').textContent.trim();
  if(!chordText) return;
  const notes = chordText.split('-');
  playChord(notes);
}

function playSourceTriad(){if(activeSourceTriad.length>0) playChord(activeSourceTriad);}

// ------------------- Generate table and buttons -------------------
function generateTable(){
  const scaleKey=document.getElementById('scaleSelect').value;
  const scale=scales[scaleKey];
  activeSourceTriad=baseTriads[scaleKey];

  let cTriads=[];
  let mainC=generateTriads(baseTriads[scaleKey]);
  mainC.forEach(t=>{
    const refBase=baseTriads[scaleKey];
    const [color,degree]=classify(t,refBase,scale);
    const name=nameTriad(t);
    if(name) cTriads.push({triad:t,color,degree,name,source:scaleKey});
  });

  if(scaleKey!=='major'){
    let dimC=generateTriads(dimTriad);
    dimC.forEach(t=>{
      const refBase=baseTriads[scaleKey];
      const [color,degree]=classify(t,refBase,scale);
      const name=nameTriad(t);
      if(name) cTriads.push({triad:t,color,degree,name,source:'C dim'});
    });
  } else {
    let augC=generateTriads(augTriad);
    augC.forEach(t=>{
      const refBase=baseTriads[scaleKey];
      const [color,degree]=classify(t,refBase,scale);
      const name=nameTriad(t);
      if(name) cTriads.push({triad:t,color,degree,name,source:'C aug'});
    });
  }

  let uniqueC=[]; let seen=new Set();
  cTriads.forEach(obj=>{
    let canonical=obj.triad.slice().sort((a,b)=>noteOrder.indexOf(a)-noteOrder.indexOf(b)).join(',');
    if(!seen.has(canonical)){ seen.add(canonical); uniqueC.push(obj); }
  });
  currentTriads=uniqueC;

  let html='<table><tr><th>Triad</th><th>Chord Name</th><th>Category</th><th>Degree</th><th>Source</th></tr>';
  uniqueC.forEach(obj=>{
    html+=`<tr><td>${obj.triad.join('-')}</td><td>${obj.name}</td><td>${obj.color}</td><td>${obj.degree}</td><td>${obj.source}</td></tr>`;
  });
  html+='</table>';
  document.getElementById('output').innerHTML=html;

  let colors=['RED','ORANGE','GOLD','YELLOW','BLUE','WHITE','LIGHT GREY','DARK GREY','BLACK'];
  let btnHTML='';
  colors.forEach(c=>{
    let filtered=currentTriads.filter(t=>t.color===c);
    let randomChord=filtered.length>0 ? filtered[Math.floor(Math.random()*filtered.length)] : null;
    let chordName=randomChord ? randomChord.name : '';
    let chordNotes=randomChord ? randomChord.triad : [];
    let colorHex=colorMap[c];
    btnHTML+=`<div style="margin-bottom:5px;">
      <button class='colorBtn' style='background-color:${colorHex};' onclick='pickChord("${c}", this)'>
        <span class="chordText">${chordNotes.join('-')}</span>
        <span class='chordName'>${chordName}</span>
      </button>
      <select class='colorSelect' onchange='updateButtonColorFromSelect(this)'>
        ${Object.entries(colorMap).map(([k,v])=>`<option value='${v}' ${v===colorHex?'selected':''}>${k}</option>`).join('')}
      </select>
      <button onclick='playChordFromButton(this.previousElementSibling.previousElementSibling)'>Play</button>
    </div>`;
  });
  document.getElementById('buttons').innerHTML=btnHTML;
}

function pickChord(color,btn){
  let filtered=currentTriads.filter(t=>t.color===color);
  if(filtered.length>0){
    let choice=filtered[Math.floor(Math.random()*filtered.length)];
    btn.querySelector('.chordText').textContent = choice.triad.join('-');
    btn.querySelector('.chordName').textContent = choice.name;
  }
}

function updateButtonColorFromSelect(select){
  let btn=select.previousElementSibling;
  btn.style.backgroundColor=select.value;
  let chordText=btn.querySelector('.chordText').textContent.trim();
  let chordObj=currentTriads.find(t=>t.triad.join('-')===chordText);
  if(chordObj) chordObj.color=select.value;
}

changeSound('piano'); // preload
generateTable();
</script>
</body>
</html>
