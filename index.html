<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    padding: 10px;
    margin: 0;
    background-color: #1e1e1e;
    color: #eee;
}
h2 { text-align: center; color: #fff; }

button, select {
    cursor: pointer;
    font-size: 0.95em;
    border: none;
    border-radius: 6px;
    outline: none;
}
select {
    padding: 6px 10px;
    margin: 0 5px 10px 0;
    background-color: #333;
    color: #eee;
}
.colorSelect {
    width: 100%;
    padding: 6px 10px;
    margin-bottom: 10px;
    background-color: #333;
    color: #eee;
}
button {
    padding: 10px;
    background-color: #444;
    color: #fff;
}
button:hover { background-color: #555; }

.playPackage {
    position: absolute;
    border: 1px solid #555;
    padding: 12px;
    background: #2c2c2c;
    width: 260px;
    z-index: 1000;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.packageHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: move;
    background: #3a3a3a;
    padding: 8px 10px;
    border-radius: 8px;
    user-select: none;
}

.deletePackage {
    background: #e74c3c;
    color: #fff;
    font-size: 1.2em;
    padding: 4px 8px;
    border-radius: 6px;
}

.triadBtn, .playBtn {
    width: 100%;
    height: 70px;
    font-size: 0.95em;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.navButtons {
    display: flex;
    margin: 6px 0;
}
.navButtons button { flex: 1; margin: 0 3px; }
.blackBtn { color: #fff; }
</style>
</head>

<body>
<h2>Chord Familiarity Generator - Play Packages</h2>

<label>Select Sound:</label>
<select id="soundSelectGlobal" onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>
<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>

<script src="https://unpkg.com/tone@latest"></script>
<script>
// ---------- DATA ----------
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const scaleIntervals={
  major:[0,2,4,5,7,9,11],
  naturalMinor:[0,2,3,5,7,8,10],
  harmonicMinor:[0,2,3,5,7,8,11],
  melodicMinor:[0,2,3,5,7,9,11]
};
const baseTriadIntervals={
  major:[0,4,7],
  naturalMinor:[0,3,7],
  harmonicMinor:[0,3,7],
  melodicMinor:[0,3,7]
};
const keyAbbr={ major:'maj', naturalMinor:'min', harmonicMinor:'harmMin', melodicMinor:'melMin' };
const colorMap={ BASE:'#00AA00',RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',YELLOW:'#FFFF66',BLUE:'#6699FF',WHITE:'#FFFFFF',"LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'};
const colorOrder=Object.keys(colorMap);

// ---------- HELPERS ----------
const noteIndex=n=>noteOrder.indexOf(n);
const transpose=(n,s)=>noteOrder[(noteIndex(n)+12+s)%12];

// ---------- TRIADS ----------
function generateTriads(base){
  const semis=[-2,-1,0,1,2], out=new Set();
  for(let s1 of semis) for(let s2 of semis) for(let s3 of semis)
    out.add([transpose(base[0],s1),transpose(base[1],s2),transpose(base[2],s3)].join(','));
  return [...out].map(t=>t.split(','));
}

function classify(t,b,s){
  const same=t.filter(n=>b.includes(n)).length;
  const ins=t.filter(n=>!b.includes(n)&&s.includes(n)).length;
  const out=t.length-same-ins;
  if(same===3) return ['BASE','1/1'];
  if(same===2&&ins===1) return ['RED','3/4'];
  if(same===2&&out===1) return ['ORANGE','3/5'];
  if(same===1&&ins===2) return ['GOLD','1/2'];
  if(same===1&&ins===1&&out===1) return ['YELLOW','2/5'];
  if(same===1&&out===2) return ['BLUE','1/3'];
  if(same===0&&ins===3) return ['WHITE','1/6'];
  if(same===0&&ins===2) return ['LIGHT GREY','1/10'];
  if(same===0&&ins===1) return ['DARK GREY','1/20'];
  return ['BLACK','0'];
}

const allTriads={};
for(let sc in scaleIntervals){
  allTriads[sc]={};
  for(let r of noteOrder){
    const scale=scaleIntervals[sc].map(i=>noteOrder[(noteIndex(r)+i)%12]);
    const base=baseTriadIntervals[sc].map(i=>noteOrder[(noteIndex(r)+i)%12]);
    allTriads[sc][r]=generateTriads(base).map(t=>{
      const [c,d]=classify(t,base,scale);
      return {triad:t,color:c,degree:d,name:t.join('-'),nextRef:sc};
    });
  }
}

// ---------- PLAY PACKAGE ----------
function createPlayPackage(x=60,y=60){
  const box=document.createElement('div');
  box.className='playPackage';
  box.style.left=x+'px'; box.style.top=y+'px';

  box.innerHTML=`
    <div class="packageHeader">
      <span>Play Package</span>
      <button class="deletePackage">X</button>
    </div>
    <select class="scaleSelect">${Object.keys(allTriads).map(s=>`<option>${s}</option>`).join('')}</select>
    <select class="keySelect">${noteOrder.map(n=>`<option>${n}</option>`).join('')}</select>
    <select class="colorSelect">${colorOrder.map(c=>`<option>${c}</option>`).join('')}</select>
    <button class="triadBtn"></button>
    <div class="navButtons"><button class="prevBtn">◀</button><button class="nextBtn">▶</button></div>
    <button class="playBtn">Play</button>
  `;
  document.body.appendChild(box);

  const scaleSel=box.querySelector('.scaleSelect');
  const keySel=box.querySelector('.keySelect');
  const colorSel=box.querySelector('.colorSelect');
  const triBtn=box.querySelector('.triadBtn');
  let idx=0;

  function update(){
    const list=allTriads[scaleSel.value][keySel.value].filter(t=>t.color===colorSel.value);
    if(!list.length){ triBtn.textContent=''; return; }
    idx=(idx+list.length)%list.length;
    const t=list[idx];
    triBtn.textContent=t.name;
    triBtn.style.background=colorMap[t.color];
  }
  scaleSel.onchange=keySel.onchange=colorSel.onchange=()=>{idx=0;update();};
  box.querySelector('.prevBtn').onclick=()=>{idx--;update();};
  box.querySelector('.nextBtn').onclick=()=>{idx++;update();};
  box.querySelector('.deletePackage').onclick=()=>box.remove();

  // ---------- MOBILE DRAG FIX ----------
  const header=box.querySelector('.packageHeader');
  const delBtn=box.querySelector('.deletePackage');
  let drag=false,ox=0,oy=0;

  delBtn.addEventListener('touchstart',e=>e.stopPropagation());

  function startDrag(e){
    if(e.target===delBtn) return;
    drag=true;
    const p=e.touches?e.touches[0]:e;
    ox=p.clientX-box.offsetLeft;
    oy=p.clientY-box.offsetTop;
    e.preventDefault();
  }
  function move(e){
    if(!drag) return;
    const p=e.touches?e.touches[0]:e;
    box.style.left=p.clientX-ox+'px';
    box.style.top=p.clientY-oy+'px';
  }
  function stop(){ drag=false; }

  header.addEventListener('mousedown',startDrag);
  header.addEventListener('touchstart',startDrag);
  window.addEventListener('mousemove',move);
  window.addEventListener('touchmove',move);
  window.addEventListener('mouseup',stop);
  window.addEventListener('touchend',stop);

  update();
}

document.getElementById('insertPackageBtn').onclick=()=>createPlayPackage(80,80);
</script>
</body>
</html>
