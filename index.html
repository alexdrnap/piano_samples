<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    padding: 10px;
    margin: 0;
    background-color: #1e1e1e;
    color: #eee;
}

h2 {
    text-align: center;
    color: #fff;
}

button, select {
    cursor: pointer;
    font-size: 0.95em;
    border: none;
    border-radius: 6px;
    outline: none;
}

select {
    padding: 6px 10px;
    margin: 0 5px 10px 0;
    background-color: #333;
    color: #eee;
}

.colorSelect {
    width: 100%;
    padding: 6px 10px;
    margin: 0 0 10px 0;
    background-color: #333;
    color: #eee;
    border-radius: 6px;
    box-sizing: border-box;
}

button {
    padding: 10px;
    background-color: #444;
    color: #fff;
    transition: background 0.2s;
}

button:hover {
    background-color: #555;
}

.playPackage {
    position: absolute;
    border: 1px solid #555;
    padding: 12px;
    background: #2c2c2c;
    width: 260px;
    z-index: 1000;
    box-sizing: border-box;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

.packageHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: move;
    background: #3a3a3a;
    padding: 8px 10px;
    border-radius: 8px;
    user-select: none;
}

.packageHeader span {
    font-weight: bold;
    color: #fff;
}

.deletePackage {
    background: #e74c3c;
    color: #fff;
    font-size: 1.2em;
    padding: 4px 8px;
    border-radius: 6px;
}

.triadBtn, .playBtn {
    width: 100%;
    height: 70px;
    font-size: 0.95em;
    padding: 5px;
    text-align: center;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    word-break: break-word;
}

.triadBtn.blackBtn, .playBtn.blackBtn {
    color: #fff;
}

.navButtons {
    display: flex;
    justify-content: center;
    margin: 6px 0;
}

.navButtons button {
    flex: 1;
    margin: 0 3px;
}

.selectableText, .chordName {
    display: block;
    font-weight: 500;
}
</style>
</head>

<body>
<h2>Chord Familiarity Generator - Play Packages</h2>

<label>Select Sound:</label>
<select id="soundSelectGlobal" onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>

<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>

<script src="https://unpkg.com/tone@latest"></script>
<script>
// ---------------- DATA (UNCHANGED) ----------------
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const scaleIntervals={major:[0,2,4,5,7,9,11],naturalMinor:[0,2,3,5,7,8,10],harmonicMinor:[0,2,3,5,7,8,11],melodicMinor:[0,2,3,5,7,9,11]};
const baseTriadIntervals={major:[0,4,7],naturalMinor:[0,3,7],harmonicMinor:[0,3,7],melodicMinor:[0,3,7]};
const keyAbbr={major:'maj',naturalMinor:'min',harmonicMinor:'harmMin',melodicMinor:'melMin'};
const colorMap={BASE:'#00AA00',RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',YELLOW:'#FFFF66',BLUE:'#6699FF',WHITE:'#FFFFFF',"LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'};
const colorOrder=['BASE','RED','ORANGE','GOLD','YELLOW','BLUE','WHITE','LIGHT GREY','DARK GREY','BLACK'];

// ---------------- PLAY PACKAGE ----------------
let lastTriadBtn=null;

function createPlayPackage(x=50,y=50){
  const container=document.createElement('div');
  container.className='playPackage';
  container.style.left=x+'px';
  container.style.top=y+'px';

  container.innerHTML=`
    <div class="packageHeader">
      <span>Play Package</span>
      <button class="deletePackage">X</button>
    </div>
    <select class="scaleSelect"><option>major</option></select>
    <select class="keySelect">${noteOrder.map(n=>`<option>${n}</option>`).join('')}</select>
    <select class="colorSelect">${colorOrder.map(c=>`<option>${c}</option>`).join('')}</select>
    <button class="triadBtn"><span class="selectableText"></span><span class="chordName"></span></button>
    <div class="navButtons"><button>◀</button><button>▶</button></div>
    <button class="playBtn">Play</button>
  `;

  document.body.appendChild(container);

  // ---------- DELETE BUTTON FIX ----------
  const deleteBtn = container.querySelector('.deletePackage');
  deleteBtn.addEventListener('click', () => container.remove());
  deleteBtn.addEventListener('touchstart', e => e.stopPropagation());

  // ---------- DRAG FIX ----------
  const header = container.querySelector('.packageHeader');
  let offsetX=0, offsetY=0, dragging=false;

  function startDrag(e){
    if (e.target.classList.contains('deletePackage')) return;

    dragging=true;
    const ev=e.touches?e.touches[0]:e;
    offsetX=ev.clientX-container.offsetLeft;
    offsetY=ev.clientY-container.offsetTop;
    e.preventDefault();
  }

  function drag(e){
    if(!dragging) return;
    const ev=e.touches?e.touches[0]:e;
    container.style.left=(ev.clientX-offsetX)+'px';
    container.style.top=(ev.clientY-offsetY)+'px';
  }

  function stopDrag(){dragging=false;}

  header.addEventListener('mousedown',startDrag);
  header.addEventListener('touchstart',startDrag,{passive:false});
  window.addEventListener('mousemove',drag);
  window.addEventListener('touchmove',drag,{passive:false});
  window.addEventListener('mouseup',stopDrag);
  window.addEventListener('touchend',stopDrag);
}

document.getElementById('insertPackageBtn').onclick=()=>{
  createPlayPackage(50+20*Math.random(),50+20*Math.random());
};
</script>
</body>
</html>
