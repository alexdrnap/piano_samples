<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>
<style>
/* ---------- GENERAL STYLES ---------- */
body {
    font-family: 'Segoe UI', sans-serif;
    padding: 10px;
    margin: 0;
    background-color: #1e1e1e;
    color: #eee;
}
h2 {
    text-align: center;
    color: #fff;
}

/* ---------- BUTTONS & SELECTS ---------- */
button, select {
    cursor: pointer;
    font-size: 0.95em;
    border: none;
    border-radius: 6px;
    outline: none;
}
select {
    padding: 6px 10px;
    margin: 0 5px 10px 0;
    background-color: #333;
    color: #eee;
}
.colorSelect {
    width: 100%;
    padding: 6px 10px;
    margin: 0 0 10px 0;
    background-color: #333;
    color: #eee;
    border-radius: 6px;
    box-sizing: border-box;
}
button {
    padding: 10px;
    background-color: #444;
    color: #fff;
    transition: background 0.2s;
}
button:hover {
    background-color: #555;
}

/* ---------- GRID CONTAINER ---------- */
#packagesContainer {
    display: flex;
    flex-wrap: wrap;
    justify-content: flex-start;
    align-items: stretch; /* ensures uniform height per row */
    gap: 12px;
    margin-top: 20px;
}

/* ---------- PLAY PACKAGE CELL ---------- */
.playPackage {
    border: 1px solid #555;
    padding: 12px;
    background: #2c2c2c;
    width: 260px;
    box-sizing: border-box;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    transform-origin: top left;
}

/* ---------- PACKAGE HEADER ---------- */
.packageHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #3a3a3a;
    padding: 8px 10px;
    border-radius: 8px;
    user-select: none;
}
.packageHeader span {
    font-weight: bold;
    color: #fff;
}

/* ---------- CLOSE BUTTON ---------- */
.deletePackage {
    background: #e74c3c;
    color: #fff;
    font-size: 1.2em;
    padding: 4px 8px;
    border-radius: 6px;
    touch-action: manipulation;
}

/* ---------- TRIAD & PLAY BUTTON ---------- */
.triadBtn, .playBtn {
    width: 100%;
    height: 70px;
    font-size: 0.95em;
    padding: 5px;
    text-align: center;
    border-radius: 8px;
    transition: transform 0.1s;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    word-break: break-word;
    margin-bottom: 8px;
}
.triadBtn:active, .playBtn:active {
    transform: scale(0.97);
}
.triadBtn.blackBtn, .playBtn.blackBtn {
    color: #fff;
}

/* ---------- NAV BUTTONS ---------- */
.navButtons {
    display: flex;
    justify-content: center;
    margin: 6px 0;
}
.navButtons button {
    flex: 1;
    margin: 0 3px;
    background-color: #444;
    color: #fff;
    border-radius: 6px;
}
.navButtons button:hover {
    background-color: #555;
}
.selectableText, .chordName {
    display: block;
    font-weight: 500;
}
</style>
</head>
<body>
<h2>Chord Familiarity Generator - Play Packages</h2>

<label for="soundSelectGlobal">Select Sound:</label>
<select id="soundSelectGlobal" onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>
<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>
<button id="size_toggle">Toggle Size</button>

<div id="packagesContainer"></div>

<script src="https://unpkg.com/tone@latest"></script>
<script>
// ---------------- DATA, TRIADS, PLAYBACK ----------------
// Paste all your previous noteOrder, scaleIntervals, baseTriadIntervals,
// extraTriadRefs, colorMap, sampleChoiceMap, pianoSamplerUrls,
// and all functions: noteIndex, transpose, normalizeEnharmonics, classify, nameTriad, generateTriads, computeRefTriads, changeSound, getTriadSamples, playChord
// Also precompute allTriads like in the previous snippet.
// ---------------- END DATA ----------------

// ---------------- PLAY PACKAGE CREATION ----------------
let allPackages = [];
let nextPackageNumber = 1;
let currentScaleSize = 1;

function createPlayPackage(){
    const container=document.createElement('div'); 
    container.className='playPackage'; 
    container.style.transform = `scale(${currentScaleSize})`;
    const pkgNumber = nextPackageNumber++;
    container.dataset.pkgNumber = pkgNumber;

    container.innerHTML=`
    <div class="packageHeader"><span>Play Package ${pkgNumber}</span><button class="deletePackage">X</button></div>
    <select class="scaleSelect">${Object.keys(allTriads).map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
    <select class="keySelect">${noteOrder.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
    <select class="colorSelect">${colorOrder.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
    <button class="triadBtn"><span class="selectableText"></span><span class="chordName"></span></button>
    <div class="navButtons"><button class="prevBtn">◀</button><button class="nextBtn">▶</button></div>
    <button class="playBtn">Play</button>
  `;

    document.getElementById('packagesContainer').appendChild(container);
    allPackages.push(container);

    // ---------- EVENT HANDLERS ----------
    const scaleSelect=container.querySelector('.scaleSelect');
    const keySelect=container.querySelector('.keySelect');
    const colorSelect=container.querySelector('.colorSelect');
    const triadBtn=container.querySelector('.triadBtn');
    let currentIndex = 0;

    function updateTriadForPackage(prevScale, prevKey, prevColor){
        const scale = prevScale || scaleSelect.value;
        const key = prevKey || keySelect.value;
        const color = prevColor || colorSelect.value;
        const list = allTriads[scale][key].filter(t=>t.color===color);
        if(list.length===0) return;
        currentIndex = (currentIndex+list.length)%list.length;
        const t = list[currentIndex];
        triadBtn.querySelector('.selectableText').textContent = t.triad.join('-');
        triadBtn.querySelector('.chordName').innerHTML = t.name+'<br>(Source: '+t.source+')';
        triadBtn.dataset.nextRef = t.nextRef;
        triadBtn.dataset.currentIndex = currentIndex;
        triadBtn.style.background = colorMap[color];
        triadBtn.className = 'triadBtn' + (color==='BLACK'?' blackBtn':'');
        const playBtn = container.querySelector('.playBtn');
        playBtn.style.background = colorMap[color];
        playBtn.className = 'playBtn' + (color==='BLACK'?' blackBtn':'');
        if(color==='BLACK'){
            triadBtn.querySelector('.chordName').style.color='white';
            triadBtn.querySelector('.selectableText').style.color='white';
            playBtn.style.color='white';
        } else {
            triadBtn.querySelector('.chordName').style.color='#333';
            triadBtn.querySelector('.selectableText').style.color='#000';
            playBtn.style.color='#000';
        }
    }

    function updateChainFrom(index){
        for(let i=index+1;i<allPackages.length;i++){
            const prevPkg = allPackages[i-1];
            const pkg = allPackages[i];
            const prevPkgNumber = parseInt(prevPkg.dataset.pkgNumber);
            const currPkgNumber = parseInt(pkg.dataset.pkgNumber);
            if(currPkgNumber - 1 !== prevPkgNumber) continue;
            const prevTriadBtn = prevPkg.querySelector('.triadBtn');
            const prevNextRef = prevTriadBtn.dataset.nextRef || prevPkg.querySelector('.scaleSelect').value;
            const prevKeyMatch = prevTriadBtn.querySelector('.chordName').textContent.match(/^([A-G]#?)/);
            const prevKey = prevKeyMatch ? prevKeyMatch[1] : prevPkg.querySelector('.keySelect').value;
            const prevColor = prevPkg.querySelector('.colorSelect').value;
            pkg.querySelector('.scaleSelect').value = prevNextRef;
            pkg.querySelector('.keySelect').value = prevKey;
            pkg.querySelector('.colorSelect').value = prevColor;
            pkg.dataset.currentIndex = 0;
            pkg.querySelector('.triadBtn').dataset.currentIndex = 0;
            pkg.querySelector('.triadBtn').dataset.nextRef = '';
            const scaleSelect2 = pkg.querySelector('.scaleSelect');
            const keySelect2 = pkg.querySelector('.keySelect');
            const colorSelect2 = pkg.querySelector('.colorSelect');
            const triadBtn2 = pkg.querySelector('.triadBtn');
            const list = allTriads[scaleSelect2.value][keySelect2.value].filter(t=>t.color===colorSelect2.value);
            if(list.length>0){
                const t=list[0];
                triadBtn2.querySelector('.selectableText').textContent=t.triad.join('-');
                triadBtn2.querySelector('.chordName').innerHTML=t.name+'<br>(Source: '+t.source+')';
                triadBtn2.dataset.nextRef=t.nextRef;
                triadBtn2.dataset.currentIndex=0;
                triadBtn2.style.background=colorMap[colorSelect2.value];
                triadBtn2.className='triadBtn'+(colorSelect2.value==='BLACK'?' blackBtn':'');
                const playBtn=pkg.querySelector('.playBtn');
                playBtn.style.background=colorMap[colorSelect2.value];
                playBtn.className='playBtn'+(colorSelect2.value==='BLACK'?' blackBtn':'');
                if(colorSelect2.value==='BLACK'){triadBtn2.querySelector('.chordName').style.color='white'; triadBtn2.querySelector('.selectableText').style.color='white'; playBtn.style.color='white';}
                else{triadBtn2.querySelector('.chordName').style.color='#333'; triadBtn2.querySelector('.selectableText').style.color='#000'; playBtn.style.color='#000';}
            }
        }
    }

    scaleSelect.onchange=keySelect.onchange=colorSelect.onchange=()=>{ updateTriadForPackage(); updateChainFrom(allPackages.indexOf(container)); };
    container.querySelector('.prevBtn').onclick=()=>{ currentIndex--; updateTriadForPackage(); updateChainFrom(allPackages.indexOf(container)); };
    container.querySelector('.nextBtn').onclick=()=>{ currentIndex++; updateTriadForPackage(); updateChainFrom(allPackages.indexOf(container)); };
    container.querySelector('.playBtn').onclick=()=>{ 
        const txt=triadBtn.querySelector('.selectableText').textContent;
        if(txt){ const tri=txt.split('-'); playChord(tri); } 
    };

    const deleteBtn = container.querySelector('.deletePackage');
    function handleDelete(){ container.remove(); allPackages = allPackages.filter(p=>p!==container); }
    deleteBtn.addEventListener('click',handleDelete);
    deleteBtn.addEventListener('touchend',function(e){ e.preventDefault(); handleDelete(); });

    updateTriadForPackage();
}

// ---------- BUTTONS ----------
document.getElementById('insertPackageBtn').onclick=()=>{ createPlayPackage(); };
const sizeOptions = [0.5, 0.75, 1];
let currentSizeIndex = 2; 
document.getElementById('size_toggle').onclick = () => {
    currentSizeIndex = (currentSizeIndex + 1) % sizeOptions.length;
    currentScaleSize = sizeOptions[currentSizeIndex];
    allPackages.forEach(pkg => { pkg.style.transform = `scale(${currentScaleSize})`; });
};
</script>
</body>
</html>
