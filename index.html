<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chord Familiarity Generator</title>
<script src="https://unpkg.com/tone@latest"></script>

<style>
body { font-family: sans-serif; padding: 12px; }

table {
  border-collapse: collapse;
  margin-top: 20px;
  width: 100%;
  font-size: 0.9em;
}
th, td {
  border: 1px solid #999;
  padding: 4px 6px;
  text-align: center;
}

#buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  margin: 16px 0;
}

.colorBlock {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.colorBtn {
  min-width: 120px;
  padding: 10px;
  font-weight: bold;
}

.controls {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-top: 6px;
}

.controls button {
  font-size: 0.8em;
  padding: 4px 6px;
}

#playSource {
  margin: 12px 0;
  padding: 12px;
  font-size: 1.05em;
}
</style>
</head>

<body>

<h2>Chord Familiarity Generator</h2>

<div id="sourceTriadDisplay" style="font-weight:bold;margin-bottom:8px;"></div>

<select id="scaleSelect" onchange="generateAll()">
  <option value="major">Major</option>
  <option value="naturalMinor">Natural Minor</option>
  <option value="harmonicMinor">Harmonic Minor</option>
  <option value="melodicMinor">Melodic Minor</option>
</select>

<br>
<button id="playSource" onclick="playSourceTriad()">Play Source Triad</button>

<div id="buttons"></div>
<div id="output"></div>

<script>
/* ---------- NOTES ---------- */
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const enh={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'};
const norm=t=>t.map(n=>enh[n]||n);
const tr=(n,s)=>noteOrder[(noteOrder.indexOf(n)+12+s)%12];

/* ---------- SCALES ---------- */
const scales={
  major:['C','D','E','F','G','A','B'],
  naturalMinor:['C','D','Eb','F','G','Ab','Bb'],
  harmonicMinor:['C','D','Eb','F','G','Ab','B'],
  melodicMinor:['C','D','Eb','F','G','A','B']
};
const baseTriads={
  major:['C','E','G'],
  naturalMinor:['C','Eb','G'],
  harmonicMinor:['C','Eb','G'],
  melodicMinor:['C','Eb','G']
};

/* ---------- COLORS ---------- */
const colors={
  RED:'#ff4c4c',ORANGE:'#ff9900',GOLD:'#ffd700',YELLOW:'#ffff66',
  BLUE:'#6699ff',WHITE:'#ffffff','LIGHT GREY':'#ccc',
  'DARK GREY':'#888',BLACK:'#000'
};

/* ---------- TRIADS ---------- */
function genTriads(base){
  let r=new Set(),s=[-2,-1,0,1,2];
  for(let a of s)for(let b of s)for(let c of s)
    r.add([tr(base[0],a),tr(base[1],b),tr(base[2],c)].join(','));
  return [...r].map(x=>norm(x.split(',')));
}

function classify(t,ref,scale){
  let same=t.filter(n=>ref.includes(n)).length;
  let ins=t.filter(n=>!ref.includes(n)&&scale.includes(n)).length;
  let out=3-same-ins;
  if(same==2&&ins==1)return'RED';
  if(same==2&&out==1)return'ORANGE';
  if(same==1&&ins==2)return'GOLD';
  if(same==1&&ins==1&&out==1)return'YELLOW';
  if(same==1&&out==2)return'BLUE';
  if(same==0&&ins==3)return'WHITE';
  if(same==0&&ins==2)return'LIGHT GREY';
  if(same==0&&ins==1)return'DARK GREY';
  return'BLACK';
}

/* ---------- AUDIO ---------- */
let sampler;
async function resume(){
  if(Tone.context.state!=='running') await Tone.start();
}
async function playChord(t){
  await resume();
  if(!sampler){
    sampler=new Tone.Sampler({
      urls:{
        "C5":"C5.wav","D#5":"DSharp5.wav","E5":"E5.wav",
        "G5":"G5.wav","A#4":"ASharp4.wav","B4":"B4.wav",
        "D5":"D5.wav","F#5":"FSharp5.wav"
      },
      baseUrl:"https://raw.githubusercontent.com/alexdrnap/piano_samples/main/"
    }).toDestination();
    await sampler.loaded;
  }
  t.forEach(n=>sampler.triggerAttackRelease(n+"4","1n"));
}

/* ---------- UI ---------- */
let sourceTriad=[];
function playSourceTriad(){ playChord(sourceTriad); }

function generateAll(){
  const key=scaleSelect.value;
  const scale=scales[key];
  sourceTriad=norm(baseTriads[key]);
  sourceTriadDisplay.textContent="Source Triad: "+sourceTriad.join('-');

  const all=genTriads(baseTriads[key]).map(t=>{
    const c=classify(t,sourceTriad,scale);
    return {triad:t,color:c};
  });

  /* ---- BUTTONS ---- */
  buttons.innerHTML='';
  Object.keys(colors).forEach(c=>{
    const list=all.filter(x=>x.color===c);
    if(!list.length) return;
    let i=0;
    const b=document.createElement('div');
    b.className='colorBlock';
    b.innerHTML=`
      <button class="colorBtn" style="background:${colors[c]};color:${c==='BLACK'?'#fff':'#000'}">
        ${list[0].triad.join('-')}
      </button>
      <div class="controls">
        <button>«</button>
        <button>Play</button>
        <button>»</button>
      </div>`;
    const btn=b.querySelector('.colorBtn');
    const [bk,pl,fw]=b.querySelectorAll('.controls button');
    const upd=()=>btn.textContent=list[i].triad.join('-');
    bk.onclick=()=>{i=(i-1+list.length)%list.length;upd();playChord(list[i].triad);}
    fw.onclick=()=>{i=(i+1)%list.length;upd();playChord(list[i].triad);}
    pl.onclick=()=>playChord(list[i].triad);
    buttons.appendChild(b);
  });

  /* ---- TABLE ---- */
  let html=`<table>
    <tr><th>#</th><th>Triad</th><th>Color</th></tr>`;
  all.forEach((x,i)=>{
    html+=`<tr style="background:${colors[x.color]}">
      <td>${i+1}</td>
      <td>${x.triad.join('-')}</td>
      <td>${x.color}</td>
    </tr>`;
  });
  html+='</table>';
  output.innerHTML=html;
}

document.addEventListener('click',()=>Tone.start(),{once:true});
generateAll();
</script>
</body>
</html>
