<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chord Familiarity Generator</title>
<script src="https://unpkg.com/tone@latest"></script>

<style>
body { font-family: sans-serif; padding: 10px; }
table { border-collapse: collapse; width: 100%; margin-top: 20px; }
th, td { border: 1px solid #888; padding: 6px; text-align: center; }

.buttonRow { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
.colorBtn {
  padding: 10px;
  min-width: 120px;
  font-weight: bold;
  pointer-events: none;
}
.controls { display: flex; flex-direction: column; gap: 4px; }
.smallBtn { font-size: 0.8em; padding: 4px; }
</style>
</head>

<body>

<h2>Chord Familiarity Generator</h2>

<select id="scaleSelect">
  <option value="major">Major</option>
  <option value="naturalMinor">Natural Minor</option>
  <option value="harmonicMinor">Harmonic Minor</option>
  <option value="melodicMinor">Melodic Minor</option>
</select>

<div id="buttons" class="buttonRow"></div>
<div id="output"></div>

<script>
// ================= DATA =================
const noteOrder = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const scales = {
  major:['C','D','E','F','G','A','B'],
  naturalMinor:['C','D','Eb','F','G','Ab','Bb'],
  harmonicMinor:['C','D','Eb','F','G','Ab','B'],
  melodicMinor:['C','D','Eb','F','G','A','B']
};
const baseTriads = {
  major:['C','E','G'],
  naturalMinor:['C','Eb','G'],
  harmonicMinor:['C','Eb','G'],
  melodicMinor:['C','Eb','G']
};

const colorMap = {
  RED:'#FF4C4C', ORANGE:'#FF9900', GOLD:'#FFD700', YELLOW:'#FFFF66',
  BLUE:'#6699FF', WHITE:'#FFFFFF',
  "LIGHT GREY":'#CCCCCC', "DARK GREY":'#888888', BLACK:'#000000'
};

let chordBuckets = {};   // color → list of chords
let piano;

// ================= UTILS =================
const enh = n => ({Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'}[n]||n);
const normalize = triad => triad.map(enh);
const idx = n => noteOrder.indexOf(enh(n));
const tr = (n,s)=>noteOrder[(idx(n)+12+s)%12];

// ================= CLASSIFY =================
function classify(triad,base,scale){
  let same = triad.filter(n=>base.includes(n)).length;
  let inScale = triad.filter(n=>!base.includes(n)&&scale.includes(n)).length;
  let out = 3-same-inScale;
  if(same==2&&inScale==1) return 'RED';
  if(same==2&&out==1) return 'ORANGE';
  if(same==1&&inScale==2) return 'GOLD';
  if(same==1&&inScale==1&&out==1) return 'YELLOW';
  if(same==1&&out==2) return 'BLUE';
  if(same==0&&inScale==3) return 'WHITE';
  if(same==0&&inScale==2&&out==1) return 'LIGHT GREY';
  if(same==0&&inScale==1&&out==2) return 'DARK GREY';
  return 'BLACK';
}

// ================= GENERATION =================
function generateTriads(base){
  let out=new Set();
  for(let a=-2;a<=2;a++)
    for(let b=-2;b<=2;b++)
      for(let c=-2;c<=2;c++)
        out.add([tr(base[0],a),tr(base[1],b),tr(base[2],c)].join(','));
  return [...out].map(x=>x.split(','));
}

// ================= AUDIO =================
async function playChord(notes){
  if(!piano){
    await Tone.start();
    piano = new Tone.Sampler({
      urls:{C5:"C5.wav",D5:"D5.wav",E5:"E5.wav",F5:"F5.wav",G5:"G5.wav",A5:"A5.wav",B5:"B5.wav"},
      baseUrl:"https://raw.githubusercontent.com/alexdrnap/piano_samples/main/"
    }).toDestination();
    await piano.loaded;
  }
  normalize(notes).forEach(n=>piano.triggerAttackRelease(n+"5","1n"));
}

// ================= UI =================
function render(){
  const scaleKey = scaleSelect.value;
  const scale = scales[scaleKey];
  const base = baseTriads[scaleKey];

  chordBuckets = {};
  Object.keys(colorMap).forEach(c=>chordBuckets[c]=[]);

  generateTriads(base).forEach(t=>{
    const tri = normalize(t);
    const col = classify(t,base,scale);
    chordBuckets[col].push(tri);
  });

  renderButtons();
  renderTable();
}

function renderButtons(){
  buttons.innerHTML='';
  Object.entries(chordBuckets).forEach(([color,list])=>{
    if(!list.length) return;

    const wrap=document.createElement('div');
    wrap.innerHTML=`
      <button class="colorBtn" style="background:${colorMap[color]}">
        <span class="txt">${list[0].join('-')}</span>
      </button>
      <div class="controls">
        <button class="smallBtn">«</button>
        <button class="smallBtn">»</button>
        <button class="smallBtn">Play</button>
      </div>
    `;
    let idx=0;

    wrap.querySelectorAll('.smallBtn')[0].onclick=()=>{
      idx=(idx-1+list.length)%list.length;
      wrap.querySelector('.txt').textContent=list[idx].join('-');
    };
    wrap.querySelectorAll('.smallBtn')[1].onclick=()=>{
      idx=(idx+1)%list.length;
      wrap.querySelector('.txt').textContent=list[idx].join('-');
    };
    wrap.querySelectorAll('.smallBtn')[2].onclick=()=>{
      playChord(list[idx]);
    };

    buttons.appendChild(wrap);
  });
}

function renderTable(){
  let html=`<table><tr><th>Triad</th><th>Category</th></tr>`;
  Object.entries(chordBuckets).forEach(([c,list])=>{
    list.forEach(t=>{
      html+=`<tr>
        <td>${t.join('-')}</td>
        <td style="background:${colorMap[c]}">${c}</td>
      </tr>`;
    });
  });
  html+='</table>';
  output.innerHTML=html;
}

// ================= INIT =================
scaleSelect.onchange=render;
render();
</script>

</body>
</html>
