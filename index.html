<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity – Play Packages</title>

<script src="https://unpkg.com/tone@latest"></script>

<style>
body { font-family: sans-serif; }
.playPackage {
  position: absolute;
  width: 160px;
  background: #f9f9f9;
  border: 1px solid #888;
  padding: 4px;
}
.packageHeader {
  background:#ddd;
  cursor: move;
  display:flex;
  justify-content:space-between;
  padding:2px;
}
.triadBtn, .playBtn {
  width:100%;
  height:42px;
  margin-top:4px;
}
.blackBtn { color:white !important; }
.selectableText { user-select:text; }
.navButtons { display:flex; justify-content:center; }
</style>
</head>

<body>

<select id="soundSelectGlobal">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>
<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>

<script>
/* ---------------- BASIC DATA ---------------- */
const notes = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const colorMap = {
  BASE:'#00aa00', RED:'#ff4c4c', ORANGE:'#ff9900', GOLD:'#ffd700',
  YELLOW:'#ffff66', BLUE:'#6699ff', WHITE:'#ffffff',
  "LIGHT GREY":'#ccc', "DARK GREY":'#888', BLACK:'#000'
};
const colorOrder = Object.keys(colorMap);

/* ---------------- REFERENCE SCALES ---------------- */
const scaleIntervals = {
  major:[0,4,7],
  naturalMinor:[0,3,7],
  harmonicMinor:[0,3,7],
  melodicMinor:[0,3,7],
};

const extraRefs = {
  sus2_maj:[0,2,7], sus2_min:[0,2,7],
  sus4_maj:[0,5,7], sus4_min:[0,5,7],
  dim_maj:[0,3,6],  dim_min:[0,3,6],
  aug_maj:[0,4,8],  aug_min:[0,4,8],
  '7_3Tm_maj':[0,2,6], '7_3Tm_min':[0,2,6],
  '1/2dim_3TM_maj':[0,4,6], '1/2dim_3TM_min':[0,4,6],
  '1/2dim_4m_maj':[0,2,5], '1/2dim_4m_min':[0,2,5],
  '7_4M_maj':[0,3,5], '7_4M_min':[0,3,5]
};

const allTriads = {};
function idx(n){ return notes.indexOf(n); }
function note(root,i){ return notes[(idx(root)+i+12)%12]; }

/* ---------------- PRECOMPUTE ---------------- */
function buildTriads(root, ints, source){
  const base = ints.map(i=>note(root,i));
  return [{
    triad: base,
    color:'BASE',
    name: base[0] + ' ' + source.replace(/_(maj|min)/,''),
    source: root + source
  }];
}

for(const r of Object.keys(scaleIntervals)){
  allTriads[r]={};
  for(const n of notes)
    allTriads[r][n]=buildTriads(n,scaleIntervals[r],r);
}
for(const r of Object.keys(extraRefs)){
  allTriads[r]={};
  for(const n of notes)
    allTriads[r][n]=buildTriads(n,extraRefs[r],r);
}

/* ---------------- SOUND ---------------- */
let sampler, synth;
async function playChord(triad){
  await Tone.start();
  if(!sampler){
    sampler=new Tone.Sampler({
      urls:{C4:"C4.wav"},
      baseUrl:"https://tonejs.github.io/audio/salamander/"
    }).toDestination();
    await sampler.loaded;
  }
  sampler.triggerAttackRelease(triad.map(n=>n+'4'),'1n');
}

/* ---------------- INHERIT LOGIC ---------------- */
let lastPackageInfo=null;

function inferFromTriad(t){
  const root = t.name.split(' ')[0];
  const families = ['sus2','sus4','dim','aug','7_3Tm','7_4M','1/2dim_3TM','1/2dim_4m'];
  let fam=null;
  for(const f of families) if(t.name.includes(f)) fam=f;

  const quality = t.source.includes('min') ? 'min' : 'maj';
  const scale = fam ? `${fam}_${quality}` :
                quality==='min' ? 'naturalMinor' : 'major';
  return { key:root, scale };
}

/* ---------------- PLAY PACKAGE ---------------- */
function createPlayPackage(x,y,key='C',scale='major'){
  const d=document.createElement('div');
  d.className='playPackage';
  d.style.left=x+'px'; d.style.top=y+'px';

  d.innerHTML=`
    <div class="packageHeader">Play<button>X</button></div>
    <select class="scale">${Object.keys(allTriads).map(s=>`<option ${s===scale?'selected':''}>${s}</option>`).join('')}</select>
    <select class="key">${notes.map(n=>`<option ${n===key?'selected':''}>${n}</option>`).join('')}</select>
    <select class="color">${colorOrder.map(c=>`<option>${c}</option>`).join('')}</select>
    <button class="triadBtn"><div class="selectableText"></div><div class="name"></div></button>
    <button class="playBtn">PLAY</button>
  `;
  document.body.appendChild(d);

  const triadBtn=d.querySelector('.triadBtn');
  const playBtn=d.querySelector('.playBtn');

  function update(){
    const s=d.querySelector('.scale').value;
    const k=d.querySelector('.key').value;
    const c=d.querySelector('.color').value;
    const t=allTriads[s][k][0];

    triadBtn.style.background=colorMap[c];
    playBtn.style.background=colorMap[c];
    triadBtn.className='triadBtn'+(c==='BLACK'?' blackBtn':'');
    playBtn.className='playBtn'+(c==='BLACK'?' blackBtn':'');

    triadBtn.querySelector('.selectableText').textContent=t.triad.join('-');
    triadBtn.querySelector('.name').innerHTML=`${t.name}<br>(Source: ${t.source})`;

    lastPackageInfo=inferFromTriad(t);
  }

  d.querySelectorAll('select').forEach(s=>s.onchange=update);
  playBtn.onclick=()=>playChord(allTriads[d.querySelector('.scale').value][d.querySelector('.key').value][0].triad);
  triadBtn.onclick=playBtn.onclick;
  d.querySelector('button').onclick=()=>d.remove();

  makeDraggable(d);
  update();
}

/* ---------------- DRAG (DESKTOP + MOBILE) ---------------- */
function makeDraggable(el){
  let dx=0,dy=0,down=false;
  const h=el.querySelector('.packageHeader');
  h.onmousedown=e=>{down=true;dx=e.clientX-el.offsetLeft;dy=e.clientY-el.offsetTop;}
  document.onmouseup=()=>down=false;
  document.onmousemove=e=>{if(down){el.style.left=e.clientX-dx+'px';el.style.top=e.clientY-dy+'px';}}
  h.ontouchstart=e=>{down=true;dx=e.touches[0].clientX-el.offsetLeft;dy=e.touches[0].clientY-el.offsetTop;e.preventDefault();}
  h.ontouchmove=e=>{if(down){el.style.left=e.touches[0].clientX-dx+'px';el.style.top=e.touches[0].clientY-dy+'px';e.preventDefault();}}
  h.ontouchend=()=>down=false;
}

/* ---------------- INIT ---------------- */
document.getElementById('insertPackageBtn').onclick=()=>{
  if(lastPackageInfo)
    createPlayPackage(50,50,lastPackageInfo.key,lastPackageInfo.scale);
  else
    createPlayPackage(50,50,'C','major');
};
</script>
</body>
</html>
