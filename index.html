<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chord Familiarity Generator - Real Piano</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body { font-family: sans-serif; padding: 10px; }
table { border-collapse: collapse; margin-top: 10px; width: 100%; }
td, th { border: 1px solid #888; padding: 5px 10px; text-align: center; }

.buttonRow { display:flex; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
.colorBtn {
  padding:10px; min-width:120px;
  display:flex; flex-direction:column; align-items:center;
  font-weight:bold;
  pointer-events:none; /* display only */
}
.controls { display:flex; flex-direction:column; gap:4px; }

.smallBtn { padding:5px 10px; font-size:0.8em; }

#playSource {
  margin:10px; padding:15px; font-size:1.1em;
  background:#66CC66;
}
</style>
</head>

<body>

<h2>Chord Familiarity Generator - Real Piano</h2>

<div id="sourceTriadDisplay" style="font-weight:bold; margin-bottom:8px;"></div>

<select id="scaleSelect">
  <option value="major">Major</option>
  <option value="naturalMinor">Natural Minor</option>
  <option value="harmonicMinor">Harmonic Minor</option>
  <option value="melodicMinor">Melodic Minor</option>
</select>

<br><br>
<button id="playSource">Play Source Triad</button>

<br><br>
<div id="buttons" class="buttonRow"></div>
<div id="output"></div>

<script src="https://unpkg.com/tone@latest"></script>
<script>
// ---------------- NOTES & SCALES ----------------
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const scales={
  major:['C','D','E','F','G','A','B'],
  naturalMinor:['C','D','Eb','F','G','Ab','Bb'],
  harmonicMinor:['C','D','Eb','F','G','Ab','B'],
  melodicMinor:['C','D','Eb','F','G','A','B']
};
const baseTriads={
  major:['C','E','G'],
  naturalMinor:['C','Eb','G'],
  harmonicMinor:['C','Eb','G'],
  melodicMinor:['C','Eb','G']
};

const colorMap={
  RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',YELLOW:'#FFFF66',
  BLUE:'#6699FF',WHITE:'#FFFFFF',
  "LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'
};

// ---------------- UTILS ----------------
const enh=n=>({Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'}[n]||n);
const norm=t=>t.map(enh);
const idx=n=>noteOrder.indexOf(enh(n));
const tr=(n,s)=>noteOrder[(idx(n)+12+s)%12];

// ---------------- CLASSIFY ----------------
function classify(triad,base,scale){
  let same=triad.filter(n=>base.includes(n)).length;
  let inScale=triad.filter(n=>!base.includes(n)&&scale.includes(n)).length;
  let out=3-same-inScale;
  if(same==2&&inScale==1) return ['RED','3/4'];
  if(same==2&&out==1) return ['ORANGE','3/5'];
  if(same==1&&inScale==2) return ['GOLD','1/2'];
  if(same==1&&inScale==1&&out==1) return ['YELLOW','2/5'];
  if(same==1&&out==2) return ['BLUE','1/3'];
  if(same==0&&inScale==3) return ['WHITE','1/6'];
  if(same==0&&inScale==2&&out==1) return ['LIGHT GREY','1/10'];
  if(same==0&&inScale==1&&out==2) return ['DARK GREY','1/20'];
  return ['BLACK','0'];
}

// ---------------- TRIADS ----------------
function generateTriads(base){
  let out=new Set();
  for(let a=-2;a<=2;a++)
    for(let b=-2;b<=2;b++)
      for(let c=-2;c<=2;c++)
        out.add([tr(base[0],a),tr(base[1],b),tr(base[2],c)].join(','));
  return [...out].map(x=>x.split(','));
}

// ---------------- AUDIO ----------------
let piano;
async function playChord(notes){
  if(!piano){
    await Tone.start();
    piano=new Tone.Sampler({
      urls:{C5:"C5.wav",D5:"D5.wav",E5:"E5.wav",F5:"F5.wav",G5:"G5.wav",A5:"A5.wav",B5:"B5.wav"},
      baseUrl:"https://raw.githubusercontent.com/alexdrnap/piano_samples/main/"
    }).toDestination();
    await piano.loaded;
  }
  norm(notes).forEach(n=>piano.triggerAttackRelease(n+"5","1n"));
}

// ---------------- UI RENDER ----------------
let buckets={}, sourceTriad=[];

function render(){
  const key=scaleSelect.value;
  const scale=scales[key];
  sourceTriad=baseTriads[key];

  sourceTriadDisplay.textContent="Source Triad: "+norm(sourceTriad).join('-');

  buckets={};
  Object.keys(colorMap).forEach(c=>buckets[c]=[]);

  generateTriads(sourceTriad).forEach(t=>{
    const [c,d]=classify(t,sourceTriad,scale);
    buckets[c].push({triad:norm(t),degree:d,source:key});
  });

  renderButtons();
  renderTable();
}

// ---------------- BUTTONS ----------------
function renderButtons(){
  buttons.innerHTML='';
  Object.entries(buckets).forEach(([color,list])=>{
    if(!list.length) return;

    let i=0;
    const wrap=document.createElement('div');
    wrap.innerHTML=`
      <button class="colorBtn" style="background:${colorMap[color]}">
        <span class="chordText">${list[0].triad.join('-')}</span>
      </button>
      <div class="controls">
        <button class="smallBtn">«</button>
        <button class="smallBtn">»</button>
        <button class="smallBtn">Play</button>
      </div>
    `;

    const txt=wrap.querySelector('.chordText');
    const [prev,next,play]=wrap.querySelectorAll('.smallBtn');

    prev.onclick=()=>{ i=(i-1+list.length)%list.length; txt.textContent=list[i].triad.join('-'); };
    next.onclick=()=>{ i=(i+1)%list.length; txt.textContent=list[i].triad.join('-'); };
    play.onclick=()=>playChord(list[i].triad);

    buttons.appendChild(wrap);
  });
}

// ---------------- TABLE ----------------
function renderTable(){
  let html=`<table>
  <tr>
    <th>Triad</th>
    <th>Category</th>
    <th>Degree</th>
    <th>Source</th>
  </tr>`;

  Object.entries(buckets).forEach(([c,list])=>{
    list.forEach(o=>{
      html+=`
      <tr>
        <td>${o.triad.join('-')}</td>
        <td style="background:${colorMap[c]}">${c}</td>
        <td>${o.degree}</td>
        <td>${o.source}</td>
      </tr>`;
    });
  });

  html+='</table>';
  output.innerHTML=html;
}

// ---------------- INIT ----------------
scaleSelect.onchange=render;
playSource.onclick=()=>playChord(sourceTriad);
render();
</script>
</body>
</html>
