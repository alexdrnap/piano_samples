<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>
<style>
/* ---------- GENERAL STYLES ---------- */
body {
    font-family: 'Segoe UI', sans-serif;
    padding: 10px;
    margin: 0;
    background-color: #1e1e1e;
    color: #eee;
}

h2 {
    text-align: center;
    color: #fff;
}

/* ---------- SELECTS & BUTTONS ---------- */
button, select {
    cursor: pointer;
    font-size: 0.95em;
    border: none;
    border-radius: 6px;
    outline: none;
}

select {
    padding: 6px 10px;
    margin: 0 5px 10px 0;
    background-color: #333;
    color: #eee;
}

/* ---------- COLOR SELECT WIDER ---------- */
.colorSelect {
    width: 100%;
    padding: 6px 10px;
    margin: 0 0 10px 0;
    background-color: #333;
    color: #eee;
    border-radius: 6px;
    box-sizing: border-box;
}

button {
    padding: 10px;
    background-color: #444;
    color: #fff;
    transition: background 0.2s;
}

button:hover {
    background-color: #555;
}

/* ---------- PLAY PACKAGE CONTAINER ---------- */
.playPackage {
    position: absolute;
    border: 1px solid #555;
    padding: 12px;
    background: #2c2c2c;
    width: 260px;
    z-index: 1000;
    box-sizing: border-box;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}

/* ---------- PACKAGE HEADER ---------- */
.packageHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: move;
    background: #3a3a3a;
    padding: 8px 10px;
    border-radius: 8px;
    user-select: none;
}

.packageHeader span {
    font-weight: bold;
    color: #fff;
}

/* ---------- CLOSE BUTTON ---------- */
.deletePackage {
    background: #e74c3c;
    color: #fff;
    font-size: 1.2em;
    padding: 4px 8px;
    border-radius: 6px;
}

/* ---------- TRIAD & PLAY BUTTON ---------- */
.triadBtn, .playBtn {
    width: 100%;
    height: 70px;
    font-size: 0.95em;
    padding: 5px;
    text-align: center;
    border-radius: 8px;
    transition: transform 0.1s;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    word-break: break-word;
}

.triadBtn:active, .playBtn:active {
    transform: scale(0.97);
}

.triadBtn.blackBtn, .playBtn.blackBtn {
    color: #fff;
}

.navButtons {
    display: flex;
    justify-content: center;
    margin: 6px 0;
}

.navButtons button {
    flex: 1;
    margin: 0 3px;
    background-color: #444;
    color: #fff;
    border-radius: 6px;
}

.navButtons button:hover {
    background-color: #555;
}

.selectableText, .chordName {
    display: block;
    font-weight: 500;
}
</style>
</head>
<body>

<h2>Chord Familiarity Generator - Play Packages</h2>

<label for="soundSelectGlobal">Select Sound:</label>
<select id="soundSelectGlobal" onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>
<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>

<script src="https://unpkg.com/tone@latest"></script>
<script>
/* ALL YOUR JS IS IDENTICAL — OMITTED HERE FOR BREVITY IN EXPLANATION */
/* ONLY THE startDrag FUNCTION BELOW IS MODIFIED */

  // --- TOUCH DRAG ---
  const header=container.querySelector('.packageHeader');
  let offsetX=0, offsetY=0, dragging=false;

  function startDrag(e){
    if (e.target.closest('.deletePackage')) return; // ✅ FIX
    dragging=true;
    const ev = e.touches?e.touches[0]:e;
    offsetX=ev.clientX-container.offsetLeft;
    offsetY=ev.clientY-container.offsetTop;
    e.preventDefault();
  }

  function drag(e){
    if(!dragging) return;
    const ev = e.touches?e.touches[0]:e;
    container.style.left=(ev.clientX-offsetX)+'px';
    container.style.top=(ev.clientY-offsetY)+'px';
  }

  function stopDrag(){ dragging=false; }

  header.addEventListener('mousedown',startDrag);
  header.addEventListener('touchstart',startDrag);
  window.addEventListener('mousemove',drag);
  window.addEventListener('touchmove',drag);
  window.addEventListener('mouseup',stopDrag);
  window.addEventListener('touchend',stopDrag);

</script>
</body>
</html>
