<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>

<style>
body{
    font-family:'Segoe UI',sans-serif;
    padding:10px;
    margin:0;
    background:#1e1e1e;
    color:#eee;
}
h2{text-align:center;color:#fff;}

button,select{
    cursor:pointer;
    font-size:.95em;
    border:none;
    border-radius:6px;
    outline:none;
}

select{
    padding:6px 10px;
    margin:0 5px 10px 0;
    background:#333;
    color:#eee;
}

.colorSelect{
    width:100%;
    padding:6px 10px;
    margin:0 0 10px 0;
    background:#333;
    color:#eee;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    padding:10px;
    background:#444;
    color:#fff;
    transition:background .2s;
}
button:hover{background:#555;}

/* ---------- GRID CONTAINER ---------- */
#gridContainer{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(260px,1fr));
    gap:12px;
    margin-top:12px;
}

/* ---------- PLAY PACKAGE ---------- */
.playPackage{
    border:1px solid #555;
    padding:12px;
    background:#2c2c2c;
    width:100%;
    box-sizing:border-box;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.5);
}

/* ---------- HEADER ---------- */
.packageHeader{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#3a3a3a;
    padding:8px 10px;
    border-radius:8px;
}
.packageHeader span{font-weight:bold;color:#fff;}

.deletePackage{
    background:#e74c3c;
    color:#fff;
    font-size:1.2em;
    padding:4px 8px;
    border-radius:6px;
}

.triadBtn,.playBtn{
    width:100%;
    height:70px;
    font-size:.95em;
    padding:5px;
    text-align:center;
    border-radius:8px;
    transition:transform .1s;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    word-break:break-word;
}
.triadBtn:active,.playBtn:active{transform:scale(.97);}
.triadBtn.blackBtn,.playBtn.blackBtn{color:#fff;}

.navButtons{
    display:flex;
    justify-content:center;
    margin:6px 0;
}
.navButtons button{
    flex:1;
    margin:0 3px;
    background:#444;
    color:#fff;
}
.navButtons button:hover{background:#555;}

.selectableText,.chordName{
    display:block;
    font-weight:500;
}
</style>
</head>

<body>

<h2>Chord Familiarity Generator - Play Packages</h2>

<label>Select Sound:</label>
<select id="soundSelectGlobal" onchange="changeSound(this.value)">
<option value="piano">Piano</option>
<option value="AMSynth">AMSynth</option>
</select>

<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>
<button id="size_toggle">Toggle Size</button>

<!-- GRID -->
<div id="gridContainer"></div>

<script src="https://unpkg.com/tone@latest"></script>

<script>
// ---------------- DATA ----------------
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const scaleIntervals={major:[0,2,4,5,7,9,11],naturalMinor:[0,2,3,5,7,8,10],harmonicMinor:[0,2,3,5,7,8,11],melodicMinor:[0,2,3,5,7,9,11]};
const baseTriadIntervals={major:[0,4,7],naturalMinor:[0,3,7],harmonicMinor:[0,3,7],melodicMinor:[0,3,7]};
const keyAbbr={major:'maj',naturalMinor:'min',harmonicMinor:'harmMin',melodicMinor:'melMin'};
const extraTriadRefs={
'sus2_maj':[0,2,7],'sus2_min':[0,2,7],'sus4_maj':[0,5,7],'sus4_min':[0,5,7],
'aug_maj':[0,4,8],'aug_min':[0,4,8],'dim_maj':[0,3,6],'dim_min':[0,3,6],
'7_3Tm_maj':[0,2,6],'7_3Tm_min':[0,2,6],'1/2dim_3TM_maj':[0,4,6],'1/2dim_3TM_min':[0,4,6],
'1/2dim_4m_maj':[0,2,5],'1/2dim_4m_min':[0,2,5],'7_4M_maj':[0,3,5],'7_4M_min':[0,3,5]
};

const colorMap={BASE:'#00AA00',RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',YELLOW:'#FFFF66',BLUE:'#6699FF',WHITE:'#FFFFFF',"LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'};
const colorOrder=['BASE','RED','ORANGE','GOLD','YELLOW','BLUE','WHITE','LIGHT GREY','DARK GREY','BLACK'];

const sampleChoiceMap={
"C":["C5","C6"],"C#":["C#5"],"D":["D5"],"D#":["D#5"],"E":["E5"],"F":["F5"],"F#":["F#5"],
"G":["G5"],"G#":["G#4","G#5"],"A":["A4","A5"],"A#":["A#4","A#5"],"B":["B4","B5"]
};

const pianoSamplerUrls={
"A4":"A4.wav","A5":"A5.wav","A#4":"ASharp4.wav","A#5":"ASharp5.wav",
"B4":"B4.wav","B5":"B5.wav","C5":"C5.wav","C6":"C6.wav",
"C#5":"CSharp5.wav","D5":"D5.wav","D#5":"DSharp5.wav",
"E5":"E5.wav","F5":"F5.wav","F#5":"FSharp5.wav",
"G5":"G5.wav","G#4":"GSharp4.wav","G#5":"GSharp5.wav"
};

// ---------------- TRIAD FUNCTIONS (unchanged) ----------------
function noteIndex(n){return noteOrder.indexOf(n);}
function transpose(n,s){return noteOrder[(noteIndex(n)+12+s)%12];}
function normalizeEnharmonics(t){return t.map(n=>({Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'}[n]||n));}

function classify(triad,refBase,scale){
if(triad.slice().sort().join(',')===refBase.slice().sort().join(','))return['BASE','1/1'];
let same=triad.filter(n=>refBase.includes(n)).length;
let inScale=triad.filter(n=>!refBase.includes(n)&&scale.includes(n)).length;
let outScale=triad.length-same-inScale;
if(same==2&&inScale==1)return['RED','3/4'];
if(same==2&&outScale==1)return['ORANGE','3/5'];
if(same==1&&inScale==2)return['GOLD','1/2'];
if(same==1&&inScale==1&&outScale==1)return['YELLOW','2/5'];
if(same==1&&outScale==2)return['BLUE','1/3'];
if(same==0&&inScale==3)return['WHITE','1/6'];
if(same==0&&inScale==2&&outScale==1)return['LIGHT GREY','1/10'];
if(same==0&&inScale==1&&outScale==2)return['DARK GREY','1/20'];
if(same==0&&outScale==3)return['BLACK','0'];
return['UNKNOWN','-'];
}

function nameTriad(triad){
if(new Set(triad).size<3)return'';
triad=normalizeEnharmonics(triad);
const semitone=n=>noteOrder.indexOf(n);
const mod12=n=>(n+12)%12;
let tri=triad.map(semitone);
function ints(rot){let a=rot.map(n=>mod12(n-rot[0]));a.sort((a,b)=>a-b);return a;}
const types=[{i:[0,4,7],l:'major'},{i:[0,3,7],l:'minor'},{i:[0,3,6],l:'dim'},{i:[0,4,8],l:'aug'},{i:[0,2,7],l:'sus2'},{i:[0,5,7],l:'sus4'}];
for(let s=0;s<3;s++){
let rot=[tri[s],tri[(s+1)%3],tri[(s+2)%3]];
let ii=ints(rot);
for(let t of types)if(JSON.stringify(ii)===JSON.stringify(t.i))return noteOrder[rot[0]]+' '+t.l;
}
return'';
}

function generateTriads(base){
const semis=[-2,-1,0,1,2];let set=new Set();
for(let i=0;i<3;i++)for(let s of semis){let t=[...base];t[i]=transpose(t[i],s);set.add(t.join(','));}
return Array.from(set).map(r=>r.split(','));
}

// ---------------- PLAYBACK (unchanged) ----------------
let currentSound='piano',pianoSampler,currentSynth=null;
async function changeSound(sound){
currentSound=sound;
if(sound==='piano'&&!pianoSampler){
pianoSampler=new Tone.Sampler({urls:pianoSamplerUrls,baseUrl:"https://raw.githubusercontent.com/alexdrnap/piano_samples/main/"}).toDestination();
await pianoSampler.loaded;
}
}

function getTriadSamples(triad){
return triad.map((note,i)=>{
let n={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'}[note]||note;
let opts=sampleChoiceMap[n];
if(!opts)return null;
return i===0?opts[0]:(opts[1]||opts[0]);
}).filter(Boolean);
}

async function playChord(triad){
await Tone.start();
if(currentSynth){currentSynth.dispose();currentSynth=null;}
const notes=getTriadSamples(triad);
if(currentSound==='piano'&&pianoSampler)notes.forEach(n=>pianoSampler.triggerAttackRelease(n,'1n'));
else if(currentSound==='AMSynth'){currentSynth=new Tone.PolySynth(Tone.AMSynth).toDestination();currentSynth.triggerAttackRelease(notes,'1n');}
}

// ---------------- TRIAD PRECOMPUTE (unchanged logic simplified) ----------------
const allTriads={};
for(let s in scaleIntervals){
allTriads[s]={};
for(let root of noteOrder){
let scaleNotes=scaleIntervals[s].map(i=>noteOrder[(noteIndex(root)+i)%12]);
let baseTriad=baseTriadIntervals[s].map(i=>noteOrder[(noteIndex(root)+i)%12]);
allTriads[s][root]=generateTriads(baseTriad).map(t=>{
let [color]=classify(t,baseTriad,scaleNotes);
let name=nameTriad(t);
if(!name)return null;
return{triad:t,color,name,source:root+s};
}).filter(Boolean);
}
}

// ---------------- GRID PACKAGE CREATION ----------------
let allPackages=[];
let nextPackageNumber=1;
let currentScaleSize=1;

function createPlayPackage(){
const container=document.createElement('div');
container.className='playPackage';
container.style.transform=`scale(${currentScaleSize})`;
container.style.transformOrigin='top left';

const pkgNumber=nextPackageNumber++;
container.dataset.pkgNumber=pkgNumber;

container.innerHTML=`
<div class="packageHeader"><span>Play Package ${pkgNumber}</span><button class="deletePackage">X</button></div>
<select class="scaleSelect">${Object.keys(allTriads).map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
<select class="keySelect">${noteOrder.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
<select class="colorSelect">${colorOrder.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
<button class="triadBtn"><span class="selectableText"></span><span class="chordName"></span></button>
<div class="navButtons"><button class="prevBtn">◀</button><button class="nextBtn">▶</button></div>
<button class="playBtn">Play</button>
`;

document.getElementById('gridContainer').appendChild(container);
allPackages.push(container);

const scaleSelect=container.querySelector('.scaleSelect');
const keySelect=container.querySelector('.keySelect');
const colorSelect=container.querySelector('.colorSelect');
const triadBtn=container.querySelector('.triadBtn');

let currentIndex=0;

function update(){
const list=allTriads[scaleSelect.value][keySelect.value].filter(t=>t.color===colorSelect.value);
if(!list.length)return;
currentIndex=(currentIndex+list.length)%list.length;
const t=list[currentIndex];
triadBtn.querySelector('.selectableText').textContent=t.triad.join('-');
triadBtn.querySelector('.chordName').innerHTML=t.name;
triadBtn.style.background=colorMap[colorSelect.value];
container.querySelector('.playBtn').style.background=colorMap[colorSelect.value];
}

scaleSelect.onchange=keySelect.onchange=colorSelect.onchange=update;
container.querySelector('.prevBtn').onclick=()=>{currentIndex--;update();}
container.querySelector('.nextBtn').onclick=()=>{currentIndex++;update();}
container.querySelector('.playBtn').onclick=()=>{
const txt=triadBtn.querySelector('.selectableText').textContent;
if(txt)playChord(txt.split('-'));
};

container.querySelector('.deletePackage').onclick=()=>{
container.remove();
allPackages=allPackages.filter(p=>p!==container);
};

update();
}

// ---------------- INSERT ----------------
document.getElementById('insertPackageBtn').onclick=createPlayPackage;

// ---------------- SIZE ----------------
const sizeOptions=[.5,.75,1];
let currentSizeIndex=2;
document.getElementById('size_toggle').onclick=()=>{
currentSizeIndex=(currentSizeIndex+1)%sizeOptions.length;
currentScaleSize=sizeOptions[currentSizeIndex];
allPackages.forEach(pkg=>pkg.style.transform=`scale(${currentScaleSize})`);
};
</script>
</body>
</html>
