<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Real Piano</title>

<style>
body { font-family: sans-serif; padding: 10px; }
table { border-collapse: collapse; margin-top: 10px; width: 100%; }
td, th { border: 1px solid #888; padding: 5px 10px; text-align: center; }
button.colorBtn {
  margin: 3px;
  padding: 10px;
  min-width: 120px;
  display: flex;
  flex-direction: column;
  align-items: center;
}
button .chordName { font-size: 0.7em; color: #333; }
.colorSelect { margin-left:5px; }
button#playSource {
  margin: 10px;
  padding: 15px;
  font-size: 1.2em;
  background:#66CC66;
}
</style>
</head>

<body>
<h2>Chord Familiarity Generator – Real Piano</h2>

<label>Reference scale:</label>
<select id="scaleSelect" onchange="generateTable()">
  <option value="major">Major</option>
  <option value="naturalMinor">Natural Minor</option>
  <option value="harmonicMinor">Harmonic Minor</option>
  <option value="melodicMinor">Melodic Minor</option>
</select>

<br><br>

<button id="playSource" onclick="playSourceTriad()">Play Source Triad</button>

<br><br>

<label>Sound:</label>
<select onchange="changeSound(this.value)">
  <option value="piano">Real Piano</option>
  <option value="poly">PolySynth</option>
</select>

<div id="buttons"></div>
<div id="output"></div>

<script src="https://unpkg.com/tone@latest"></script>
<script>
/* -------------------- MUSIC UTILS -------------------- */
const noteOrder = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function normalize(note){
  return note
    .replace('Db','C#')
    .replace('Eb','D#')
    .replace('Gb','F#')
    .replace('Ab','G#')
    .replace('Bb','A#');
}

function transpose(note, s){
  note = normalize(note);
  return noteOrder[(noteOrder.indexOf(note) + s + 12) % 12];
}

/* -------------------- SCALES -------------------- */
const scales = {
  major: ['C','D','E','F','G','A','B'],
  naturalMinor: ['C','D','Eb','F','G','Ab','Bb'],
  harmonicMinor: ['C','D','Eb','F','G','Ab','B'],
  melodicMinor: ['C','D','Eb','F','G','A','B']
};

const baseTriads = {
  major: ['C','E','G'],
  naturalMinor: ['C','Eb','G'],
  harmonicMinor: ['C','Eb','G'],
  melodicMinor: ['C','Eb','G']
};

let activeSourceTriad = [];
let currentTriads = [];

/* -------------------- AUDIO -------------------- */
let currentSound = 'piano';
let pianoSampler = null;
let pianoReady = false;
let poly = new Tone.PolySynth(Tone.Synth).toDestination();

const githubBase =
  "https://raw.githubusercontent.com/alexdrnap/piano_samples/main/";

const pianoSampleMap = {
  "A4":"A4.wav","A#4":"A#4.wav","B4":"B4.wav",
  "C5":"C5.wav","C#5":"C#5.wav","D5":"D5.wav","D#5":"D#5.wav","E5":"E5.wav",
  "F5":"F5.wav","F#5":"F#5.wav","G5":"G5.wav","G#5":"G#5.wav",
  "A5":"A5.wav","A#5":"A#5.wav","B5":"B5.wav",
  "C6":"C6.wav"
};

async function changeSound(sound){
  await Tone.start();
  currentSound = sound;

  if(sound === 'piano' && !pianoSampler){
    pianoSampler = new Tone.Sampler({
      urls: pianoSampleMap,
      baseUrl: githubBase,
      onload: () => {
        pianoReady = true;
        console.log("🎹 Piano samples loaded");
      }
    }).toDestination();
  }
}

async function playChord(notes){
  await Tone.start();

  if(currentSound === 'piano'){
    if(!pianoReady) return;

    const chord = notes.map(n => normalize(n) + "5");
    pianoSampler.triggerAttackRelease(chord, "1n");

  } else {
    poly.triggerAttackRelease(
      notes.map(n => normalize(n) + "5"),
      "1n"
    );
  }
}

function playSourceTriad(){
  playChord(activeSourceTriad);
}

/* -------------------- TRIADS -------------------- */
function generateTriads(base){
  const semis = [-2,-1,0,1,2];
  const out = new Set();

  for(let s1 of semis)
  for(let s2 of semis)
  for(let s3 of semis){
    out.add([
      transpose(base[0],s1),
      transpose(base[1],s2),
      transpose(base[2],s3)
    ].join(','));
  }

  return [...out].map(t => t.split(','));
}

/* -------------------- UI -------------------- */
function generateTable(){
  const key = scaleSelect.value;
  activeSourceTriad = baseTriads[key];
  currentTriads = generateTriads(baseTriads[key]);

  let html = '<table><tr><th>Triad</th></tr>';
  currentTriads.forEach(t=>{
    html += `<tr><td>${t.join('-')}</td></tr>`;
  });
  html += '</table>';
  output.innerHTML = html;

  buttons.innerHTML = `
    <button onclick="playChord(currentTriads[Math.floor(Math.random()*currentTriads.length)])">
      Play Random Chord
    </button>
  `;
}

generateTable();
</script>
</body>
</html>
