<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>
<style>
body { font-family:'Segoe UI', sans-serif; padding:10px; margin:0; background:#1e1e1e; color:#eee; }
h2 { text-align:center; color:#fff; }
button, select { cursor:pointer; font-size:0.95em; border:none; border-radius:6px; outline:none; }
select { padding:6px 10px; margin:0 5px 10px 0; background:#333; color:#eee; }
.colorSelect { width:100%; box-sizing:border-box; }
button { padding:10px; background:#444; color:#fff; transition:background 0.2s; }
button:hover { background:#555; }
.playPackage { position:absolute; border:1px solid #555; padding:12px; background:#2c2c2c; width:260px; z-index:1000; box-sizing:border-box; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.5);}
.packageHeader { display:flex; justify-content:space-between; align-items:center; cursor:move; background:#3a3a3a; padding:8px 10px; border-radius:8px; user-select:none;}
.packageHeader span { font-weight:bold; color:#fff; }
.deletePackage { background:#e74c3c; color:#fff; font-size:1.2em; padding:4px 8px; border-radius:6px; }
.triadBtn, .playBtn { width:100%; height:70px; font-size:0.95em; padding:5px; text-align:center; border-radius:8px; transition:transform 0.1s; display:flex; flex-direction:column; justify-content:center; align-items:center; word-break:break-word;}
.triadBtn:active, .playBtn:active { transform:scale(0.97); }
.triadBtn.blackBtn, .playBtn.blackBtn { color:#fff; }
.navButtons { display:flex; justify-content:center; margin:6px 0; }
.navButtons button { flex:1; margin:0 3px; background:#444; color:#fff; border-radius:6px; }
.navButtons button:hover { background:#555; }
.selectableText, .chordName { display:block; font-weight:500; }
</style>
</head>
<body>
<h2>Chord Familiarity Generator - Play Packages</h2>

<label for="soundSelectGlobal">Select Sound:</label>
<select id="soundSelectGlobal" onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>
<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>

<script src="https://unpkg.com/tone@latest"></script>
<script>
// ---------------- DATA ----------------
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const scaleIntervals={major:[0,2,4,5,7,9,11], naturalMinor:[0,2,3,5,7,8,10], harmonicMinor:[0,2,3,5,7,8,11], melodicMinor:[0,2,3,5,7,9,11]};
const baseTriadIntervals={major:[0,4,7], naturalMinor:[0,3,7], harmonicMinor:[0,3,7], melodicMinor:[0,3,7]};
const keyAbbr={major:'maj', naturalMinor:'min', harmonicMinor:'harmMin', melodicMinor:'melMin'};
const extraTriadRefs={'sus2_maj':[0,2,7],'sus2_min':[0,2,7],'sus4_maj':[0,5,7],'sus4_min':[0,5,7],'aug_maj':[0,4,8],'aug_min':[0,4,8],'dim_maj':[0,3,6],'dim_min':[0,3,6],'7_3Tm_maj':[0,2,6],'7_3Tm_min':[0,2,6],'1/2dim_3TM_maj':[0,4,6],'1/2dim_3TM_min':[0,4,6],'1/2dim_4m_maj':[0,2,5],'1/2dim_4m_min':[0,2,5],'7_4M_maj':[0,3,5],'7_4M_min':[0,3,5]};
const colorMap={BASE:'#00AA00',RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',YELLOW:'#FFFF66',BLUE:'#6699FF',WHITE:'#FFFFFF',"LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'};
const colorOrder=['BASE','RED','ORANGE','GOLD','YELLOW','BLUE','WHITE','LIGHT GREY','DARK GREY','BLACK'];
const sampleChoiceMap={"C":["C5","C6"],"C#":["C#5"],"D":["D5"],"D#":["D#5"],"E":["E5"],"F":["F5"],"F#":["F#5"],"G":["G5"],"G#":["G#4","G#5"],"A":["A4","A5"],"A#":["A#4","A#5"],"B":["B4","B5"]};
const pianoSamplerUrls={"A4":"A4.wav","A5":"A5.wav","A#4":"ASharp4.wav","A#5":"ASharp5.wav","B4":"B4.wav","B5":"B5.wav","C5":"C5.wav","C6":"C6.wav","C#5":"CSharp5.wav","D5":"D5.wav","D#5":"DSharp5.wav","E5":"E5.wav","F5":"F5.wav","F#5":"FSharp5.wav","G5":"G5.wav","G#4":"GSharp4.wav","G#5":"GSharp5.wav"};

// ---------------- TRIAD FUNCTIONS ----------------
function noteIndex(note){return noteOrder.indexOf(note);}
function transpose(note,semitones){return noteOrder[(noteIndex(note)+12+semitones)%12];}
function normalizeEnharmonics(triad){return triad.map(n=>{switch(n){case 'Db':return 'C#';case 'Eb':return 'D#';case 'Gb':return 'F#';case 'Ab':return 'G#';case 'Bb':return 'A#';default:return n;}});}
function classify(triad,refBase,scale){if(triad.slice().sort().join(',')===refBase.slice().sort().join(','))return['BASE','1/1']; let same=triad.filter(n=>refBase.includes(n)).length; let inScale=triad.filter(n=>!refBase.includes(n)&&scale.includes(n)).length; let outScale=triad.length-same-inScale; if(same==2&&inScale==1)return['RED','3/4']; if(same==2&&outScale==1)return['ORANGE','3/5']; if(same==1&&inScale==2)return['GOLD','1/2']; if(same==1&&inScale==1&&outScale==1)return['YELLOW','2/5']; if(same==1&&outScale==2)return['BLUE','1/3']; if(same==0&&inScale==3)return['WHITE','1/6']; if(same==0&&inScale==2&&outScale==1)return['LIGHT GREY','1/10']; if(same==0&&inScale==1&&outScale==2)return['DARK GREY','1/20']; if(same==0&&outScale==3)return['BLACK','0']; return['UNKNOWN','-'];}
function nameTriad(triad){if(new Set(triad).size<3)return ''; triad=normalizeEnharmonics(triad); const semitone=note=>noteOrder.indexOf(note); const mod12=n=>(n+12)%12; let tri=triad.map(n=>semitone(n)); function intervalsFrom(rot){let ints=rot.map(n=>mod12(n-rot[0])); ints.sort((a,b)=>a-b); return ints;} const triads=[{i:[0,4,7],l:'major'},{i:[0,3,7],l:'minor'},{i:[0,3,6],l:'dim'},{i:[0,4,8],l:'aug'},{i:[0,2,7],l:'sus2'},{i:[0,5,7],l:'sus4'}]; for(let s=0;s<3;s++){let rot=[tri[s],tri[(s+1)%3],tri[(s+2)%3]]; let ints=intervalsFrom(rot); for(let t of triads) if(JSON.stringify(ints)===JSON.stringify(t.i)) return noteOrder[rot[0]]+' '+t.l;} return '';}
function generateTriads(base){const semis=[-2,-1,0,1,2]; let results=new Set(); for(let i=0;i<3;i++) for(let s of semis){ let tri=[...base]; tri[i]=transpose(tri[i],s); results.add(tri.join(','));} for(let i=0;i<2;i++) for(let j=i+1;j<3;j++) for(let s1 of semis) for(let s2 of semis){ let tri=[...base]; tri[i]=transpose(tri[i],s1); tri[j]=transpose(tri[j],s2); results.add(tri.join(','));} for(let s1 of semis) for(let s2 of semis) for(let s3 of semis){ let tri=[transpose(base[0],s1),transpose(base[1],s2),transpose(base[2],s3)]; results.add(tri.join(','));} return Array.from(results).map(r=>r.split(','));}

// ---------------- PLAYBACK ----------------
let currentSound='piano', pianoSampler=null, currentSynth=null;
async function changeSound(sound){currentSound=sound; if(sound==='piano' && !pianoSampler){ pianoSampler=new Tone.Sampler({urls:pianoSamplerUrls, baseUrl:"https://raw.githubusercontent.com/alexdrnap/piano_samples/main/"}).toDestination(); await pianoSampler.loaded;}}
function getTriadSamples(triad){const normalized=triad.map(n=>{switch(n){case 'Db':return 'C#';case 'Eb':return 'D#';case 'Gb':return 'F#';case 'Ab':return 'G#';case 'Bb':return 'A#';default:return n;}}); return normalized.map((note,i)=>{const options=sampleChoiceMap[note]; if(!options) return null; return i===0?options[0]:(options[1]||options[0]);}).filter(Boolean);}
async function playChord(triad){await Tone.start(); if(currentSynth){currentSynth.dispose(); currentSynth=null;} const notes=getTriadSamples(triad); if(currentSound==='piano' && pianoSampler) notes.forEach(n=>pianoSampler.triggerAttackRelease(n,'1n')); else if(currentSound==='AMSynth'){currentSynth=new Tone.PolySynth(Tone.AMSynth).toDestination(); currentSynth.triggerAttackRelease(notes,'1n');}}

// ---------------- PRECOMPUTE TRIADS ----------------
const allTriads={};
function computeRefTriads(baseTriad, scaleName, key, scaleNotes, label){const triads=generateTriads(baseTriad).map(t=>{const [color,degree]=classify(t,baseTriad,scaleNotes); const name=nameTriad(t); if(!name) return null; let nextRef=''; const rootMatch=name.match(/^([A-G]#?)/); let chordOnly=name.replace(/^([A-G]#?)/,'').trim(); let sourceSuffix=(key+label).endsWith('maj')?'maj':'min'; if(['major','minor','dim','aug','sus2','sus4'].includes(chordOnly)){if(chordOnly==='major') nextRef='major'; else if(chordOnly==='minor') nextRef='naturalMinor'; else nextRef=chordOnly+'_'+sourceSuffix;} else{nextRef=chordOnly+'_'+sourceSuffix;} return {triad:t,color,degree,name,source:key+label,nextRef};}).filter(Boolean); return triads;}
for(let scaleName in scaleIntervals){allTriads[scaleName]={}; for(let root of noteOrder){const scaleNotes=scaleIntervals[scaleName].map(i=>noteOrder[(noteIndex(root)+i)%12]); const baseTriad=baseTriadIntervals[scaleName].map(i=>noteOrder[(noteIndex(root)+i)%12]); allTriads[scaleName][root]=computeRefTriads(baseTriad, scaleName, root, scaleNotes, keyAbbr[scaleName]);}}
for(let refName in extraTriadRefs){const baseTriadOffsets=extraTriadRefs[refName]; const scaleRel=refName.includes('_maj')?'major':'naturalMinor'; allTriads[refName]={}; for(let root of noteOrder){const scaleNotes=scaleIntervals[scaleRel].map(i=>noteOrder[(noteIndex(root)+i)%12]); const baseTriad=baseTriadOffsets.map(i=>noteOrder[(noteIndex(root)+i)%12]); allTriads[refName][root]=computeRefTriads(baseTriad, scaleRel, root, scaleNotes, refName);}}

// ---------------- TABLE & PACKAGES ----------------
let table=[], packages=[];

function insertPackage(x=50,y=50){
    let last = table.length ? table[table.length-1] : {scale:'major', key:'C', color:'BASE', triadIndex:0, nextRef:'major'};
    let nextScale = allTriads[last.nextRef] ? last.nextRef : 'major';
    let entry = {scale:nextScale, key:last.key, color:last.color, triadIndex:0, nextRef:nextScale};
    table.push(entry);

    const container=document.createElement('div'); container.className='playPackage'; container.style.left=x+'px'; container.style.top=y+'px';
    container.innerHTML=`<div class="packageHeader"><span></span><button class="deletePackage">X</button></div>
        <select class="scaleSelect">${Object.keys(allTriads).map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
        <select class="keySelect">${noteOrder.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
        <select class="colorSelect">${colorOrder.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        <button class="triadBtn"><span class="selectableText"></span><span class="chordName"></span></button>
        <div class="navButtons"><button class="prevBtn">◀</button><button class="nextBtn">▶</button></div>
        <button class="playBtn">Play</button>`;
    document.body.appendChild(container); packages.push(container);

    const scaleSelect=container.querySelector('.scaleSelect'); 
    const keySelect=container.querySelector('.keySelect');
    const colorSelect=container.querySelector('.colorSelect');
    const triadBtn=container.querySelector('.triadBtn'); 
    const playBtn=container.querySelector('.playBtn'); 
    const header=container.querySelector('.packageHeader'); 
    const deleteBtn=container.querySelector('.deletePackage');

    function render(i){
        const entry=table[i];
        container.querySelector('.packageHeader span').textContent=`Play Package ${i+1}`;
        scaleSelect.value=entry.scale; keySelect.value=entry.key; colorSelect.value=entry.color;

        const list = allTriads[entry.scale][entry.key].filter(t=>t.color===entry.color);
        if(list.length>0){ 
            const idx=Math.min(entry.triadIndex,list.length-1); 
            const t=list[idx];
            triadBtn.querySelector('.selectableText').textContent=t.triad.join('-');
            triadBtn.querySelector('.chordName').innerHTML=t.name+'<br>(Source:'+t.source+')';
            entry.nextRef=t.nextRef;
        } else {triadBtn.querySelector('.selectableText').textContent=''; triadBtn.querySelector('.chordName').textContent=''; entry.nextRef='major';}

        triadBtn.style.background=colorMap[entry.color]; playBtn.style.background=colorMap[entry.color];
        if(entry.color==='BLACK'){triadBtn.className='triadBtn blackBtn'; playBtn.className='playBtn blackBtn'; triadBtn.querySelector('.chordName').style.color='white'; triadBtn.querySelector('.selectableText').style.color='white'; playBtn.style.color='white';}
        else{triadBtn.className='triadBtn'; playBtn.className='playBtn'; triadBtn.querySelector('.chordName').style.color='#333'; triadBtn.querySelector('.selectableText').style.color='#000'; playBtn.style.color='#000';}
    }

    function updateSubsequent(start){for(let i=start;i<table.length;i++){render(i);}}

    scaleSelect.onchange=()=>{table[packages.indexOf(container)].scale=scaleSelect.value; updateSubsequent(packages.indexOf(container));};
    keySelect.onchange=()=>{table[packages.indexOf(container)].key=keySelect.value; updateSubsequent(packages.indexOf(container));};
    colorSelect.onchange=()=>{table[packages.indexOf(container)].color=colorSelect.value; updateSubsequent(packages.indexOf(container));};
    triadBtn.onclick=()=>{let idx=table[packages.indexOf(container)].triadIndex; table[packages.indexOf(container)].triadIndex=(idx+1)%allTriads[table[packages.indexOf(container)].scale][table[packages.indexOf(container)].key].filter(t=>t.color===table[packages.indexOf(container)].color).length; updateSubsequent(packages.indexOf(container));};
    playBtn.onclick=()=>{ const entry = table[packages.indexOf(container)]; const list = allTriads[entry.scale][entry.key].filter(t=>t.color===entry.color); if(list.length>0){ playChord(list[entry.triadIndex].triad); }};

    deleteBtn.onclick=()=>{ const idx=packages.indexOf(container); table.splice(idx,1); container.remove(); packages.splice(idx,1); updateSubsequent(idx);};

    // Drag
    let offsetX,offsetY,dragging=false;
    header.onmousedown=e=>{dragging=true; offsetX=e.offsetX; offsetY=e.offsetY;};
    document.onmousemove=e=>{if(dragging){ container.style.left=(e.pageX-offsetX)+'px'; container.style.top=(e.pageY-offsetY)+'px';}};
    document.onmouseup=()=>{dragging=false;};

    render(packages.indexOf(container));
}

document.getElementById('insertPackageBtn').onclick=()=>insertPackage();
</script>
</body>
</html>
