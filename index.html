<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator</title>

<style>
body { font-family: sans-serif; padding: 10px; }

table { border-collapse: collapse; margin-top: 10px; width: 100%; }
td, th { border: 1px solid #888; padding: 5px 10px; text-align: center; }

tr.blackRow td { color: white; }

button.colorBtn {
  margin: 3px;
  padding: 10px;
  min-width: 110px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

button.colorBtn.blackBtn { color: white; }

button .chordName { font-size: 0.7em; }

.colorSelect { margin-left: 5px; }

.navBtn {
  padding: 5px 8px;
  margin: 0 2px;
}

#playSource {
  margin: 10px;
  padding: 15px;
  font-size: 1.2em;
  background-color: #66CC66;
}

#playSource span {
  font-size: 0.6em;
  display: block;
}
</style>
</head>

<body>
<h2>Chord Familiarity Generator</h2>

<label>Reference scale:</label>
<select id="scaleSelect">
  <option value="major">Major</option>
  <option value="naturalMinor">Natural Minor</option>
  <option value="harmonicMinor">Harmonic Minor</option>
  <option value="melodicMinor">Melodic Minor</option>
</select>

<br><br>

<button id="playSource">
  Play Source Triad
  <span id="sourceTriadLabel"></span>
</button>

<br><br>

<label>Select sound:</label>
<select id="soundSelect">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>

<div id="buttons"></div>
<div id="output"></div>

<script src="https://unpkg.com/tone@latest"></script>

<script>
/* =======================
   MODULE 1 — DATA & LOGIC
======================= */

const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const scales={
  major:['C','D','E','F','G','A','B'],
  naturalMinor:['C','D','Eb','F','G','Ab','Bb'],
  harmonicMinor:['C','D','Eb','F','G','Ab','B'],
  melodicMinor:['C','D','Eb','F','G','A','B']
};

const baseTriads={
  major:['C','E','G'],
  naturalMinor:['C','Eb','G'],
  harmonicMinor:['C','Eb','G'],
  melodicMinor:['C','Eb','G']
};

const colorMap={
  RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',YELLOW:'#FFFF66',
  BLUE:'#6699FF',WHITE:'#FFFFFF',
  "LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'
};

function transpose(n,s){return noteOrder[(noteOrder.indexOf(n)+12+s)%12];}

function classify(triad,ref,scale){
  let same=triad.filter(n=>ref.includes(n)).length;
  let ins=triad.filter(n=>!ref.includes(n)&&scale.includes(n)).length;
  let out=3-same-ins;

  if(same==2&&ins==1) return ['RED'];
  if(same==2&&out==1) return ['ORANGE'];
  if(same==1&&ins==2) return ['GOLD'];
  if(same==1&&ins==1) return ['YELLOW'];
  if(same==1&&out==2) return ['BLUE'];
  if(same==0&&ins==3) return ['WHITE'];
  if(same==0&&ins==2) return ['LIGHT GREY'];
  if(same==0&&ins==1) return ['DARK GREY'];
  return ['BLACK'];
}

function generateTriads(base){
  let semis=[-2,-1,0,1,2];
  let set=new Set();
  for(let a of semis)for(let b of semis)for(let c of semis)
    set.add([transpose(base[0],a),transpose(base[1],b),transpose(base[2],c)].join(','));
  return [...set].map(s=>s.split(','));
}

function computeTriads(scaleKey){
  let ref=baseTriads[scaleKey];
  let scale=scales[scaleKey];
  let list=[];
  generateTriads(ref).forEach(t=>{
    let [color]=classify(t,ref,scale);
    list.push({triad:t,color});
  });
  return list;
}

/* =======================
   MODULE 2 — UI RENDERING
======================= */

function renderTable(triads){
  let html='<table><tr><th>Triad</th><th>Category</th></tr>';
  triads.forEach(t=>{
    let bg=colorMap[t.color];
    let cls=t.color==='BLACK'?'blackRow':'';
    html+=`<tr class="${cls}" style="background:${bg}">
      <td>${t.triad.join('-')}</td>
      <td>${t.color}</td>
    </tr>`;
  });
  html+='</table>';
  output.innerHTML=html;
}

function renderButtons(triads){
  let html='';
  Object.keys(colorMap).forEach(color=>{
    let list=triads.filter(t=>t.color===color);
    if(!list.length) return;

    html+=`
    <div class="triadGroup" data-color="${color}" data-index="0">
      <button class="navBtn" onclick="scrollTriad(this,-1)">◀</button>
      <button class="colorBtn ${color==='BLACK'?'blackBtn':''}"
        style="background:${colorMap[color]}"
        onclick="playChordFromBtn(this)">
        ${list[0].triad.join('-')}
      </button>
      <button class="navBtn" onclick="scrollTriad(this,1)">▶</button>

      <select class="colorSelect" onchange="changeGroupColor(this)">
        ${Object.keys(colorMap).map(c=>`<option ${c===color?'selected':''}>${c}</option>`).join('')}
      </select>
    </div>`;
  });
  buttons.innerHTML=html;
}

/* =======================
   MODULE 3 — INTERACTION
======================= */

let currentTriads=[];
let pianoSampler=null;
let synth=null;

async function initSound(){
  pianoSampler=new Tone.Sampler({
    urls:{C4:"C4.mp3"},
    baseUrl:"https://YOUR_GITHUB_RAW_URL/"
  }).toDestination();
}

function playChord(notes){
  Tone.start();
  let chord=notes.map(n=>n+'4');
  if(soundSelect.value==='piano') chord.forEach(n=>pianoSampler.triggerAttackRelease(n,'1n'));
  else{
    if(synth) synth.dispose();
    synth=new Tone.PolySynth(Tone.AMSynth).toDestination();
    synth.triggerAttackRelease(chord,'1n');
  }
}

function playChordFromBtn(btn){
  playChord(btn.innerText.split('-'));
}

function scrollTriad(btn,dir){
  let group=btn.parentElement;
  let color=group.dataset.color;
  let list=currentTriads.filter(t=>t.color===color);
  let idx=(+group.dataset.index+dir+list.length)%list.length;
  group.dataset.index=idx;
  group.querySelector('.colorBtn').innerText=list[idx].triad.join('-');
}

function changeGroupColor(sel){
  let group=sel.parentElement;
  group.dataset.color=sel.value;
  group.dataset.index=0;
  scrollTriad(group.querySelector('.navBtn'),0);
}

/* =======================
   MODULE 4 — INIT
======================= */

function updateAll(){
  currentTriads=computeTriads(scaleSelect.value);
  renderTable(currentTriads);
  renderButtons(currentTriads);
  sourceTriadLabel.innerText=baseTriads[scaleSelect.value].join('-');
}

scaleSelect.onchange=updateAll;
soundSelect.onchange=()=>{};
playSource.onclick=()=>playChord(baseTriads[scaleSelect.value]);

initSound();
updateAll();
</script>
</body>
</html>
