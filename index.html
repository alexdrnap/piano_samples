<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator</title>
<style>
body { font-family: sans-serif; padding: 10px; }
table { border-collapse: collapse; margin-top: 10px; width: 100%; }
td, th { border: 1px solid #888; padding: 5px 10px; text-align: center; }
button.colorBtn { margin: 3px; padding: 10px; min-width: 100px; display: flex; flex-direction: column; align-items: center; }
button .chordName { font-size: 0.7em; color: #333; }
.colorSelect { margin-left:5px; vertical-align:middle; }
button#playSource { margin: 10px; padding: 15px; font-size: 1.2em; background-color:#66CC66; color:#000; }
</style>
</head>
<body>
<h2>Chord Familiarity Generator</h2>

<label for="scaleSelect">Select reference scale:</label>
<select id="scaleSelect">
  <option value="major">Major</option>
  <option value="naturalMinor">Natural Minor</option>
  <option value="harmonicMinor">Harmonic Minor</option>
  <option value="melodicMinor">Melodic Minor</option>
</select>
<br><br>

<button id="playSource">Play Source Triad</button>
<br><br>

<label for="soundSelect">Select sound:</label>
<select id="soundSelect">
  <option value="triangle">Sine/Triangle Rich</option>
  <option value="AMSynth">AMSynth</option>
  <option value="FMSynth">FMSynth</option>
  <option value="MembraneSynth">MembraneSynth</option>
  <option value="PolySynth">PolySynth</option>
</select>
<br><br>

<div id="buttons"></div>
<div id="output"></div>

<script src="https://unpkg.com/tone@latest"></script>
<script>
/***********************
 * Module 1: Triad Computation & Classification
 ***********************/
const noteOrder = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function noteIndex(note){ return noteOrder.indexOf(note); }
function transpose(note,semitones){ return noteOrder[(noteIndex(note)+12+semitones)%12]; }

const scales = {
  major:['C','D','E','F','G','A','B'],
  naturalMinor:['C','D','Eb','F','G','Ab','Bb'],
  harmonicMinor:['C','D','Eb','F','G','Ab','B'],
  melodicMinor:['C','D','Eb','F','G','A','B']
};

const baseTriads = {
  major:['C','E','G'],
  naturalMinor:['C','Eb','G'],
  harmonicMinor:['C','Eb','G'],
  melodicMinor:['C','Eb','G']
};

const dimTriad = ['C','Eb','Gb'];
const augTriad = ['C','E','G#'];

function normalizeEnharmonics(triad){
  return triad.map(n=>{
    switch(n){
      case 'Db': return 'C#';
      case 'Eb': return 'D#';
      case 'Gb': return 'F#';
      case 'Ab': return 'G#';
      case 'Bb': return 'A#';
      default: return n;
    }
  });
}

function nameTriad(triad){
  if(new Set(triad).size < 3) return '';
  triad = normalizeEnharmonics(triad);
  const semitone = note => noteOrder.indexOf(note);
  const mod12 = n => (n+12)%12;
  let tri = triad.map(n => semitone(n));

  function intervalsFrom(rot){
    let ints = rot.map(n => mod12(n-rot[0]));
    ints.sort((a,b)=>a-b);
    return ints;
  }

  const triads = [
    {i:[0,4,7],l:'major'},
    {i:[0,3,7],l:'minor'},
    {i:[0,3,6],l:'dim'},
    {i:[0,4,8],l:'aug'},
    {i:[0,2,7],l:'sus2'},
    {i:[0,5,7],l:'sus4'}
  ];

  for(let s=0;s<3;s++){
    let rot=[tri[s],tri[(s+1)%3],tri[(s+2)%3]];
    let ints=intervalsFrom(rot);
    for(let t of triads){
      if(JSON.stringify(ints)===JSON.stringify(t.i)){
        return noteOrder[rot[0]]+' '+t.l;
      }
    }
  }

  for(let s=0;s<3;s++){
    let rot=[tri[s],tri[(s+1)%3],tri[(s+2)%3]];
    let i1 = mod12(rot[1]-rot[0]);
    let i2 = mod12(rot[2]-rot[1]);
    if(i1===2 && i2===3) return noteOrder[rot[0]]+'1/2dim_4m';
    if(i1===3 && i2===2) return noteOrder[rot[2]]+'7_4M';
    if(i1===4 && i2===2) return noteOrder[rot[2]]+'1/2dim_3TM';
    if(i1===2 && i2===4) return noteOrder[rot[1]]+'7_3Tm';
  }

  return '';
}

const colorMap = {RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',YELLOW:'#FFFF66',BLUE:'#6699FF',WHITE:'#FFFFFF',"LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'};

function classify(triad,refBase,scale){
  let same = triad.filter(n=>refBase.includes(n)).length;
  let inScale = triad.filter(n=>!refBase.includes(n) && scale.includes(n)).length;
  let outScale = triad.length - same - inScale;

  if(same==2 && inScale==1) return ['RED','3/4'];
  if(same==2 && outScale==1) return ['ORANGE','3/5'];
  if(same==1 && inScale==2) return ['GOLD','1/2'];
  if(same==1 && inScale==1 && outScale==1) return ['YELLOW','2/5'];
  if(same==1 && outScale==2) return ['BLUE','1/3'];
  if(same==0 && inScale==3) return ['WHITE','1/6'];
  if(same==0 && inScale==2 && outScale==1) return ['LIGHT GREY','1/10'];
  if(same==0 && inScale==1 && outScale==2) return ['DARK GREY','1/20'];
  if(same==0 && outScale==3) return ['BLACK','0'];
  return ['UNKNOWN','-'];
}

function generateTriads(base){
  const semis=[-2,-1,0,1,2];
  let results=new Set();

  for(let i=0;i<3;i++)
    for(let s of semis){
      let tri=[...base];
      tri[i]=transpose(tri[i],s);
      results.add(tri.join(','));
    }

  for(let i=0;i<2;i++)
    for(let j=i+1;j<3;j++)
      for(let s1 of semis)
        for(let s2 of semis){
          let tri=[...base];
          tri[i]=transpose(tri[i],s1);
          tri[j]=transpose(tri[j],s2);
          results.add(tri.join(','));
        }

  for(let s1 of semis)
    for(let s2 of semis)
      for(let s3 of semis){
        let tri=[transpose(base[0],s1),transpose(base[1],s2),transpose(base[2],s3)];
        results.add(tri.join(','));
      }

  return Array.from(results).map(r=>r.split(','));
}

function computeTriadsForScale(scaleKey){
  const scale = scales[scaleKey];
  const refBase = baseTriads[scaleKey];
  let cTriads = [];

  // main scale triads
  generateTriads(baseTriads[scaleKey]).forEach(t=>{
    const [color, degree] = classify(t, refBase, scale);
    const name = nameTriad(t);
    if(name) cTriads.push({triad:t, source:scaleKey, color, degree, name});
  });

  // add dim or aug based on scale
  if(scaleKey !== 'major'){
    generateTriads(dimTriad).forEach(t=>{
      const [color, degree] = classify(t, refBase, scale);
      const name = nameTriad(t);
      if(name) cTriads.push({triad:t, source:'C dim', color, degree, name});
    });
  } else {
    generateTriads(augTriad).forEach(t=>{
      const [color, degree] = classify(t, refBase, scale);
      const name = nameTriad(t);
      if(name) cTriads.push({triad:t, source:'C aug', color, degree, name});
    });
  }

  // remove duplicates
  let seen = new Set();
  let uniqueC = [];
  cTriads.forEach(obj=>{
    let canonical = obj.triad.slice().sort((a,b)=>noteOrder.indexOf(a)-noteOrder.indexOf(b)).join(',');
    if(!seen.has(canonical)){
      seen.add(canonical);
      uniqueC.push(obj);
    }
  });

  return uniqueC;
}

/***********************
 * Module 2: UI Rendering
 ***********************/
function renderTable(triads){
  let html='<table><tr><th>Triad</th><th>Chord Name</th><th>Category</th><th>Degree</th><th>Source</th></tr>';
  triads.forEach(obj=>{
    html += `<tr>
      <td>${obj.triad.join('-')}</td>
      <td>${obj.name}</td>
      <td>${obj.color}</td>
      <td>${obj.degree}</td>
      <td>${obj.source}</td>
    </tr>`;
  });
  html+='</table>';
  document.getElementById('output').innerHTML = html;
}

function renderButtons(triads){
  let colors = Object.keys(colorMap);
  let btnHTML='';
  colors.forEach(c=>{
    let filtered = triads.filter(t=>t.color===c);
    let randomChord = filtered[Math.floor(Math.random()*filtered.length)];
    let chordName = randomChord ? randomChord.name : '';
    let chordNotes = randomChord ? randomChord.triad : [];
    let colorHex = colorMap[c];
    btnHTML += `
      <button class='colorBtn' style='background-color:${colorHex};' onclick='pickChord("${c}", this)'>${chordNotes.join('-')}<span class='chordName'>${chordName}</span></button>
      <select class='colorSelect' onchange='updateButtonColorFromSelect(this)'>
        ${Object.entries(colorMap).map(([k,v])=>`<option value='${v}' ${v===colorHex?'selected':''}>${k}</option>`).join('')}
      </select>
      <button onclick='playChordFromButton(this)'>Play</button>
    `;
  });
  document.getElementById('buttons').innerHTML = btnHTML;
}

function updateButtonColorFromSelect(select){
  let btn = select.previousElementSibling;
  btn.style.backgroundColor = select.value;
  let chordText = btn.childNodes[0].nodeValue.trim();
  let chordObj = currentTriads.find(t=>t.triad.join('-')===chordText);
  if(chordObj) chordObj.color = select.value;
}

/***********************
 * Module 3: Audio & Interaction
 ***********************/
let currentSynth = null;
let currentSound = 'triangle';
let pianoSampler = null;
let activeSourceTriad = [];
let currentTriads = [];

async function changeSound(sound){
  currentSound = sound;
  if(sound==='piano' && !pianoSampler){
    pianoSampler = new Tone.Sampler({
      urls:{C4:"https://tonejs.github.io/audio/salamander/C4.mp3"},
      baseUrl:"https://tonejs.github.io/audio/salamander/"
    }).toDestination();
    await pianoSampler.loaded;
  }
}

async function playChord(notes){
  await Tone.start();
  if(currentSynth){ currentSynth.dispose(); currentSynth=null; }
  const chordNotes = notes.map(n=>n+'5');

  if(currentSound==='triangle'){
    currentSynth = new Tone.PolySynth(Tone.Synth,{
      oscillator:{type:'triangle'},
      envelope:{attack:0.1,decay:0.1,sustain:0.7,release:0.3}
    }).toDestination();
    currentSynth.triggerAttackRelease(chordNotes,'1n');
  } else if(currentSound==='piano' && pianoSampler){
    chordNotes.forEach(n=>pianoSampler.triggerAttackRelease(n,'1n'));
  } else if(currentSound==='AMSynth'){
    currentSynth = new Tone.PolySynth(Tone.AMSynth).toDestination();
    currentSynth.triggerAttackRelease(chordNotes,'1n');
  } else if(currentSound==='FMSynth'){
    currentSynth = new Tone.PolySynth(Tone.FMSynth).toDestination();
    currentSynth.triggerAttackRelease(chordNotes,'1n');
  } else if(currentSound==='MembraneSynth'){
    currentSynth = new Tone.PolySynth(Tone.MembraneSynth).toDestination();
    currentSynth.triggerAttackRelease(chordNotes,'1n');
  } else if(currentSound==='PolySynth'){
    currentSynth = new Tone.PolySynth().toDestination();
    currentSynth.triggerAttackRelease(chordNotes,'1n');
  }
}

function playChordFromButton(btn){
  let chordText = btn.previousElementSibling.previousElementSibling.childNodes[0].nodeValue.trim();
  if(!chordText) return;
  let notes = chordText.split('-');
  playChord(notes);
}

function playSourceTriad(){
  if(activeSourceTriad.length>0) playChord(activeSourceTriad);
}

function pickChord(color, btn){
  let filtered = currentTriads.filter(t=>t.color===color);
  if(filtered.length>0){
    let choice = filtered[Math.floor(Math.random()*filtered.length)];
    btn.innerHTML = choice.triad.join('-')+`<span class='chordName'>${choice.name}</span>`;
  }
}

/***********************
 * Module 4: Initialization
 ***********************/
function initApp(){
  const scaleSelect = document.getElementById('scaleSelect');
  const soundSelect = document.getElementById('soundSelect');
  const playSourceBtn = document.getElementById('playSource');

  function updatePage(){
    const triads = computeTriadsForScale(scaleSelect.value);
    currentTriads = triads;
    activeSourceTriad = baseTriads[scaleSelect.value];
    renderTable(triads);
    renderButtons(triads);
  }

  scaleSelect.onchange = updatePage;
  soundSelect.onchange = ()=>changeSound(soundSelect.value);
  playSourceBtn.onclick = playSourceTriad;

  updatePage(); // initial load
}

initApp();
</script>
</body>
</html>
