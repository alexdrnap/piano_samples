<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>

<style>
body { font-family: sans-serif; padding: 10px; }
button, select { cursor: pointer; }
button.colorBtn { display: flex; flex-direction: column; align-items: center; min-width: 120px; padding: 5px; margin: 3px; }
button .chordName { font-size: 0.7em; color: #333; }
.selectableText { user-select: text; cursor: text; }
.playPackage { position: absolute; border: 1px solid #888; padding: 5px; background: #f9f9f9; width: 150px; z-index: 1000; }
.packageHeader { display: flex; justify-content: space-between; align-items: center; cursor: move; background: #ddd; padding: 2px 5px; }
.navButtons { display: flex; justify-content: center; margin: 3px 0; }
.navButtons button { margin: 0 2px; }
.triadBtn, .playBtn { width: 100%; margin: 3px 0; height: 40px; font-size: 0.9em; color:#000; }
.triadBtn.blackBtn, .playBtn.blackBtn { color: white; }
.deletePackage { background:red; color:white; border:none; cursor:pointer; padding:0 5px; }
</style>
</head>

<body>
<h2>Chord Familiarity Generator - Play Packages</h2>

<label>Select Sound:</label>
<select onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>

<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>

<script src="https://unpkg.com/tone@latest"></script>
<script>
// ================= GLOBAL MEMORY =================
let lastPackageState = null;

// ================= DATA =================
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const scaleIntervals = {
  major:[0,2,4,5,7,9,11],
  naturalMinor:[0,2,3,5,7,8,10],
  harmonicMinor:[0,2,3,5,7,8,11],
  melodicMinor:[0,2,3,5,7,9,11]
};

const baseTriadIntervals = {
  major:[0,4,7],
  naturalMinor:[0,3,7],
  harmonicMinor:[0,3,7],
  melodicMinor:[0,3,7]
};

const keyAbbr = {
  major:'maj',
  naturalMinor:'min',
  harmonicMinor:'harmMin',
  melodicMinor:'melMin'
};

const extraTriadRefs = {
  'sus2_maj':[0,2,7], 'sus2_min':[0,2,7],
  'sus4_maj':[0,5,7], 'sus4_min':[0,5,7],
  'aug_maj':[0,4,8],  'aug_min':[0,4,8],
  'dim_maj':[0,3,6],  'dim_min':[0,3,6],
  '7_3Tm_maj':[0,2,6],'7_3Tm_min':[0,2,6],
  '1/2dim_3TM_maj':[0,4,6],'1/2dim_3TM_min':[0,4,6],
  '1/2dim_4m_maj':[0,2,5],'1/2dim_4m_min':[0,2,5],
  '7_4M_maj':[0,3,5],'7_4M_min':[0,3,5]
};

const colorMap={
  BASE:'#00AA00',RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',
  YELLOW:'#FFFF66',BLUE:'#6699FF',WHITE:'#FFFFFF',
  "LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'
};
const colorOrder = Object.keys(colorMap);

// ================= HELPERS =================
const noteIndex=n=>noteOrder.indexOf(n);
const transpose=(n,s)=>noteOrder[(noteIndex(n)+12+s)%12];

function normalizeEnharmonics(triad){
  return triad.map(n=>({Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#'}[n]||n));
}

// ================= CHORD PARSING =================
function parseChordName(name){
  const parts=name.split(' ');
  return { root:parts[0], quality:parts.slice(1).join(' ') };
}

function inferScaleFromChord(chordName, source){
  const {quality}=parseChordName(chordName);

  if(quality.includes('major')) return 'major';
  if(quality.includes('minor')) return 'naturalMinor';
  if(quality.includes('dim'))   return 'naturalMinor';
  if(quality.includes('aug'))   return 'major';

  for(let ref in extraTriadRefs){
    const short=ref.replace(/_(maj|min)/,'');
    if(quality.includes(short)){
      if(source.includes('_min')||source.includes('min')) return short+'_min';
      return short+'_maj';
    }
  }

  if(source.includes('min')) return 'naturalMinor';
  return 'major';
}

// ================= TRIAD LOGIC =================
function classify(triad,refBase,scale){
  if(triad.slice().sort().join(',')===refBase.slice().sort().join(',')) return['BASE','1/1'];
  let same=triad.filter(n=>refBase.includes(n)).length;
  let inScale=triad.filter(n=>!refBase.includes(n)&&scale.includes(n)).length;
  let out=3-same-inScale;
  if(same==2&&inScale==1)return['RED','3/4'];
  if(same==2&&out==1)return['ORANGE','3/5'];
  if(same==1&&inScale==2)return['GOLD','1/2'];
  if(same==1&&inScale==1&&out==1)return['YELLOW','2/5'];
  if(same==1&&out==2)return['BLUE','1/3'];
  if(same==0&&inScale==3)return['WHITE','1/6'];
  if(same==0&&inScale==2&&out==1)return['LIGHT GREY','1/10'];
  if(same==0&&inScale==1&&out==2)return['DARK GREY','1/20'];
  if(same==0&&out==3)return['BLACK','0'];
  return['UNKNOWN','-'];
}

function nameTriad(triad){
  if(new Set(triad).size<3) return '';
  triad=normalizeEnharmonics(triad);
  const tri=triad.map(noteIndex);
  const mod=n=>(n+12)%12;

  function intervals(rot){
    return rot.map(n=>mod(n-rot[0])).sort((a,b)=>a-b);
  }

  const types=[
    {i:[0,4,7],l:'major'},{i:[0,3,7],l:'minor'},
    {i:[0,3,6],l:'dim'},{i:[0,4,8],l:'aug'},
    {i:[0,2,7],l:'sus2'},{i:[0,5,7],l:'sus4'}
  ];

  for(let s=0;s<3;s++){
    const rot=[tri[s],tri[(s+1)%3],tri[(s+2)%3]];
    for(let t of types)
      if(JSON.stringify(intervals(rot))===JSON.stringify(t.i))
        return noteOrder[rot[0]]+' '+t.l;
  }

  for(let s=0;s<3;s++){
    const r=[tri[s],tri[(s+1)%3],tri[(s+2)%3]];
    const i1=mod(r[1]-r[0]), i2=mod(r[2]-r[1]);
    if(i1==2&&i2==3)return noteOrder[r[0]]+' 1/2dim_4m';
    if(i1==3&&i2==2)return noteOrder[r[2]]+' 7_4M';
    if(i1==4&&i2==2)return noteOrder[r[2]]+' 1/2dim_3TM';
    if(i1==2&&i2==4)return noteOrder[r[1]]+' 7_3Tm';
  }
  return '';
}

// ================= TRIAD GENERATION =================
function generateTriads(base){
  const semis=[-2,-1,0,1,2];
  const out=new Set();
  for(let s1 of semis)
    for(let s2 of semis)
      for(let s3 of semis)
        out.add([
          transpose(base[0],s1),
          transpose(base[1],s2),
          transpose(base[2],s3)
        ].join(','));
  return [...out].map(x=>x.split(','));
}

// ================= PRECOMPUTE =================
const allTriads={};

function computeRefTriads(base,scale,key,scaleNotes,label){
  return generateTriads(base).map(t=>{
    const [color]=classify(t,base,scaleNotes);
    const name=nameTriad(t);
    return name?{triad:t,color,name,source:key+label}:null;
  }).filter(Boolean);
}

for(let s in scaleIntervals){
  allTriads[s]={};
  for(let r of noteOrder){
    const scaleNotes=scaleIntervals[s].map(i=>noteOrder[(noteIndex(r)+i)%12]);
    const base=baseTriadIntervals[s].map(i=>noteOrder[(noteIndex(r)+i)%12]);
    allTriads[s][r]=computeRefTriads(base,s,r,scaleNotes,keyAbbr[s]);
  }
}

for(let ref in extraTriadRefs){
  const rel=ref.includes('_maj')?'major':'naturalMinor';
  allTriads[ref]={};
  for(let r of noteOrder){
    const scaleNotes=scaleIntervals[rel].map(i=>noteOrder[(noteIndex(r)+i)%12]);
    const base=extraTriadRefs[ref].map(i=>noteOrder[(noteIndex(r)+i)%12]);
    allTriads[ref][r]=computeRefTriads(base,rel,r,scaleNotes,ref);
  }
}

// ================= PLAY PACKAGE =================
function createPlayPackage(x=50,y=50){
  let initKey='C', initScale='major';

  if(lastPackageState){
    const p=parseChordName(lastPackageState.chordName);
    initKey=p.root;
    initScale=inferScaleFromChord(lastPackageState.chordName,lastPackageState.source);
  }

  const c=document.createElement('div');
  c.className='playPackage';
  c.style.left=x+'px';
  c.style.top=y+'px';

  c.innerHTML=`
    <div class="packageHeader">
      <span>Play Package</span>
      <button class="deletePackage">X</button>
    </div>
    <select class="scaleSelect">
      ${Object.keys(allTriads).map(s=>`<option ${s===initScale?'selected':''}>${s}</option>`).join('')}
    </select>
    <select class="keySelect">
      ${noteOrder.map(n=>`<option ${n===initKey?'selected':''}>${n}</option>`).join('')}
    </select>
    <select class="colorSelect">
      ${colorOrder.map(c=>`<option>${c}</option>`).join('')}
    </select>
    <button class="triadBtn"><span class="selectableText"></span><span class="chordName"></span></button>
    <div class="navButtons">
      <button class="prevBtn">◀</button>
      <button class="nextBtn">▶</button>
    </div>
  `;

  document.body.appendChild(c);

  let idx=0;
  function update(){
    const s=c.querySelector('.scaleSelect').value;
    const k=c.querySelector('.keySelect').value;
    const col=c.querySelector('.colorSelect').value;
    const list=allTriads[s][k].filter(t=>t.color===col);
    if(!list.length)return;
    idx=(idx+list.length)%list.length;
    const t=list[idx];
    c.querySelector('.selectableText').textContent=t.triad.join('-');
    c.querySelector('.chordName').textContent=t.name+' ('+t.source+')';
    lastPackageState={ chordName:t.name, source:t.source };
  }

  c.querySelectorAll('select,button').forEach(e=>e.onclick=update);
  update();
}

document.getElementById('insertPackageBtn').onclick=()=>createPlayPackage();
</script>
</body>
</html>
