<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>
<style>
/* ---------- GENERAL STYLES ---------- */
body {
    font-family: 'Segoe UI', sans-serif;
    padding: 10px;
    margin: 0;
    background-color: #1e1e1e;
    color: #eee;
}
h2 {
    text-align: center;
    color: #fff;
}
/* ---------- SELECTS & BUTTONS ---------- */
button, select {
    cursor: pointer;
    font-size: 0.95em;
    border: none;
    border-radius: 6px;
    outline: none;
}
select {
    padding: 6px 10px;
    margin: 0 5px 10px 0;
    background-color: #333;
    color: #eee;
}
.colorSelect {
    width: 100%;
    padding: 6px 10px;
    margin: 0 0 10px 0;
    background-color: #333;
    color: #eee;
    border-radius: 6px;
    box-sizing: border-box;
}
button {
    padding: 10px;
    background-color: #444;
    color: #fff;
    transition: background 0.2s;
}
button:hover {
    background-color: #555;
}
/* ---------- GRID CONTAINER ---------- */
#gridContainer {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
    justify-items: start;
    align-items: start;
}
/* ---------- PLAY PACKAGE CONTAINER ---------- */
.playPackage {
    border: 1px solid #555;
    padding: 12px;
    background: #2c2c2c;
    width: 260px;
    box-sizing: border-box;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
}
/* ---------- PACKAGE HEADER ---------- */
.packageHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #3a3a3a;
    padding: 8px 10px;
    border-radius: 8px;
    user-select: none;
}
.packageHeader span {
    font-weight: bold;
    color: #fff;
}
/* ---------- CLOSE BUTTON ---------- */
.deletePackage {
    background: #e74c3c;
    color: #fff;
    font-size: 1.2em;
    padding: 4px 8px;
    border-radius: 6px;
    touch-action: manipulation;
}
/* ---------- TRIAD & PLAY BUTTON ---------- */
.triadBtn, .playBtn {
    width: 100%;
    height: 70px;
    font-size: 0.95em;
    padding: 5px;
    text-align: center;
    border-radius: 8px;
    transition: transform 0.1s;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    word-break: break-word;
}
.triadBtn:active, .playBtn:active {
    transform: scale(0.97);
}
.triadBtn.blackBtn, .playBtn.blackBtn {
    color: #fff;
}
.navButtons {
    display: flex;
    justify-content: center;
    margin: 6px 0;
}
.navButtons button {
    flex: 1;
    margin: 0 3px;
    background-color: #444;
    color: #fff;
    border-radius: 6px;
}
.navButtons button:hover {
    background-color: #555;
}
.selectableText, .chordName {
    display: block;
    font-weight: 500;
}
</style>
</head>
<body>
<h2>Chord Familiarity Generator - Play Packages</h2>

<label for="soundSelectGlobal">Select Sound:</label>
<select id="soundSelectGlobal" onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>
<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>
<button id="size_toggle">Toggle Size</button>

<div id="gridContainer"></div>

<script src="https://unpkg.com/tone@latest"></script>
<script>
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const scaleIntervals = { major:[0,2,4,5,7,9,11], naturalMinor:[0,2,3,5,7,8,10], harmonicMinor:[0,2,3,5,7,8,11], melodicMinor:[0,2,3,5,7,9,11] };
const baseTriadIntervals = { major:[0,4,7], naturalMinor:[0,3,7], harmonicMinor:[0,3,7], melodicMinor:[0,3,7] };
const keyAbbr = { major:'maj', naturalMinor:'min', harmonicMinor:'harmMin', melodicMinor:'melMin' };

let allTriads = {};
function noteIndex(note){return noteOrder.indexOf(note);}
function generateTriads(base){ return [base]; }
function normalizeEnharmonics(triad){ return triad; }
function classify(triad,refBase,scale){ return ['BASE','1/1']; }
function nameTriad(triad){ return triad.join('-'); }

// Precompute allTriads
for(let scaleName in scaleIntervals){
  allTriads[scaleName]={};
  for(let root of noteOrder){
    const baseTriad=baseTriadIntervals[scaleName].map(i=>noteOrder[(noteIndex(root)+i)%12]);
    allTriads[scaleName][root]=[{triad:baseTriad,color:'BASE',degree:'1/1',name:nameTriad(baseTriad),source:root+keyAbbr[scaleName],nextRef:scaleName}];
  }
}

let allPackages=[];
let nextPackageNumber=1;
let currentScaleSize=1;

function createPlayPackage(){
  const container=document.createElement('div');
  container.className='playPackage';
  container.style.transform=`scale(${currentScaleSize})`;
  container.style.transformOrigin='top left';
  container.dataset.pkgNumber=nextPackageNumber++;
  container.innerHTML=`
    <div class="packageHeader"><span>Play Package ${container.dataset.pkgNumber}</span><button class="deletePackage">X</button></div>
    <select class="scaleSelect">${Object.keys(allTriads).map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
    <select class="keySelect">${noteOrder.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
    <select class="colorSelect">${['BASE'].map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
    <button class="triadBtn"><span class="selectableText"></span><span class="chordName"></span></button>
    <div class="navButtons"><button class="prevBtn">◀</button><button class="nextBtn">▶</button></div>
    <button class="playBtn">Play</button>
  `;
  document.getElementById('gridContainer').appendChild(container);
  allPackages.push(container);

  const scaleSelect=container.querySelector('.scaleSelect');
  const keySelect=container.querySelector('.keySelect');
  const colorSelect=container.querySelector('.colorSelect');
  const triadBtn=container.querySelector('.triadBtn');
  let currentIndex=0;

  function updateTriadForPackage(){
    const scale = scaleSelect.value;
    const key = keySelect.value;
    const color = colorSelect.value;
    const list = allTriads[scale][key].filter(t=>t.color===color);
    if(list.length===0) return;
    currentIndex = currentIndex % list.length;
    const t = list[currentIndex];
    triadBtn.querySelector('.selectableText').textContent = t.triad.join('-');
    triadBtn.querySelector('.chordName').textContent = t.name;
  }

  scaleSelect.onchange=keySelect.onchange=colorSelect.onchange=()=>{ updateTriadForPackage(); };
  container.querySelector('.prevBtn').onclick=()=>{ currentIndex--; updateTriadForPackage(); };
  container.querySelector('.nextBtn').onclick=()=>{ currentIndex++; updateTriadForPackage(); };

  const deleteBtn = container.querySelector('.deletePackage');
  deleteBtn.addEventListener('click',()=>{ container.remove(); allPackages=allPackages.filter(p=>p!==container); });

  updateTriadForPackage();
}

document.getElementById('insertPackageBtn').onclick=()=>{ createPlayPackage(); };

const sizeOptions=[0.5,0.75,1];
let currentSizeIndex=2;
document.getElementById('size_toggle').onclick=()=>{
    currentSizeIndex=(currentSizeIndex+1)%sizeOptions.length;
    currentScaleSize=sizeOptions[currentSizeIndex];
    allPackages.forEach(pkg=>{ pkg.style.transform=`scale(${currentScaleSize})`; pkg.style.transformOrigin='top left'; });
    document.getElementById('gridContainer').style.gridTemplateColumns=`repeat(auto-fill, minmax(${260*currentScaleSize}px, 1fr))`;
};
</script>
</body>
</html>
