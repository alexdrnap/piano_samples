<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    padding: 10px;
    margin: 0;
    background-color: #1e1e1e;
    color: #eee;
}
h2 { text-align: center; }

button, select {
    cursor: pointer;
    font-size: 0.95em;
    border: none;
    border-radius: 6px;
}

select {
    padding: 6px 10px;
    margin: 0 5px 10px 0;
    background-color: #333;
    color: #eee;
}

.colorSelect {
    width: 100%;
    margin-bottom: 10px;
}

button {
    padding: 10px;
    background-color: #444;
    color: #fff;
}

.playPackage {
    position: absolute;
    border: 1px solid #555;
    padding: 12px;
    background: #2c2c2c;
    width: 260px;
    z-index: 1000;
    box-sizing: border-box;
    border-radius: 12px;
}

.packageHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: move;
    background: #3a3a3a;
    padding: 8px 10px;
    border-radius: 8px;
}

.deletePackage {
    background: #e74c3c;
    color: #fff;
    padding: 4px 8px;
}

.triadBtn, .playBtn {
    width: 100%;
    height: 70px;
    border-radius: 8px;
}

.navButtons {
    display: flex;
    margin: 6px 0;
}

.navButtons button {
    flex: 1;
    margin: 0 3px;
}
</style>
</head>

<body>

<h2>Chord Familiarity Generator - Play Packages</h2>

<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>
<button id="size_toggle">Toggle Size</button>

<script src="https://unpkg.com/tone@latest"></script>
<script>

// ---------- SIZE SYSTEM ----------
const sizeOptions = [0.5, 0.75, 1];
let currentSizeIndex = 2;

// ---------- NUMBER SYSTEM ----------
let packageCounter = 0;
let allPackages = [];

// ---------- BASIC DATA ----------
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const colorMap={
  BASE:'#00AA00',RED:'#FF4C4C',ORANGE:'#FF9900',
  GOLD:'#FFD700',YELLOW:'#FFFF66',
  BLUE:'#6699FF',WHITE:'#FFFFFF',
  "LIGHT GREY":'#CCCCCC',
  "DARK GREY":'#888888',
  BLACK:'#000000'
};
const colorOrder = Object.keys(colorMap);

// ---------- SIMPLE TRIAD MOCK (kept minimal for stability) ----------
const allTriads = {
  major:{
    C:[
      {triad:["C","E","G"],color:"BASE",name:"C major",source:"Cmaj",nextRef:"major"},
      {triad:["C","D","G"],color:"RED",name:"C sus2",source:"Cmaj",nextRef:"major"}
    ]
  }
};

// ---------- CREATE PACKAGE ----------
function createPlayPackage(x=50,y=50){

  packageCounter++;
  const number = packageCounter;

  const container=document.createElement('div');
  container.className='playPackage';
  container.dataset.number = number;
  container.style.left=x+'px';
  container.style.top=y+'px';
  container.style.transform=`scale(${sizeOptions[currentSizeIndex]})`;
  container.style.transformOrigin='top left';

  container.innerHTML=`
    <div class="packageHeader">
      <span>Play Package ${number}</span>
      <button class="deletePackage">X</button>
    </div>
    <select class="scaleSelect">
      <option value="major">major</option>
    </select>
    <select class="keySelect">
      <option value="C">C</option>
    </select>
    <select class="colorSelect">
      ${colorOrder.map(c=>`<option value="${c}">${c}</option>`).join('')}
    </select>
    <button class="triadBtn">
      <span class="selectableText"></span>
      <span class="chordName"></span>
    </button>
    <div class="navButtons">
      <button class="prevBtn">◀</button>
      <button class="nextBtn">▶</button>
    </div>
    <button class="playBtn">Play</button>
  `;

  document.body.appendChild(container);
  allPackages.push(container);

  const scaleSelect=container.querySelector('.scaleSelect');
  const keySelect=container.querySelector('.keySelect');
  const colorSelect=container.querySelector('.colorSelect');
  const triadBtn=container.querySelector('.triadBtn');

  let index=0;

  function updateTriad(){
    const list = allTriads[scaleSelect.value][keySelect.value]
      .filter(t=>t.color===colorSelect.value);

    if(!list.length) return;

    index=(index+list.length)%list.length;
    const t=list[index];

    triadBtn.querySelector('.selectableText').textContent=t.triad.join("-");
    triadBtn.querySelector('.chordName').innerHTML=
      t.name+"<br>(Source: "+t.source+")";

    triadBtn.dataset.nextRef=t.nextRef;

    triadBtn.style.background=colorMap[colorSelect.value];
    container.querySelector('.playBtn').style.background=colorMap[colorSelect.value];
  }

  function updateChain(){
    const myNumber=parseInt(container.dataset.number);
    const nextPkg=allPackages.find(
      p=>parseInt(p.dataset.number)===myNumber+1
    );

    if(!nextPkg) return;

    const nextRef=triadBtn.dataset.nextRef || scaleSelect.value;

    nextPkg.querySelector('.scaleSelect').value=nextRef;
    nextPkg.updateTriad();
    nextPkg.updateChain();
  }

  container.updateTriad=updateTriad;
  container.updateChain=updateChain;

  scaleSelect.onchange=keySelect.onchange=colorSelect.onchange=()=>{
    updateTriad();
    updateChain();
  };

  container.querySelector('.prevBtn').onclick=()=>{
    index--;
    updateTriad();
    updateChain();
  };

  container.querySelector('.nextBtn').onclick=()=>{
    index++;
    updateTriad();
    updateChain();
  };

  container.querySelector('.deletePackage').onclick=()=>{
    container.remove();
    allPackages=allPackages.filter(p=>p!==container);
  };

  updateTriad();
}

// ---------- INSERT ----------
document.getElementById('insertPackageBtn').onclick=()=>{
  createPlayPackage(
    50+Math.random()*40,
    50+Math.random()*40
  );
};

// ---------- SIZE TOGGLE ----------
document.getElementById('size_toggle').onclick=()=>{
  currentSizeIndex=(currentSizeIndex+1)%sizeOptions.length;
  allPackages.forEach(pkg=>{
    pkg.style.transform=`scale(${sizeOptions[currentSizeIndex]})`;
  });
};

</script>
</body>
</html>
