<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>
<style>
body { font-family: 'Segoe UI', sans-serif; padding: 10px; margin: 0; background-color: #1e1e1e; color: #eee; }
h2 { text-align: center; color: #fff; }
button, select { cursor: pointer; font-size: 0.95em; border: none; border-radius: 6px; outline: none; }
select { padding: 6px 10px; margin: 0 5px 10px 0; background-color: #333; color: #eee; }
.colorSelect { width: 100%; padding: 6px 10px; margin: 0 0 10px 0; background-color: #333; color: #eee; border-radius: 6px; box-sizing: border-box; }
button { padding: 10px; background-color: #444; color: #fff; transition: background 0.2s; }
button:hover { background-color: #555; }
.playPackage { position: absolute; border: 1px solid #555; padding: 12px; background: #2c2c2c; width: 260px; z-index: 1000; box-sizing: border-box; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
.packageHeader { display: flex; justify-content: space-between; align-items: center; cursor: move; background: #3a3a3a; padding: 8px 10px; border-radius: 8px; user-select: none; }
.packageHeader span { font-weight: bold; color: #fff; }
.deletePackage { background: #e74c3c; color: #fff; font-size: 1.2em; padding: 4px 8px; border-radius: 6px; touch-action: manipulation; }
.triadBtn, .playBtn { width: 100%; height: 70px; font-size: 0.95em; padding: 5px; text-align: center; border-radius: 8px; transition: transform 0.1s; display: flex; flex-direction: column; justify-content: center; align-items: center; word-break: break-word; }
.triadBtn:active, .playBtn:active { transform: scale(0.97); }
.triadBtn.blackBtn, .playBtn.blackBtn { color: #fff; }
.navButtons { display: flex; justify-content: center; margin: 6px 0; }
.navButtons button { flex: 1; margin: 0 3px; background-color: #444; color: #fff; border-radius: 6px; }
.navButtons button:hover { background-color: #555; }
.selectableText, .chordName { display: block; font-weight: 500; }
</style>
</head>
<body>

<h2>Chord Familiarity Generator - Play Packages</h2>

<label for="soundSelectGlobal">Select Sound:</label>
<select id="soundSelectGlobal" onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>
<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>
<button id="size_toggle">Toggle Size</button>

<script src="https://unpkg.com/tone@latest"></script>
<script>

// ---------------- DATA (UNCHANGED) ----------------
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const scaleIntervals={major:[0,2,4,5,7,9,11],naturalMinor:[0,2,3,5,7,8,10],harmonicMinor:[0,2,3,5,7,8,11],melodicMinor:[0,2,3,5,7,9,11]};
const baseTriadIntervals={major:[0,4,7],naturalMinor:[0,3,7],harmonicMinor:[0,3,7],melodicMinor:[0,3,7]};
const keyAbbr={major:'maj',naturalMinor:'min',harmonicMinor:'harmMin',melodicMinor:'melMin'};
const extraTriadRefs={'sus2_maj':[0,2,7],'sus2_min':[0,2,7],'sus4_maj':[0,5,7],'sus4_min':[0,5,7],'aug_maj':[0,4,8],'aug_min':[0,4,8],'dim_maj':[0,3,6],'dim_min':[0,3,6],'7_3Tm_maj':[0,2,6],'7_3Tm_min':[0,2,6],'1/2dim_3TM_maj':[0,4,6],'1/2dim_3TM_min':[0,4,6],'1/2dim_4m_maj':[0,2,5],'1/2dim_4m_min':[0,2,5],'7_4M_maj':[0,3,5],'7_4M_min':[0,3,5]};
const colorMap={BASE:'#00AA00',RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',YELLOW:'#FFFF66',BLUE:'#6699FF',WHITE:'#FFFFFF',"LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'};
const colorOrder=['BASE','RED','ORANGE','GOLD','YELLOW','BLUE','WHITE','LIGHT GREY','DARK GREY','BLACK'];

// ---------------- PLAY PACKAGE SYSTEM ----------------

let allPackages=[];
let currentScaleValue=1;
const sizeOptions=[0.5,0.75,1];
let currentSizeIndex=2;

// -------- CREATE PACKAGE --------
function createPlayPackage(x=50,y=50){

  const highestNumber = allPackages.length
    ? Math.max(...allPackages.map(p=>Number(p.dataset.packageNumber)))
    : 0;

  const packageNumber = highestNumber + 1;

  const container=document.createElement('div');
  container.className='playPackage';
  container.style.left=x+'px';
  container.style.top=y+'px';
  container.style.transform=`scale(${currentScaleValue})`;
  container.style.transformOrigin='top left';
  container.dataset.packageNumber=packageNumber;

  container.innerHTML=`
    <div class="packageHeader">
      <span>Play Package ${packageNumber}</span>
      <button class="deletePackage">X</button>
    </div>
    <select class="scaleSelect"></select>
    <select class="keySelect"></select>
    <select class="colorSelect"></select>
    <button class="triadBtn"><span class="selectableText"></span><span class="chordName"></span></button>
    <div class="navButtons"><button class="prevBtn">◀</button><button class="nextBtn">▶</button></div>
    <button class="playBtn">Play</button>
  `;

  document.body.appendChild(container);
  allPackages.push(container);

  // -------- DELETE (NO RENNUMBERING, NO CHAIN FIX) --------
  container.querySelector('.deletePackage').onclick=()=>{
    container.remove();
    allPackages=allPackages.filter(p=>p!==container);
  };

  // -------- INHERIT ONLY FROM PREVIOUS NUMBER --------
  const prevNumber=packageNumber-1;
  const prevPkg=allPackages.find(p=>Number(p.dataset.packageNumber)===prevNumber);

  if(prevPkg){
    const prevScale=prevPkg.querySelector('.scaleSelect')?.value;
    const prevKey=prevPkg.querySelector('.keySelect')?.value;
    const prevColor=prevPkg.querySelector('.colorSelect')?.value;

    if(prevScale) container.querySelector('.scaleSelect').value=prevScale;
    if(prevKey) container.querySelector('.keySelect').value=prevKey;
    if(prevColor) container.querySelector('.colorSelect').value=prevColor;
  }
}

// -------- INSERT BUTTON --------
document.getElementById('insertPackageBtn').onclick=()=>{
  createPlayPackage(50+20*Math.random(),50+20*Math.random());
};

// -------- SIZE TOGGLE (50 / 75 / 100) --------
document.getElementById('size_toggle').onclick=()=>{
  currentSizeIndex=(currentSizeIndex+1)%sizeOptions.length;
  currentScaleValue=sizeOptions[currentSizeIndex];

  allPackages.forEach(pkg=>{
    pkg.style.transform=`scale(${currentScaleValue})`;
    pkg.style.transformOrigin='top left';
  });
};

</script>
</body>
</html>
