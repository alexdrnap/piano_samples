<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - Play Packages</title>
<style>
body {
    font-family: 'Segoe UI', sans-serif;
    padding: 10px;
    margin: 0;
    background-color: #1e1e1e;
    color: #eee;
}
h2 {
    text-align: center;
    color: #fff;
}

/* ---------- RESPONSIVE GRID ---------- */
#packagesContainer {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: flex-start;
}

/* ---------- PLAY PACKAGE CELL ---------- */
.playPackage {
    position: relative; 
    border: 1px solid #555;
    padding: 12px;
    background: #2c2c2c;
    aspect-ratio: 1 / 1; 
    box-sizing: border-box;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    display: inline-block;
    vertical-align: top;
    transition: width 0.2s, height 0.2s;
    width: 260px; /* default size, overridden by JS toggle */
}

/* ---------- PACKAGE HEADER ---------- */
.packageHeader {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #3a3a3a;
    padding: 8px 10px;
    border-radius: 8px;
    user-select: none;
}
.packageHeader span {
    font-weight: bold;
    color: #fff;
}

/* ---------- CLOSE BUTTON ---------- */
.deletePackage {
    background: #e74c3c;
    color: #fff;
    font-size: 1.2em;
    padding: 4px 8px;
    border-radius: 6px;
    touch-action: manipulation;
}

/* ---------- TRIAD & PLAY BUTTON ---------- */
.triadBtn, .playBtn {
    width: 100%;
    height: 70px;
    font-size: 0.95em;
    padding: 5px;
    text-align: center;
    border-radius: 8px;
    transition: transform 0.1s;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    word-break: break-word;
}
.triadBtn:active, .playBtn:active { transform: scale(0.97); }
.triadBtn.blackBtn, .playBtn.blackBtn { color: #fff; }

/* ---------- NAV BUTTONS ---------- */
.navButtons {
    display: flex;
    justify-content: center;
    margin: 6px 0;
}
.navButtons button {
    flex: 1;
    margin: 0 3px;
    background-color: #444;
    color: #fff;
    border-radius: 6px;
}
.navButtons button:hover { background-color: #555; }

/* ---------- SELECTS ---------- */
button, select {
    cursor: pointer;
    font-size: 0.95em;
    border: none;
    border-radius: 6px;
    outline: none;
}
select {
    padding: 6px 10px;
    margin: 0 5px 10px 0;
    background-color: #333;
    color: #eee;
}
.colorSelect {
    width: 100%;
    padding: 6px 10px;
    margin: 0 0 10px 0;
    background-color: #333;
    color: #eee;
    border-radius: 6px;
    box-sizing: border-box;
}
button {
    padding: 10px;
    background-color: #444;
    color: #fff;
    transition: background 0.2s;
}
button:hover { background-color: #555; }
.selectableText, .chordName { display: block; font-weight: 500; }

</style>
</head>
<body>
<h2>Chord Familiarity Generator - Play Packages</h2>

<label for="soundSelectGlobal">Select Sound:</label>
<select id="soundSelectGlobal" onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>
<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>
<button id="size_toggle">Toggle Size</button>

<div id="packagesContainer"></div>

<script src="https://unpkg.com/tone@latest"></script>
<script>
// ---------------- GLOBALS ----------------
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const colorMap={BASE:'#00AA00',RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',YELLOW:'#FFFF66',BLUE:'#6699FF',WHITE:'#FFFFFF',"LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'};
const colorOrder = ['BASE','RED','ORANGE','GOLD','YELLOW','BLUE','WHITE','LIGHT GREY','DARK GREY','BLACK'];

let allPackages = [];
let nextPackageNumber = 1;
let sizeOptions = [130, 200, 260]; // width in px
let currentSizeIndex = 2; // start at 260px

// ---------------- CREATE PACKAGE ----------------
function createPlayPackage(){
    const container = document.createElement('div');
    container.className='playPackage';
    container.dataset.pkgNumber = nextPackageNumber++;
    container.style.width = sizeOptions[currentSizeIndex] + 'px';
    container.innerHTML = `
        <div class="packageHeader"><span>Play Package ${container.dataset.pkgNumber}</span><button class="deletePackage">X</button></div>
        <select class="scaleSelect"><option value="major">major</option><option value="naturalMinor">naturalMinor</option></select>
        <select class="keySelect">${noteOrder.map(n=>`<option value="${n}">${n}</option>`).join('')}</select>
        <select class="colorSelect">${colorOrder.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        <button class="triadBtn"><span class="selectableText"></span><span class="chordName"></span></button>
        <div class="navButtons"><button class="prevBtn">◀</button><button class="nextBtn">▶</button></div>
        <button class="playBtn">Play</button>
    `;
    document.getElementById('packagesContainer').appendChild(container);
    allPackages.push(container);

    // DELETE BUTTON
    const deleteBtn = container.querySelector('.deletePackage');
    deleteBtn.onclick = () => {
        container.remove();
        allPackages = allPackages.filter(p => p!==container);
    };

    // INITIAL TRIAD CONTENT
    const triadBtn = container.querySelector('.triadBtn');
    triadBtn.querySelector('.selectableText').textContent = 'C-E-G';
    triadBtn.querySelector('.chordName').textContent = 'C major';
}

// ---------------- INSERT ----------------
document.getElementById('insertPackageBtn').onclick=()=>{ createPlayPackage(); };

// ---------------- SIZE TOGGLE ----------------
document.getElementById('size_toggle').onclick = () => {
    currentSizeIndex = (currentSizeIndex + 1) % sizeOptions.length;
    const newWidth = sizeOptions[currentSizeIndex];
    allPackages.forEach(pkg => {
        pkg.style.width = newWidth + 'px';
    });
};

</script>
</body>
</html>
