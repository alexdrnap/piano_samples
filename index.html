<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chord Familiarity Generator</title>

<script src="https://unpkg.com/tone@latest"></script>

<style>
body { font-family: sans-serif; padding: 10px; }

table { border-collapse: collapse; width: 100%; margin-top: 10px; }
th, td { border: 1px solid #777; padding: 6px; text-align: center; }

.colorBtn {
  min-width: 160px;
  padding: 10px;
  margin: 4px;
  cursor: pointer;
}

.blackText { color: white; }

.triadBlock {
  display: inline-block;
  margin: 6px;
  text-align: center;
}

.controls {
  margin-top: 4px;
}

.playBtn {
  width: 46px;
  height: 46px;
  font-size: 18px;
}
</style>
</head>

<body>

<h2>Chord Familiarity Generator</h2>

<select id="scaleSelect" onchange="generateAll()">
  <option value="major">Major</option>
  <option value="naturalMinor">Natural Minor</option>
  <option value="harmonicMinor">Harmonic Minor</option>
  <option value="melodicMinor">Melodic Minor</option>
</select>

<br><br>

<button id="playSource" onclick="playChord(activeSourceTriad)">
  Play Source
  <div style="font-size:11px" id="sourceTriadLabel"></div>
</button>

<br><br>

<select onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>

<div id="buttons"></div>
<div id="output"></div>

<script>
/* =======================
   THEORY / DATA MODULE
======================= */

const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const scales={
  major:['C','D','E','F','G','A','B'],
  naturalMinor:['C','D','Eb','F','G','Ab','Bb'],
  harmonicMinor:['C','D','Eb','F','G','Ab','B'],
  melodicMinor:['C','D','Eb','F','G','A','B']
};

const baseTriads={
  major:['C','E','G'],
  naturalMinor:['C','Eb','G'],
  harmonicMinor:['C','Eb','G'],
  melodicMinor:['C','Eb','G']
};

const dimTriad=['C','Eb','Gb'];
const augTriad=['C','E','G#'];

const colorOrder=['RED','ORANGE','GOLD','YELLOW','BLUE','WHITE','LIGHT GREY','DARK GREY','BLACK'];

const colorMap={
  RED:'#FF4C4C',
  ORANGE:'#FF9900',
  GOLD:'#FFD700',
  YELLOW:'#FFFF66',
  BLUE:'#6699FF',
  WHITE:'#FFFFFF',
  "LIGHT GREY":'#CCCCCC',
  "DARK GREY":'#888888',
  BLACK:'#000000'
};

function sourceAbbrev(key, mode){
  switch(mode){
    case 'major': return `${key}maj`;
    case 'naturalMinor': return `${key}min`;
    case 'harmonicMinor': return `${key}harm min`;
    case 'melodicMinor': return `${key}mel min`;
    case 'dim': return `${key}dim`;
    case 'aug': return `${key}aug`;
    default: return key;
  }
}

function normalize(note){
  return note
    .replace('Db','C#')
    .replace('Eb','D#')
    .replace('Gb','F#')
    .replace('Ab','G#')
    .replace('Bb','A#');
}

function noteIndex(n){
  return noteOrder.indexOf(normalize(n));
}

function transpose(note,semi){
  return noteOrder[(noteIndex(note)+semi+12)%12];
}

function classify(triad,ref,scale){
  let same=triad.filter(n=>ref.includes(n)).length;
  let inScale=triad.filter(n=>!ref.includes(n)&&scale.includes(n)).length;
  let out=3-same-inScale;

  if(same==2&&inScale==1)return['RED','3/4'];
  if(same==2&&out==1)return['ORANGE','3/5'];
  if(same==1&&inScale==2)return['GOLD','1/2'];
  if(same==1&&inScale==1&&out==1)return['YELLOW','2/5'];
  if(same==1&&out==2)return['BLUE','1/3'];
  if(same==0&&inScale==3)return['WHITE','1/6'];
  if(same==0&&inScale==2)return['LIGHT GREY','1/10'];
  if(same==0&&inScale==1)return['DARK GREY','1/20'];
  if(out==3)return['BLACK','0'];
}

function generateTriads(base){
  let res=new Set();
  [-2,-1,0,1,2].forEach(a=>{
    [-2,-1,0,1,2].forEach(b=>{
      [-2,-1,0,1,2].forEach(c=>{
        res.add([
          transpose(base[0],a),
          transpose(base[1],b),
          transpose(base[2],c)
        ].join(','));
      });
    });
  });
  return [...res].map(x=>x.split(','));
}

/* =======================
   AUDIO MODULE
======================= */

let sampler=null;
let synth=null;

const sampleChoiceMap={
  'C':['C5','C6'],
  'C#':['CSharp5'],
  'D':['D5'],
  'D#':['DSharp5'],
  'E':['E5'],
  'F':['F5'],
  'F#':['FSharp5'],
  'G':['G5'],
  'G#':['GSharp4','GSharp5'],
  'A':['A4','A5'],
  'A#':['ASharp4','ASharp5'],
  'B':['B4','B5']
};

async function changeSound(type){
  if(type==='piano' && !sampler){
    sampler=new Tone.Sampler({
      urls:{
        A4:"A4.wav",A5:"A5.wav",
        ASharp4:"ASharp4.wav",ASharp5:"ASharp5.wav",
        B4:"B4.wav",B5:"B5.wav",
        C5:"C5.wav",C6:"C6.wav",
        CSharp5:"CSharp5.wav",
        D5:"D5.wav",DSharp5:"DSharp5.wav",
        E5:"E5.wav",F5:"F5.wav",
        FSharp5:"FSharp5.wav",
        G5:"G5.wav",
        GSharp4:"GSharp4.wav",GSharp5:"GSharp5.wav"
      },
      baseUrl:"https://alexdrnap.github.io/piano_samples/"
    }).toDestination();
    await sampler.loaded;
  }
  if(type==='AMSynth'){
    synth=new Tone.PolySynth(Tone.AMSynth).toDestination();
  }
}

function playChord(triad){
  Tone.start();
  let norm=triad.map(normalize);
  let notes=norm.map((n,i)=>{
    let opt=sampleChoiceMap[n];
    if(!opt) return null;
    return i===0 ? opt[0] : (opt[1]||opt[0]);
  }).filter(Boolean);

  if(sampler) notes.forEach(n=>sampler.triggerAttackRelease(n,'1n'));
  if(synth) synth.triggerAttackRelease(norm.map(n=>n+'4'),'1n');
}

/* =======================
   UI MODULE
======================= */

let currentTriads=[];
let activeSourceTriad=[];

function generateAll(){
  const key='C';
  const mode=document.getElementById('scaleSelect').value;
  const scale=scales[mode];

  const sourceLabel=sourceAbbrev(key,mode);
  activeSourceTriad=baseTriads[mode];

  document.getElementById('sourceTriadLabel').innerText=activeSourceTriad.join('-');

  let list=[];
  generateTriads(baseTriads[mode]).forEach(t=>{
    const [c,d]=classify(t,baseTriads[mode],scale);
    list.push({triad:t,color:c,degree:d,sourceLabel});
  });

  (mode==='major'?generateTriads(augTriad):generateTriads(dimTriad)).forEach(t=>{
    const [c,d]=classify(t,baseTriads[mode],scale);
    list.push({
      triad:t,
      color:c,
      degree:d,
      sourceLabel:sourceAbbrev(key,mode==='major'?'aug':'dim')
    });
  });

  currentTriads=list.sort((a,b)=>colorOrder.indexOf(a.color)-colorOrder.indexOf(b.color));

  renderTable();
  renderButtons();
}

function renderTable(){
  let html='<table><tr><th>Triad</th><th>Color</th><th>Degree</th><th>Source</th></tr>';
  currentTriads.forEach(o=>{
    const bg=colorMap[o.color];
    const text=o.color==='BLACK'?'white':'black';
    html+=`<tr style="background:${bg};color:${text}">
      <td>${o.triad.join('-')}</td>
      <td>${o.color}</td>
      <td>${o.degree}</td>
      <td>${o.sourceLabel}</td>
    </tr>`;
  });
  html+='</table>';
  document.getElementById('output').innerHTML=html;
}

function renderButtons(){
  let html='';
  currentTriads.forEach(o=>{
    const bg=colorMap[o.color];
    const text=o.color==='BLACK'?'white':'black';
    html+=`
    <div class="triadBlock">
      <button class="colorBtn" style="background:${bg};color:${text}" onclick="playChord(${JSON.stringify(o.triad)})">
        ${o.triad.join('-')}<br>
        <small>Source: ${o.sourceLabel}</small>
      </button>
    </div>`;
  });
  document.getElementById('buttons').innerHTML=html;
}

changeSound('piano');
generateAll();
</script>

</body>
</html>
