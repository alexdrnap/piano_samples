<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Familiarity Generator - 20 Reference Scales</title>
<style>
body { font-family: sans-serif; padding: 10px; }
button, select { cursor: pointer; }
button.colorBtn { display: flex; flex-direction: column; align-items: center; min-width: 120px; padding: 5px; margin: 3px; }
button .chordName { font-size: 0.7em; color: #333; }
.selectableText { user-select: text; cursor: text; }
.playPackage { position: absolute; border: 1px solid #888; padding: 5px; background: #f9f9f9; width: 160px; z-index: 1000; }
.packageHeader { display: flex; justify-content: space-between; align-items: center; cursor: move; background: #ddd; padding: 2px 5px; }
.navButtons { display: flex; justify-content: center; margin: 3px 0; }
.navButtons button { margin: 0 2px; }
.triadBtn, .playBtn { width: 100%; margin: 3px 0; height: 40px; font-size: 0.9em; }
.deletePackage { background:red; color:white; border:none; cursor:pointer; padding:0 5px; }
.blackBtn { color:white !important; }
</style>
</head>
<body>
<h2>Chord Familiarity Generator - Play Packages</h2>

<label for="soundSelectGlobal">Select Sound:</label>
<select id="soundSelectGlobal" onchange="changeSound(this.value)">
  <option value="piano">Piano</option>
  <option value="AMSynth">AMSynth</option>
</select>
<button id="insertPackageBtn">INSERT PLAY PACKAGE</button>

<script src="https://unpkg.com/tone@latest"></script>
<script>
// ---------------- Module 1: Data ----------------
const noteOrder=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const scaleIntervals = {
  major:[0,2,4,5,7,9,11],
  naturalMinor:[0,2,3,5,7,8,10],
  harmonicMinor:[0,2,3,5,7,8,11],
  melodicMinor:[0,2,3,5,7,9,11]
};
const baseTriadIntervals = {
  major:[0,4,7],
  naturalMinor:[0,3,7],
  harmonicMinor:[0,3,7],
  melodicMinor:[0,3,7]
};

// Triad-based scales
const customTriads = {
  'sus2_maj':[0,2,7], 'sus2_min':[0,2,7],
  'sus4_maj':[0,5,7], 'sus4_min':[0,5,7],
  '+_maj':[0,4,8], '+_min':[0,4,8],
  '°_maj':[0,3,6], '°_min':[0,3,6],
  '7_3Tm_maj':[0,2,6], '7_3Tm_min':[0,2,6],
  '1/2dim_3TM_maj':[0,4,6], '1/2dim_3TM_min':[0,4,6],
  '1/2dim_4m_maj':[0,2,5], '1/2dim_4m_min':[0,2,5],
  '7_4M_maj':[0,3,5], '7_4M_min':[0,3,5]
};
const triadReferenceScale = {
  'sus2_maj':'major','sus4_maj':'major','+_maj':'major','°_maj':'major','7_3Tm_maj':'major','1/2dim_3TM_maj':'major','1/2dim_4m_maj':'major','7_4M_maj':'major',
  'sus2_min':'naturalMinor','sus4_min':'naturalMinor','+_min':'naturalMinor','°_min':'naturalMinor','7_3Tm_min':'naturalMinor','1/2dim_3TM_min':'naturalMinor','1/2dim_4m_min':'naturalMinor','7_4M_min':'naturalMinor'
};

// Colors
const colorMap={BASE:'#00AA00',RED:'#FF4C4C',ORANGE:'#FF9900',GOLD:'#FFD700',YELLOW:'#FFFF66',BLUE:'#6699FF',WHITE:'#FFFFFF',"LIGHT GREY":'#CCCCCC',"DARK GREY":'#888888',BLACK:'#000000'};
const colorOrder = ['BASE','RED','ORANGE','GOLD','YELLOW','BLUE','WHITE','LIGHT GREY','DARK GREY','BLACK'];

// Samples
const sampleChoiceMap = {
  "C":["C5","C6"], "C#":["C#5"], "D":["D5"], "D#":["D#5"], "E":["E5"], "F":["F5"], "F#":["F#5"],
  "G":["G5"], "G#":["G#4","G#5"], "A":["A4","A5"], "A#":["A#4","A#5"], "B":["B4","B5"]
};
const pianoSamplerUrls = {
  "A4":"A4.wav","A5":"A5.wav","A#4":"ASharp4.wav","A#5":"ASharp5.wav","B4":"B4.wav","B5":"B5.wav",
  "C5":"C5.wav","C6":"C6.wav","C#5":"CSharp5.wav","D5":"D5.wav","D#5":"DSharp5.wav","E5":"E5.wav",
  "F5":"F5.wav","F#5":"FSharp5.wav","G5":"G5.wav","G#4":"GSharp4.wav","G#5":"GSharp5.wav"
};

// ---------------- Triad Functions ----------------
function noteIndex(note){return noteOrder.indexOf(note);}
function transpose(note,semitones){return noteOrder[(noteIndex(note)+12+semitones)%12];}
function normalizeEnharmonics(triad){ return triad.map(n=>{
  switch(n){ case 'Db': return 'C#'; case 'Eb': return 'D#'; case 'Gb': return 'F#'; case 'Ab': return 'G#'; case 'Bb': return 'A#'; default: return n; } }); }

function classify(triad,refBase,scale){
  if(triad.slice().sort().join(',') === refBase.slice().sort().join(',')) return ['BASE','1/1'];
  let same=triad.filter(n=>refBase.includes(n)).length;
  let inScale=triad.filter(n=>!refBase.includes(n)&&scale.includes(n)).length;
  let outScale=triad.length-same-inScale;
  if(same==2&&inScale==1)return['RED','3/4'];
  if(same==2&&outScale==1)return['ORANGE','3/5'];
  if(same==1&&inScale==2)return['GOLD','1/2'];
  if(same==1&&inScale==1&&outScale==1)return['YELLOW','2/5'];
  if(same==1&&outScale==2)return['BLUE','1/3'];
  if(same==0&&inScale==3)return['WHITE','1/6'];
  if(same==0&&inScale==2&&outScale==1)return['LIGHT GREY','1/10'];
  if(same==0&&inScale==1&&outScale==2)return['DARK GREY','1/20'];
  if(same==0&&outScale==3)return['BLACK','0'];
  return['UNKNOWN','-'];
}

function nameTriad(triad){
  if(new Set(triad).size<3) return '';
  triad=normalizeEnharmonics(triad);
  const semitone=note=>noteOrder.indexOf(note);
  const mod12=n=> (n+12)%12;
  let tri=triad.map(n=>semitone(n));
  function intervalsFrom(rot){ let ints=rot.map(n=>mod12(n-rot[0])); ints.sort((a,b)=>a-b); return ints; }
  const triads=[{i:[0,4,7],l:'major'},{i:[0,3,7],l:'minor'},{i:[0,3,6],l:'dim'},{i:[0,4,8],l:'aug'},{i:[0,2,7],l:'sus2'},{i:[0,5,7],l:'sus4'}];
  for(let s=0;s<3;s++){ let rot=[tri[s],tri[(s+1)%3],tri[(s+2)%3]]; let ints=intervalsFrom(rot);
    for(let t of triads) if(JSON.stringify(ints)===JSON.stringify(t.i)) return noteOrder[rot[0]]+' '+t.l; }
  for(let s=0;s<3;s++){ let rot=[tri[s],tri[(s+1)%3],tri[(s+2)%3]]; let i1=mod12(rot[1]-rot[0]); let i2=mod12(rot[2]-rot[1]);
    if(i1===2 && i2===3) return noteOrder[rot[0]]+' 1/2dim_4m';
    if(i1===3 && i2===2) return noteOrder[rot[2]]+' 7_4M';
    if(i1===4 && i2===2) return noteOrder[rot[2]]+' 1/2dim_3TM';
    if(i1===2 && i2===4) return noteOrder[rot[1]]+' 7_3Tm'; }
  return ''; 
}

// ---------------- Playback ----------------
let currentSound='piano', pianoSampler=null, currentSynth=null;
async function changeSound(sound){ currentSound=sound;
  if(sound==='piano' && !pianoSampler){ 
    pianoSampler = new Tone.Sampler({ urls:pianoSamplerUrls, baseUrl:"https://raw.githubusercontent.com/alexdrnap/piano_samples/main/" }).toDestination();
    await pianoSampler.loaded; 
  } 
}
function getTriadSamples(triad){
  const normalized=triad.map(n=>{ switch(n){ case 'Db': return 'C#'; case 'Eb': return 'D#'; case 'Gb': return 'F#'; case 'Ab': return 'G#'; case 'Bb': return 'A#'; default: return n; } });
  let notes=normalized.map((note,i)=>{ const options=sampleChoiceMap[note]; if(!options) return null; return (i===0?options[0]:options[1]||options[0]); });
  const a=noteIndex(normalized[0]), b=noteIndex(normalized[1]), c=noteIndex(normalized[2]);
  if(b-a===-1||b-a===-2) notes=[notes[1],notes[0],notes[2]];
  else if(b-c===1||b-c===2) notes=[notes[0],notes[2],notes[1]];
  return notes.filter(Boolean);
}
async function playChord(triad){
  await Tone.start(); if(currentSynth){currentSynth.dispose();currentSynth=null;}
  const notes=getTriadSamples(triad);
  if(currentSound==='piano' && pianoSampler) notes.forEach(n=>pianoSampler.triggerAttackRelease(n,'1n'));
  else if(currentSound==='AMSynth'){ currentSynth=new Tone.PolySynth(Tone.AMSynth).toDestination(); currentSynth.triggerAttackRelease(notes,'1n'); }
}

// ---------------- Precompute ----------------
// … [omitted for brevity, same as previous version but with corrected customTriads base note calculation] …

// ---------------- Play Package ----------------
function createPlayPackage(x=50,y=50){
  const container=document.createElement('div'); container.className='playPackage'; container.style.left=x+'px'; container.style.top=y+'px';
  container.innerHTML=`
    <div class="packageHeader"><span>Play Package</span><button class="deletePackage">X</button></div>
    <select class="scaleSelect">${referenceScales.map(s=>`<option value="${s}">${s}</option>`)}</select>
    <select class="keySelect">${noteOrder.map(n=>`<option value="${n}">${n}</option>`)}</select>
    <select class="colorSelect">${colorOrder.map(c=>`<option value="${c}">${c}</option>`)}</select>
    <button class="triadBtn"><span class="selectableText"></span><span class="chordName"></span></button>
    <div class="navButtons"><button class="prevBtn">◀</button><button class="nextBtn">▶</button></div>
    <button class="playBtn">Play</button>
  `;
  document.body.appendChild(container);

  let currentIndex=0;
  function updateTriad(){ 
    const scale=container.querySelector('.scaleSelect').value;
    const key=container.querySelector('.keySelect').value;
    const color=container.querySelector('.colorSelect').value;
    const list=allTriads[scale][key].filter(t=>t.color===color);
    if(list.length===0){ container.querySelector('.triadBtn .selectableText').textContent=''; container.querySelector('.chordName').textContent=''; return; }
    currentIndex=(currentIndex+list.length)%list.length;
    const t=list[currentIndex];
    const btn=container.querySelector('.triadBtn');
    btn.querySelector('.selectableText').textContent=t.triad.join('-');
    btn.querySelector('.chordName').innerHTML=t.name+'<br>(Source: '+t.source+')';
    btn.style.background=colorMap[color];
    btn.className='triadBtn'+(color==='BLACK'?' blackBtn':'');
    const playBtn=container.querySelector('.playBtn');
    playBtn.style.background=colorMap[color];
    playBtn.className='playBtn'+(color==='BLACK'?' blackBtn':'');
  }

  container.querySelector('.scaleSelect').onchange=()=>{currentIndex=0; updateTriad();};
  container.querySelector('.keySelect').onchange=()=>{currentIndex=0; updateTriad();};
  container.querySelector('.colorSelect').onchange=()=>{currentIndex=0; updateTriad();};
  container.querySelector('.prevBtn').onclick=()=>{currentIndex--; updateTriad();};
  container.querySelector('.nextBtn').onclick=()=>{currentIndex++; updateTriad();};
  container.querySelector('.playBtn').onclick=()=>{ 
    const txt=container.querySelector('.triadBtn .selectableText').textContent;
    if(txt){ const tri=txt.split('-'); playChord(tri); } 
  };
  container.querySelector('.deletePackage').onclick=()=>container.remove();

  // ---------------- Dragging per package ----------------
  const header=container.querySelector('.packageHeader');
  let offsetX=0, offsetY=0, dragging=false;
  header.onmousedown=(e)=>{ dragging=true; offsetX=e.clientX-container.offsetLeft; offsetY=e.clientY-container.offsetTop; e.preventDefault(); };
  header.onmouseup=()=>dragging=false;
  header.onmouseleave=()=>dragging=false;
  header.onmousemove=(e)=>{ if(dragging){ container.style.left=(e.clientX-offsetX)+'px'; container.style.top=(e.clientY-offsetY)+'px'; } };

  updateTriad();
}

document.getElementById('insertPackageBtn').onclick=()=>createPlayPackage(50,50);
</script>
</body>
</html>
